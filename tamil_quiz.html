<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>7ம் வகுப்பு தமிழ் - பருவம் 3 இயல் 2 - வினா விடைகள் Quiz</title>
<style>
  :root{
    --maroon:#7a1530;
    --maroon-dark:#5e0f24;
    --cream:#faf7f0;
    --card:#ffffff;
    --ink:#2b2320;
    --muted:#8a7f75;
    --line:#e7ddd0;
    --badge:#f6dade;
    --badge-ink:#7a1530;
    --good:#1f7a4d;
    --bad:#b3261e;
    --gold:#c99a3a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:"Noto Sans Tamil","Latha","Nirmala UI",system-ui,sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:24px 14px 60px;
  }
  .wrap{width:100%;max-width:760px;}
  header.top{
    text-align:center;
    margin-bottom:18px;
  }
  header.top h1{
    font-size:1.35rem;
    line-height:1.4;
    margin:0 0 4px;
    color:var(--maroon-dark);
  }
  header.top p{
    margin:0;
    color:var(--muted);
    font-size:.95rem;
  }
  .progress-row{
    display:flex;
    align-items:center;
    gap:12px;
    margin:18px 0 6px;
    font-size:.9rem;
    color:var(--muted);
  }
  .progress-track{
    flex:1;
    height:8px;
    background:var(--line);
    border-radius:999px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background:linear-gradient(90deg,var(--maroon),var(--gold));
    width:0%;
    transition:width .35s ease;
  }
  .qnum{
    font-weight:600;
    color:var(--maroon-dark);
    white-space:nowrap;
  }
  .card{
    background:var(--card);
    border-radius:18px;
    border:1px solid var(--line);
    box-shadow:0 2px 14px rgba(122,21,48,.06);
    overflow:hidden;
    margin-bottom:18px;
  }
  .card .bar{
    height:6px;
    background:linear-gradient(90deg,var(--maroon-dark),var(--maroon));
  }
  .card .body{
    padding:26px 24px 22px;
  }
  .question-tag{
    display:inline-block;
    background:var(--maroon);
    color:#fff;
    font-size:.8rem;
    padding:4px 14px;
    border-radius:999px;
    margin-bottom:16px;
  }
  .question-text{
    font-size:1.15rem;
    line-height:1.6;
    margin:0 0 20px;
    font-weight:600;
  }
  .options{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
  }
  @media (max-width:520px){
    .options{grid-template-columns:1fr;}
  }
  .opt{
    display:flex;
    align-items:center;
    gap:12px;
    border:1.5px solid var(--line);
    border-radius:12px;
    padding:12px 14px;
    background:#fff;
    cursor:pointer;
    font-size:1rem;
    text-align:left;
    transition:border-color .15s, background .15s, transform .1s;
  }
  .opt:hover{border-color:var(--maroon);}
  .opt:active{transform:scale(.99);}
  .opt .lbl{
    width:30px;height:30px;
    flex:0 0 30px;
    border-radius:50%;
    background:var(--badge);
    color:var(--badge-ink);
    font-weight:700;
    display:flex;align-items:center;justify-content:center;
    font-size:.95rem;
  }
  .opt.correct{
    border-color:var(--good);
    background:#eaf6ef;
  }
  .opt.correct .lbl{background:var(--good);color:#fff;}
  .opt.incorrect{
    border-color:var(--bad);
    background:#fbebea;
  }
  .opt.incorrect .lbl{background:var(--bad);color:#fff;}
  .opt.disabled{cursor:default;}
  .opt.faded{opacity:.55;}

  .nav-row{
    display:flex;
    justify-content:space-between;
    gap:10px;
    margin-top:4px;
  }
  button.navbtn{
    flex:1;
    padding:13px 10px;
    border-radius:12px;
    border:1.5px solid var(--maroon);
    background:#fff;
    color:var(--maroon-dark);
    font-size:.98rem;
    font-weight:600;
    cursor:pointer;
    font-family:inherit;
  }
  button.navbtn.primary{
    background:var(--maroon);
    color:#fff;
  }
  button.navbtn:disabled{
    opacity:.4;
    cursor:not-allowed;
  }

  .score-card{
    text-align:center;
    padding:34px 20px;
  }
  .score-card .pct{
    font-size:3rem;
    font-weight:800;
    color:var(--maroon-dark);
    margin:6px 0 0;
  }
  .score-card .pctlabel{
    color:var(--muted);
    font-size:.85rem;
    letter-spacing:.03em;
  }
  .score-card .detail{
    margin:14px 0 22px;
    font-size:1.05rem;
  }
  .score-card .detail b.g{color:var(--good);}
  .score-card .detail b.r{color:var(--bad);}
  .score-actions{
    display:flex;
    gap:12px;
    justify-content:center;
    flex-wrap:wrap;
  }

  .review-item{
    border-bottom:1px solid var(--line);
    padding:16px 0;
  }
  .review-item:last-child{border-bottom:none;}
  .review-item .qt{font-weight:600;margin-bottom:8px;}
  .review-item .row{font-size:.95rem;margin:3px 0;}
  .review-item .row.your.wrong{color:var(--bad);}
  .review-item .row.your.right{color:var(--good);}
  .review-item .row.ans{color:var(--good);}

  footer.foot{
    text-align:center;
    color:var(--muted);
    font-size:.82rem;
    margin-top:10px;
  }

  .hidden{display:none !important;}
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <h1>7ம் வகுப்பு தமிழ் — பருவம் 3, இயல் 2</h1>
    <p>வினா விடைகள் — Interactive Quiz</p>
  </header>

  <div id="quizView">
    <div class="progress-row">
      <span class="qnum" id="qnumLabel">Question 1 of 100</span>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <span id="pctLabel">0%</span>
    </div>

    <div class="card">
      <div class="bar"></div>
      <div class="body">
        <span class="question-tag" id="qtag">கேள்வி 1</span>
        <p class="question-text" id="qtext"></p>
        <div class="options" id="optionsWrap"></div>
      </div>
    </div>

    <div class="nav-row">
      <button class="navbtn" id="prevBtn">← முந்தையது</button>
      <button class="navbtn primary" id="nextBtn">அடுத்தது →</button>
    </div>
  </div>

  <div id="scoreView" class="card hidden">
    <div class="bar"></div>
    <div class="body score-card">
      <div class="pctlabel">SCORE</div>
      <div class="pct" id="finalPct">0%</div>
      <div class="detail">
        <b class="g" id="correctCount">0</b> சரி &nbsp;|&nbsp;
        <b class="r" id="wrongCount">0</b> தவறு &nbsp;|&nbsp;
        மொத்தம் 100 வினாக்கள்
      </div>
      <div class="score-actions">
        <button class="navbtn primary" id="reviewBtn">விடைகளை மதிப்பாய்வு செய்க (Review Answers)</button>
        <button class="navbtn" id="restartBtn">மீண்டும் தொடங்கு (Restart Quiz)</button>
      </div>
    </div>
  </div>

  <div id="reviewView" class="card hidden">
    <div class="bar"></div>
    <div class="body" id="reviewBody" style="max-height:70vh;overflow-y:auto;"></div>
    <div class="body" style="padding-top:0;">
      <button class="navbtn primary" id="backFromReview" style="width:100%;">மீண்டும் தொடங்கு (Restart Quiz)</button>
    </div>
  </div>

  <footer class="foot">Vagai Sudar · 7th Std Tamil Term 3 Unit 2 · ஆஃப்லைன் வினாடி வினா</footer>
</div>

<script>
const QUESTIONS = [
{q:"'வையம்' என்னும் சொல்லின் பொருள் என்ன?",o:["கடல்","உலகம்","வானம்","நெருப்பு"],a:1},
{q:"'வெய்ய' என்னும் சொல்லின் பொருள் என்ன?",o:["குளிர்ச்சி வீசும்","வெப்பக்கதிர் வீசும்","இருள் சூழ்ந்த","ஒளி பொருந்திய"],a:1},
{q:"'சுடர் ஆழியான்' என்று அழைக்கப்படுபவர் யார்?",o:["சிவன்","திருமால்","பிரம்மா","முருகன்"],a:1},
{q:"'இடர் ஆழி' என்பதில் 'இடர்' என்பதன் பொருள் என்ன?",o:["மகிழ்ச்சி","ஆர்வம்","துன்பம்","இன்பம்"],a:2},
{q:"பொய்கையாழ்வார் பூமியை எவ்விதமாக உருவகப்படுத்துகிறார்?",o:["அகல்விளக்கு","நெய்","சுடர்","திரி"],a:0},
{q:"பொய்கையாழ்வார் ஒலிக்கின்ற கடலை எவ்வாறு உருவகப்படுத்துகிறார்?",o:["சுடர்","விளக்கு","நெய்","மாலை"],a:2},
{q:"பொய்கையாழ்வார் கதிரவனை எவ்வாறு உருவகப்படுத்துகிறார்?",o:["நெய்","சுடர்","கடல்","விளக்கு"],a:3},
{q:"பொய்கையாழ்வார் பிறந்த ஊர் எது?",o:["மாமல்லபுரம்","திருமுனைப்பாடி","திருவெஃகா","குன்றக்குடி"],a:2},
{q:"திருவெஃகா என்னும் ஊர் எந்த மாவட்டத்திற்கு அருகில் உள்ளது?",o:["காஞ்சிபுரம்","சென்னை","மதுரை","திருச்சி"],a:0},
{q:"நாலாயிரத் திவ்வியப் பிரபந்தத்தில் உள்ள முதல் திருவந்தாதியைப் பாடியவர் யார்?",o:["பேயாழ்வார்","பூதத்தாழ்வார்","பொய்கையாழ்வார்","நம்மாழ்வார்"],a:2},
{q:"'தகளி' என்னும் சொல்லின் பொருள் என்ன?",o:["எண்ணெய்","திரி","சுடர்","அகல்விளக்கு"],a:3},
{q:"'சிந்தை' என்னும் சொல்லின் பொருள் என்ன?",o:["அறிவு","மனம்","செயல்","சொல்"],a:1},
{q:"'ஞானம்' என்னும் சொல்லின் பொருள் என்ன?",o:["அறியாமை","அறிவு","செல்வம்","வறுமை"],a:1},
{q:"'நாரணன்' என்று அழைக்கப்படுபவர் யார்?",o:["பிரம்மா","திருமால்","சிவன்","இந்திரன்"],a:1},
{q:"பூதத்தாழ்வார் அன்பை எவ்விதமாக உருவகப்படுத்துகிறார்?",o:["நெய்","திரி","சுடர்","அகல்விளக்கு"],a:3},
{q:"பூதத்தாழ்வார் ஆர்வத்தை எவ்விதமாக உருவகப்படுத்துகிறார்?",o:["திரி","நெய்","அகல்விளக்கு","சுடர்"],a:1},
{q:"பூதத்தாழ்வார் சிந்தையை (மனம்) எவ்விதமாக உருவகப்படுத்துகிறார்?",o:["இடுகின்ற திரி","அகல்விளக்கு","நெய்","சுடர்"],a:0},
{q:"ஞானத்தமிழ் பயின்றவர் என்று தன்னைக் கூறிக் கொள்பவர் யார்?",o:["பொய்கையாழ்வார்","பூதத்தாழ்வார்","பேயாழ்வார்","திருமங்கையாழ்வார்"],a:1},
{q:"அந்தாதி என்பதில் 'அந்தம்' என்பதன் பொருள் என்ன?",o:["முதல்","இடை","முடிவு","தொடக்கம்"],a:2},
{q:"அந்தாதி என்பதில் 'ஆதி' என்பதன் பொருள் என்ன?",o:["முடிவு","இடை","முதல்","இறுதி"],a:2},
{q:"அந்தாதி என்பது எவ்வகை இலக்கியங்களில் ஒன்று?",o:["காப்பியம்","சிற்றிலக்கியம்","புதுக்கவிதை","புதினம்"],a:1},
{q:"பூதத்தாழ்வார் பிறந்த ஊர் எது?",o:["திருவெஃகா","திருமுனைப்பாடி","மாமல்லபுரம்","குன்றக்குடி"],a:2},
{q:"மாமல்லபுரம் எந்த நகரத்திற்கு அடுத்துள்ளது?",o:["காஞ்சிபுரம்","சென்னை","செங்கல்பட்டு","வேலூர்"],a:1},
{q:"நாலாயிரத் திவ்வியப் பிரபந்தத்தில் இரண்டாம் திருவந்தாதியைப் பாடியவர் யார்?",o:["பூதத்தாழ்வார்","பொய்கையாழ்வார்","பேயாழ்வார்","ஆண்டாள்"],a:0},
{q:"'ஞானச்சுடர்' என்னும் சொல்லைப் பிரித்து எழுதக் கிடைப்பது எது?",o:["ஞான + சுடர்","ஞானச் + சுடர்","ஞானம் + சுடர்","ஞானி + சுடர்"],a:2},
{q:"இன்பு + உருகு என்பதனைச் சேர்த்தெழுதக் கிடைக்கும் சொல் எது?",o:["இன்பு உருகு","இன்பும் உருகு","இன்பருகு","இன்புருகு"],a:3},
{q:"'வித்து' என்னும் சொல்லின் பொருள் என்ன?",o:["நிலம்","விதை","செடி","பயிர்"],a:1},
{q:"'ஈன' என்னும் சொல்லின் பொருள் என்ன?",o:["பெற","இழக்க","கொடுக்க","விதைக்க"],a:2},
{q:"'களை' என்னும் சொல்லின் பொருள் என்ன?",o:["பசுமையான பயிர்","வேண்டாத செடி","விளைநிலம்","எரு"],a:1},
{q:"'பைங்கூழ்' என்னும் சொல்லின் பொருள் என்ன?",o:["காய்ந்த புல்","வேண்டாத செடி","பசுமையான பயிர்","நல்ல விதை"],a:2},
{q:"'வன்சொல்' என்னும் சொல்லின் பொருள் என்ன?",o:["இன்சொல்","கடுஞ்சொல்","உண்மை","பொய்"],a:1},
{q:"முனைப்பாடியார் விளைநிலமாக எதனை உருவகப்படுத்துகிறார்?",o:["இன்சொல்","வன்சொல்","ஈகை","உண்மை"],a:3},
{q:"முனைப்பாடியார் விதையாக எதனை உருவகப்படுத்துகிறார்?",o:["அன்பு","அறம்","ஈகை","வாய்மை"],a:1},
{q:"முனைப்பாடியார் களையாக எதனை நீக்க வேண்டும் என்கிறார்?",o:["இன்சொல்","வன்சொல்","பொய்மை","கோபம்"],a:1},
{q:"முனைப்பாடியார் எருவாக எதனை இடவேண்டும் என்கிறார்?",o:["ஈகை","அன்பு","வாய்மை","அறம்"],a:0},

let current = 0;
let answers = new Array(QUESTIONS.length).fill(null);

const qtext = document.getElementById('qtext');
const qtag = document.getElementById('qtag');
const optionsWrap = document.getElementById('optionsWrap');
const qnumLabel = document.getElementById('qnumLabel');
const pctLabel = document.getElementById('pctLabel');
const progressFill = document.getElementById('progressFill');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const quizView = document.getElementById('quizView');
const scoreView = document.getElementById('scoreView');
const reviewView = document.getElementById('reviewView');

const LETTERS = ['A','B','C','D'];

function renderQuestion(){
  const item = QUESTIONS[current];
  qtag.textContent = 'கேள்வி ' + (current+1);
  qtext.textContent = item.q;
  qnumLabel.textContent = 'Question ' + (current+1) + ' of ' + QUESTIONS.length;
  const pct = Math.round(((current)/QUESTIONS.length)*100);
  pctLabel.textContent = pct + '%';
  progressFill.style.width = pct + '%';

  optionsWrap.innerHTML = '';
  item.o.forEach((optText, idx)=>{
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.innerHTML = '<span class="lbl">'+LETTERS[idx]+'</span><span>'+optText+'</span>';
    const chosen = answers[current];
    if(chosen !== null){
      btn.classList.add('disabled');
      if(idx === item.a) btn.classList.add('correct');
      else if(idx === chosen) btn.classList.add('incorrect');
      else btn.classList.add('faded');
    }
    btn.addEventListener('click', ()=>{
      if(answers[current] !== null) return;
      answers[current] = idx;
      renderQuestion();
    });
    optionsWrap.appendChild(btn);
  });

  prevBtn.disabled = current === 0;
  nextBtn.textContent = (current === QUESTIONS.length-1) ? 'முடிக்க →' : 'அடுத்தது →';
}

prevBtn.addEventListener('click', ()=>{
  if(current > 0){ current--; renderQuestion(); }
});
nextBtn.addEventListener('click', ()=>{
  if(current < QUESTIONS.length-1){
    current++;
    renderQuestion();
  } else {
    showScore();
  }
});

function showScore(){
  quizView.classList.add('hidden');
  reviewView.classList.add('hidden');
  scoreView.classList.remove('hidden');
  let correct = 0, wrong = 0;
  answers.forEach((a,i)=>{
    if(a === null) return;
    if(a === QUESTIONS[i].a) correct++; else wrong++;
  });
  const pct = Math.round((correct/QUESTIONS.length)*100);
  document.getElementById('finalPct').textContent = pct + '%';
  document.getElementById('correctCount').textContent = correct;
  document.getElementById('wrongCount').textContent = wrong;
}

document.getElementById('reviewBtn').addEventListener('click', ()=>{
  scoreView.classList.add('hidden');
  reviewView.classList.remove('hidden');
  const body = document.getElementById('reviewBody');
  body.innerHTML = '';
  QUESTIONS.forEach((item,i)=>{
    const chosen = answers[i];
    const div = document.createElement('div');
    div.className = 'review-item';
    let yourRow = '';
    if(chosen === null){
      yourRow = '<div class="row your wrong">உங்கள் விடை: — (பதிலளிக்கவில்லை)</div>';
    } else if(chosen === item.a){
      yourRow = '<div class="row your right">உங்கள் விடை: '+LETTERS[chosen]+'. '+item.o[chosen]+' ✓</div>';
    } else {
      yourRow = '<div class="row your wrong">உங்கள் விடை: '+LETTERS[chosen]+'. '+item.o[chosen]+' ✗</div>';
    }
    const ansRow = (chosen !== item.a) ? '<div class="row ans">சரியான விடை: '+LETTERS[item.a]+'. '+item.o[item.a]+'</div>' : '';
    div.innerHTML = '<div class="qt">'+(i+1)+'. '+item.q+'</div>'+yourRow+ansRow;
    body.appendChild(div);
  });
});

function restartQuiz(){
  current = 0;
  answers = new Array(QUESTIONS.length).fill(null);
  scoreView.classList.add('hidden');
  reviewView.classList.add('hidden');
  quizView.classList.remove('hidden');
  renderQuestion();
}
document.getElementById('restartBtn').addEventListener('click', restartQuiz);
document.getElementById('backFromReview').addEventListener('click', restartQuiz);

renderQuestion();
</script>
</body>
</html>

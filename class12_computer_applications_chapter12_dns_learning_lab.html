<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>பாடம் 12 — களப்பெயர் முறைமை (DNS) | Computer Applications Learning Lab</title>
<style>
  :root{
    --bg:#f3f6f8;
    --card:#ffffff;
    --primary:#0f766e;
    --primary-dark:#0b544e;
    --primary-light:#e6f5f3;
    --accent:#7c3aed;
    --accent-light:#f1e9ff;
    --correct:#15803d;
    --correct-bg:#eafaf0;
    --incorrect:#c0392b;
    --incorrect-bg:#fdecec;
    --warn:#b45309;
    --warn-bg:#fff6e6;
    --text:#1b2430;
    --muted:#5b6673;
    --border:#dfe6ea;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Noto Sans Tamil','Latha','Nirmala UI','Segoe UI',Tahoma,sans-serif;
    background:var(--bg);
    color:var(--text);
    line-height:1.65;
  }
  [lang-ta]{font-size:1rem;}
  h1,h2,h3,h4{line-height:1.45;}
  a{color:var(--primary);}
  button{font-family:inherit;}
  .app-shell{display:flex;flex-direction:column;min-height:100vh;}

  /* ---- Header ---- */
  header.top{
    background:linear-gradient(120deg,var(--primary-dark),var(--primary));
    color:#fff;
    padding:12px 16px;
    display:flex;
    align-items:center;
    gap:12px;
    position:sticky;top:0;z-index:40;
    box-shadow:0 2px 10px rgba(0,0,0,.15);
  }
  header.top .burger{
    background:rgba(255,255,255,.15);border:none;color:#fff;border-radius:8px;
    width:40px;height:40px;font-size:1.2rem;cursor:pointer;flex:0 0 auto;
    display:none;align-items:center;justify-content:center;
  }
  header.top .title-wrap{flex:1;min-width:0;}
  header.top h1{margin:0;font-size:1.05rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  header.top p{margin:0;font-size:.75rem;color:#d7efec;}
  header.top .lang-toggle{
    display:flex;background:rgba(255,255,255,.15);border-radius:999px;padding:3px;flex:0 0 auto;
  }
  header.top .lang-toggle button{
    border:none;background:transparent;color:#eafaf8;padding:6px 12px;border-radius:999px;
    font-size:.8rem;font-weight:700;cursor:pointer;
  }
  header.top .lang-toggle button.active{background:#fff;color:var(--primary-dark);}

  .body-row{display:flex;flex:1;min-height:0;}

  /* ---- Sidebar ---- */
  nav.sidebar{
    width:280px;flex:0 0 auto;background:#fff;border-right:1px solid var(--border);
    padding:16px 10px 90px;overflow-y:auto;
  }
  nav.sidebar .progress-wrap{padding:6px 8px 16px;}
  nav.sidebar .progress-label{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted);margin-bottom:6px;}
  nav.sidebar .progress-bar{height:8px;background:var(--border);border-radius:999px;overflow:hidden;}
  nav.sidebar .progress-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));transition:width .3s;}
  .topic-btn{
    display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;
    background:transparent;border:none;border-radius:10px;padding:10px 10px;margin-bottom:4px;
    cursor:pointer;font-size:.92rem;color:var(--text);
  }
  .topic-btn:hover{background:var(--primary-light);}
  .topic-btn.active{background:var(--primary-light);color:var(--primary-dark);font-weight:700;}
  .topic-btn .num{flex:0 0 auto;font-size:.72rem;color:var(--muted);background:#eef1f4;border-radius:6px;padding:2px 6px;min-width:50px;text-align:center;}
  .topic-btn.active .num{background:var(--primary);color:#fff;}
  .topic-btn .chk{flex:0 0 auto;margin-left:auto;color:var(--correct);font-weight:800;}
  .sidebar-section-label{font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:14px 8px 6px;}

  .sidebar-backdrop{display:none;}

  /* ---- Main ---- */
  main.content{flex:1;min-width:0;padding:22px 20px 110px;overflow-y:auto;}
  .content-inner{max-width:900px;margin:0 auto;}
  .topic-header{margin-bottom:18px;}
  .topic-header .crumb{font-size:.8rem;color:var(--muted);margin-bottom:4px;}
  .topic-header h2{margin:0 0 6px;font-size:1.5rem;color:var(--primary-dark);}
  .topic-header .goals{background:var(--primary-light);border-radius:12px;padding:12px 16px;font-size:.92rem;}
  .topic-header .goals b{color:var(--primary-dark);}

  .card{
    background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    padding:18px 18px;margin-bottom:18px;box-shadow:0 2px 10px rgba(20,30,40,.04);
  }
  .card h3{margin-top:0;color:var(--primary-dark);font-size:1.12rem;}
  .card h4{color:var(--accent);font-size:1rem;margin-bottom:6px;}

  .tb-def{background:#eef4ff;border-left:5px solid #2563eb;border-radius:10px;padding:12px 16px;margin:12px 0;}
  .tb-def .lbl{font-weight:800;color:#1d4ed8;font-size:.82rem;margin-bottom:4px;display:block;}
  .easy{background:var(--primary-light);border-left:5px solid var(--primary);border-radius:10px;padding:12px 16px;margin:12px 0;}
  .easy .lbl{font-weight:800;color:var(--primary-dark);font-size:.82rem;margin-bottom:4px;display:block;}
  .analogy{background:#fff7ed;border-left:5px solid #ea580c;border-radius:10px;padding:12px 16px;margin:12px 0;}
  .analogy .lbl{font-weight:800;color:#c2410c;font-size:.82rem;margin-bottom:4px;display:block;}
  .example-box{background:#f5f3ff;border-left:5px solid var(--accent);border-radius:10px;padding:12px 16px;margin:12px 0;}
  .example-box .lbl{font-weight:800;color:var(--accent);font-size:.82rem;margin-bottom:4px;display:block;}
  .activity-box{background:#ecfeff;border-left:5px solid #0891b2;border-radius:10px;padding:12px 16px;margin:12px 0;}
  .activity-box .lbl{font-weight:800;color:#0e7490;font-size:.82rem;margin-bottom:4px;display:block;}
  .mistake-box{background:var(--warn-bg);border-left:5px solid var(--warn);border-radius:10px;padding:12px 16px;margin:12px 0;}
  .mistake-box .lbl{font-weight:800;color:var(--warn);font-size:.82rem;margin-bottom:4px;display:block;}
  .exam-point{background:#fdf2f8;border-left:5px solid #db2777;border-radius:10px;padding:12px 16px;margin:12px 0;}
  .exam-point .lbl{font-weight:800;color:#be185d;font-size:.82rem;margin-bottom:4px;display:block;}
  .tryit-box{background:#f0fdf4;border:2px dashed #16a34a;border-radius:10px;padding:14px 16px;margin:12px 0;}
  .tryit-box .lbl{font-weight:800;color:#15803d;font-size:.82rem;margin-bottom:4px;display:block;}
  .quickcheck{background:#f8fafc;border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin:12px 0;}
  .quickcheck .lbl{font-weight:800;color:var(--muted);font-size:.82rem;margin-bottom:4px;display:block;}

  table.tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.92rem;}
  table.tbl th, table.tbl td{border:1px solid var(--border);padding:8px 10px;text-align:left;}
  table.tbl th{background:var(--primary-light);color:var(--primary-dark);}
  table.tbl tr:nth-child(even) td{background:#fafbfc;}

  .eng{color:var(--muted);font-weight:600;}
  code, .mono{font-family:'JetBrains Mono',Consolas,Menlo,monospace;background:#eef1f4;padding:1px 6px;border-radius:6px;font-size:.9em;}

  /* Diagrams */
  .diagram-box{background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px;margin:12px 0;overflow-x:auto;}
  .diagram-cap{text-align:center;font-size:.8rem;color:var(--muted);margin-top:8px;}
  .flow-row{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;}
  .flow-node{background:var(--primary-light);border:2px solid var(--primary);border-radius:10px;padding:10px 14px;font-size:.85rem;font-weight:700;text-align:center;color:var(--primary-dark);min-width:100px;}
  .flow-node.active{background:var(--primary);color:#fff;transform:scale(1.07);box-shadow:0 4px 14px rgba(15,118,110,.4);}
  .flow-node.muted{opacity:.45;}
  .flow-arrow{font-size:1.3rem;color:var(--muted);}
  .flow-arrow.active{color:var(--accent);font-weight:900;}

  /* Buttons */
  .btn{border:none;border-radius:10px;padding:10px 18px;font-weight:700;font-size:.9rem;cursor:pointer;transition:transform .1s,opacity .15s;}
  .btn:active{transform:scale(.96);}
  .btn-primary{background:var(--primary);color:#fff;}
  .btn-primary:hover{background:var(--primary-dark);}
  .btn-accent{background:var(--accent);color:#fff;}
  .btn-ghost{background:#eef1f4;color:var(--text);}
  .btn-ghost:hover{background:#e3e7ec;}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;}

  input[type=text], input[type=number]{
    font-family:inherit;border:1.5px solid var(--border);border-radius:8px;padding:8px 10px;font-size:.92rem;width:100%;
  }
  .byte-input{width:70px;text-align:center;}

  /* MCQ option styling (shared) */
  .q-block{border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:14px;background:#fff;}
  .q-block .q-meta{font-size:.72rem;font-weight:800;color:#fff;background:var(--muted);display:inline-block;padding:2px 10px;border-radius:999px;margin-bottom:8px;}
  .q-block .q-meta.tier-green{background:#16a34a;}
  .q-block .q-meta.tier-yellow{background:#d97706;}
  .q-block .q-meta.tier-red{background:#dc2626;}
  .q-text{font-weight:700;margin-bottom:10px;}
  .opt{display:flex;align-items:center;gap:10px;border:1.5px solid var(--border);border-radius:9px;padding:9px 12px;margin-bottom:7px;cursor:pointer;font-size:.9rem;background:#fbfcfd;}
  .opt:hover{border-color:var(--primary);background:var(--primary-light);}
  .opt.correct{border-color:var(--correct);background:var(--correct-bg);}
  .opt.incorrect{border-color:var(--incorrect);background:var(--incorrect-bg);}
  .opt .letter{width:24px;height:24px;border-radius:50%;background:#e7e9f2;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.78rem;flex:0 0 auto;}
  .opt.correct .letter{background:var(--correct);color:#fff;}
  .opt.incorrect .letter{background:var(--incorrect);color:#fff;}
  .feedback-line{font-size:.85rem;font-weight:700;margin-top:6px;min-height:1.2em;}
  .feedback-line.ok{color:var(--correct);}
  .feedback-line.bad{color:var(--incorrect);}
  .explain-box{display:none;background:#f8fafc;border-radius:8px;padding:10px 12px;margin-top:8px;font-size:.85rem;}
  .explain-box.show{display:block;}

  details.acc{border:1px solid var(--border);border-radius:10px;margin-bottom:10px;overflow:hidden;}
  details.acc summary{padding:12px 14px;cursor:pointer;font-weight:700;background:#fafbfc;}
  details.acc[open] summary{background:var(--primary-light);color:var(--primary-dark);}
  details.acc .acc-body{padding:12px 16px;}

  .fib-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px;font-size:.92rem;}
  .fib-row input{width:160px;}

  .tree{list-style:none;padding-left:18px;margin:0;}
  .tree li{position:relative;padding:4px 0 4px 16px;border-left:1px dashed var(--border);}
  .tree > li:last-child{border-left:1px dashed transparent;}
  .tree .node-btn{background:var(--primary-light);border:1.5px solid var(--primary);border-radius:8px;padding:4px 10px;font-size:.85rem;cursor:pointer;color:var(--primary-dark);font-weight:700;}
  .tree .node-btn.leaf-selected{background:var(--accent);color:#fff;border-color:var(--accent);}
  .tree .node-btn:hover{background:var(--accent-light);}

  .breadcrumb-build{font-family:monospace;font-size:1rem;background:#0f172a;color:#4ade80;padding:10px 14px;border-radius:8px;margin-top:10px;min-height:1.4em;letter-spacing:.3px;overflow-x:auto;}

  .log-panel{background:#0f172a;color:#e2e8f0;border-radius:10px;padding:12px 14px;font-family:monospace;font-size:.82rem;max-height:220px;overflow-y:auto;margin-top:10px;}
  .log-panel .ln{margin-bottom:6px;padding-bottom:6px;border-bottom:1px dashed #334155;}
  .log-panel .ln:last-child{border-bottom:none;}
  .log-panel .ln .step-no{color:#38bdf8;font-weight:700;}

  .url-parse-out{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;}
  .url-chip{padding:6px 10px;border-radius:8px;font-size:.82rem;font-weight:700;color:#fff;}
  .chip-protocol{background:#2563eb;}
  .chip-domain{background:#16a34a;}
  .chip-folder{background:#d97706;}
  .chip-file{background:#db2777;}
  .chip-none{background:#94a3b8;}

  /* Bottom bar */
  .bottom-bar{
    position:sticky;bottom:0;background:#fff;border-top:1px solid var(--border);
    display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;z-index:30;
  }
  .bottom-bar .mark-btn{background:var(--correct-bg);color:var(--correct);}
  .bottom-bar .mark-btn.done{background:var(--correct);color:#fff;}

  footer.note{text-align:center;font-size:.72rem;color:#9aa6b2;padding:10px;background:#fff;border-top:1px solid var(--border);}

  @media (max-width:860px){
    nav.sidebar{
      position:fixed;top:0;left:0;bottom:0;z-index:60;transform:translateX(-100%);
      transition:transform .22s ease;box-shadow:4px 0 24px rgba(0,0,0,.25);
    }
    nav.sidebar.open{transform:translateX(0);}
    header.top .burger{display:flex;}
    .sidebar-backdrop.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;}
    main.content{padding:16px 12px 100px;}
    .topic-header h2{font-size:1.25rem;}
  }
  @media (max-width:480px){
    header.top h1{font-size:.92rem;}
    .flow-node{min-width:80px;font-size:.78rem;padding:8px 10px;}
    .byte-input{width:58px;}
  }
</style>
</head>
<body>
<div class="app-shell">
  <header class="top">
    <button class="burger" id="burgerBtn" aria-label="பட்டி">☰</button>
    <div class="title-wrap">
      <h1>Computer Applications Learning Lab · Class 12 · Tamil Nadu State Board</h1>
      <p>பாடம் 12 — களப்பெயர் முறைமை (Domain Name System - DNS)</p>
    </div>
    <div class="lang-toggle" role="group" aria-label="Interface language">
      <button id="langTa" class="active" data-lang="ta">தமிழ்</button>
      <button id="langEn" data-lang="en">English</button>
    </div>
  </header>

  <div class="body-row">
    <div class="sidebar-backdrop" id="backdrop"></div>
    <nav class="sidebar" id="sidebar" aria-label="பாட பட்டியல்">
      <div class="progress-wrap">
        <div class="progress-label"><span>முன்னேற்றம் / Progress</span><span id="progPct">0%</span></div>
        <div class="progress-bar"><div class="progress-fill" id="progFill" style="width:0%"></div></div>
      </div>
      <div class="sidebar-section-label">தலைப்புகள் (Topics)</div>
      <div id="topicList"></div>
    </nav>

    <main class="content">
      <div class="content-inner" id="mainContent"></div>
    </main>
  </div>

  <div class="bottom-bar">
    <button class="btn btn-ghost" id="prevTopicBtn">⬅ முந்தையது</button>
    <button class="btn mark-btn" id="markCompleteBtn">✔ Mark Complete</button>
    <button class="btn btn-primary" id="nextTopicBtn">அடுத்தது ➡</button>
  </div>
  <footer class="note">Vagai Sudar · Class 12 Computer Applications · Chapter 12: DNS · தமிழக அரசு பாடநூல் அடிப்படையில் · ஆஃப்லைன் கற்றல் கூடம்</footer>
</div>

<script>
/* =========================================================================
   STORAGE (safe wrapper)
   ========================================================================= */
const STORE_KEY = 'ca12_dns_lab_v1';
function loadState(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){ /* storage unavailable - continue with defaults */ }
  return { completed:[], lang:'ta', quiz:{} };
}
function saveState(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){ /* ignore */ }
}
let state = loadState();

/* =========================================================================
   TOPIC DATA
   ========================================================================= */
const TOPICS = [
  {id:'overview',   num:'12.1-12.2', title:'அறிமுகம் & DNS கண்ணோட்டம்'},
  {id:'ipaddr',      num:'12.3',      title:'IP முகவரி (IP Address)'},
  {id:'url',         num:'12.4',      title:'URL'},
  {id:'namespace',   num:'12.5.1',    title:'பெயர்வெளி & களப்பெயர்கள்'},
  {id:'nameserver',  num:'12.5.2',    title:'பெயர் சேவையகங்கள்'},
  {id:'zone',        num:'12.5.3',    title:'மண்டலம் (Zone)'},
  {id:'resolver',    num:'12.5.4',    title:'தீர்வி (Resolver)'},
  {id:'dnswork',     num:'12.5.5',    title:'DNS வேலை செய்யும் விதம்'},
  {id:'practice',    num:'Practice',  title:'பயிற்சி & Debugging Lab'},
  {id:'examprep',    num:'Exam',      title:'தேர்வு தயாரிப்பு'},
];
let currentIdx = 0;

/* =========================================================================
   SIDEBAR / NAV RENDERING
   ========================================================================= */
function renderSidebar(){
  const wrap = document.getElementById('topicList');
  wrap.innerHTML = '';
  TOPICS.forEach((t, i) => {
    const btn = document.createElement('button');
    btn.className = 'topic-btn' + (i === currentIdx ? ' active' : '');
    const done = state.completed.includes(t.id);
    btn.innerHTML = '<span class="num">'+t.num+'</span><span>'+t.title+'</span>' + (done ? '<span class="chk">✔</span>' : '');
    btn.addEventListener('click', () => { goTo(i); closeSidebarMobile(); });
    wrap.appendChild(btn);
  });
  const pct = Math.round((state.completed.length / TOPICS.length) * 100);
  document.getElementById('progPct').textContent = pct + '%';
  document.getElementById('progFill').style.width = pct + '%';
}

function goTo(i){
  currentIdx = Math.max(0, Math.min(TOPICS.length - 1, i));
  renderMain();
  renderSidebar();
  updateBottomBar();
  window.scrollTo({top:0, behavior:'smooth'});
  document.querySelector('main.content').scrollTo({top:0, behavior:'smooth'});
}

function updateBottomBar(){
  document.getElementById('prevTopicBtn').disabled = currentIdx === 0;
  document.getElementById('nextTopicBtn').disabled = currentIdx === TOPICS.length - 1;
  const markBtn = document.getElementById('markCompleteBtn');
  const done = state.completed.includes(TOPICS[currentIdx].id);
  markBtn.classList.toggle('done', done);
  markBtn.textContent = done ? '✔ முடிந்தது (Completed)' : '✔ Mark Complete';
}

document.getElementById('prevTopicBtn').addEventListener('click', () => goTo(currentIdx - 1));
document.getElementById('nextTopicBtn').addEventListener('click', () => goTo(currentIdx + 1));
document.getElementById('markCompleteBtn').addEventListener('click', () => {
  const id = TOPICS[currentIdx].id;
  const idx = state.completed.indexOf(id);
  if(idx === -1) state.completed.push(id); else state.completed.splice(idx,1);
  saveState();
  renderSidebar();
  updateBottomBar();
});

/* mobile sidebar */
const sidebar = document.getElementById('sidebar');
const backdrop = document.getElementById('backdrop');
document.getElementById('burgerBtn').addEventListener('click', () => {
  sidebar.classList.toggle('open');
  backdrop.classList.toggle('show');
});
backdrop.addEventListener('click', closeSidebarMobile);
function closeSidebarMobile(){ sidebar.classList.remove('open'); backdrop.classList.remove('show'); }

/* language toggle (UI chrome only; lesson text follows textbook Tamil with English terms inline) */
document.getElementById('langTa').addEventListener('click', () => setLang('ta'));
document.getElementById('langEn').addEventListener('click', () => setLang('en'));
function setLang(l){
  state.lang = l; saveState();
  document.getElementById('langTa').classList.toggle('active', l==='ta');
  document.getElementById('langEn').classList.toggle('active', l==='en');
  document.body.setAttribute('data-lang', l);
}

/* =========================================================================
   MAIN RENDER DISPATCH
   ========================================================================= */
const RENDERERS = {
  overview: renderOverview,
  ipaddr: renderIPAddr,
  url: renderURL,
  namespace: renderNamespace,
  nameserver: renderNameServer,
  zone: renderZone,
  resolver: renderResolver,
  dnswork: renderDNSWork,
  practice: renderPractice,
  examprep: renderExamPrep,
};

function renderMain(){
  const t = TOPICS[currentIdx];
  const el = document.getElementById('mainContent');
  el.innerHTML = RENDERERS[t.id]();
  wireUpHandlers(t.id);
}

/* =========================================================================
   TOPIC 1 — 12.1 / 12.2 Introduction & DNS Overview
   ========================================================================= */
function renderOverview(){
  return `
  <div class="topic-header">
    <div class="crumb">பாடம் 12 › 12.1 &amp; 12.2</div>
    <h2>அறிமுகம் &amp; DNS கண்ணோட்டம் <span class="eng">(Introduction &amp; DNS Overview)</span></h2>
    <div class="goals">
      <b>கற்றலின் நோக்கங்கள் (Learning Objectives):</b>

      IPv4 = 32 பிட் (4 bytes), IPv6 = 128 பிட் (8 blocks of 16 bits) என்பதை மாற்றிக் குழப்பிக் கொள்ளக்கூடாது. IPv4-ல் 4 எண்கள் (decimal), IPv6-ல் 8 குழுக்கள் (hexadecimal) இருக்கும் என்பதை நினைவில் கொள்ளவும்.
    </div>
    <div class="exam-point">
      <span class="lbl">⭐ தேர்வுக் குறிப்பு</span>
      IPv4 → 32 bits → 2<sup>32</sup> முகவரிகள் · IPv6 → 128 bits → 2<sup>128</sup> முகவரிகள். IPv4 குறியீடுகள்: Binary Notation &amp; Dotted Decimal Notation.
    </div>
  </div>

  <div class="quickcheck">
    <span class="lbl">✅ முயற்சி செய்து பாருங்கள் (Try It Yourself)</span>
    <div id="qc-ipaddr"></div>
  </div>
  `;
}

/* =========================================================================
   TOPIC 4 — 12.5.1 Name Space / Domain Names (tree explorer + rules + gTLD/cTLD)
   ========================================================================= */
function renderNamespace(){
  return `
  <div class="topic-header">
    <div class="crumb">பாடம் 12 › 12.5.1</div>
    <h2>DNS பகுதிகள்: பெயர்வெளி &amp; களப்பெயர்கள் <span class="eng">(Name Space &amp; Domain Names)</span></h2>
    <div class="goals">DNS இன் நான்கு முக்கிய பகுதிகள்: <b>பெயர்வெளி (Name Space)</b> · பெயர் சேவையகம் (Name Server) · மண்டலம் (Zone) · தீர்வி (Resolver)</div>
  </div>

  <div class="card">
    <div class="tb-def">
      <span class="lbl">📘 பாடநூல் வரையறை</span>
      களப்பெயர்கள் மிகவும் தனித்தன்மையானவையாகவும் பொருத்தமானவையாகவும் இருக்க வேண்டும். இப்பெயர்கள் பெயர்வெளியிலிருந்து (Name Space) தேர்ந்தெடுக்கப்பட வேண்டும். பெயர்வெளி இரண்டு வழிகளில் ஒழுங்கமைக்கப்படலாம்:
      <ul><li>கிடைப் பெயர்வெளி (Flat Name Space)</li><li>படிநிலைப் பெயர்வெளி (Hierarchical Name Space)</li></ul>
      கிடை பெயர்வெளியில் ஒரு IP முகவரிக்கு ஒரு பெயர் ஒதுக்கப்படுகிறது; இதில் குறிப்பிடத்தக்க கட்டமைப்பு எதுவும் இல்லை. இதன் முக்கிய குறைபாடு, அவை பெரிய அளவிலான அமைப்பில் (large system) பயன்படுத்தப்பட முடியாது. இந்தக் குறைபாட்டைத் தவிர்க்க படிநிலை பெயர்வெளி அதிக அளவில் பயன்படுத்தப்படுகிறது. படிநிலை பெயர்வெளியில் பெயர் பல பகுதிகளால் ஆனது — முதல் பகுதி நிறுவனத்தின் தன்மையைக் குறிக்கலாம், இரண்டாவது பகுதி நிறுவனத்தின் பெயரைக் குறிக்கலாம், மூன்றாம் பகுதி நிறுவனத்தின் ஒரு துறையைக் குறிக்கலாம்.
    </div>

    <h4>களப்பெயர் வெளி (Domain Name Space)</h4>
    <div class="tb-def">
      படிநிலை பெயர்வெளியைப் பெறுவதற்காக களப்பெயர்வெளி வடிவமைக்கப்பட்டது. இதில் பெயர்கள் தலைகீழ் மர வடிவமைப்பில் (Tree like structure) குறிக்கப்படுகிறது. இதன் வேர் உறுப்பு (Root element) மேலிருக்கும் வகையில் அமைந்திருக்கும். இந்த மர அமைப்பு 0 முதல் 127 வரை மொத்தம் 128 மட்டங்களை (level) கொண்டிருக்கும். வேர் உறுப்பு எப்போதும் வெற்றுச் சரத்தை (NULL) குறிக்கிறது.
    </div>
    <h4>சிட்டை (Label)</h4>
    <div class="tb-def">
      DNS மர அமைப்பில் ஒவ்வொரு முனையமும் (Node) ஒரு பெயரைக் கொண்டிருக்கும் — இதற்குச் <b>சிட்டை (Label)</b> என்னும் பெயர். இது அதிகபட்சம் 63 எழுத்துக்களைக் கொண்ட ஒரு சரம். ஒரு மட்டத்தில் இருக்கும் ஒவ்வொரு முனையமும் வேறுபட்ட சிட்டைகளைக் கொண்டிருக்க வேண்டும் — இது களப்பெயரின் தனித்துவத்தை உறுதிப்படுத்துகிறது.
    </div>
    <h4>களப்பெயர் (Domain Name)</h4>
    <div class="tb-def">
      இது சிட்டைகளின் வரிசையாகும். களப்பெயரில் சிட்டைகள் புள்ளி (.) மூலம் பிரிக்கப்படுகிறது. களப் பெயர் எப்போதுமே கீழ் மட்டத்திலிருந்து மேல் மட்டம் வரை (அதாவது <b>இலை முனையத்திலிருந்து வேர் முனையம் வரை</b>) படிக்கப்படுகிறது.
    </div>

    <div class="activity-box">
      <span class="lbl">🧪 கற்றல் செயல்பாடு (Learning Simulation) — Domain Name Tree Explorer</span>
      கீழே உள்ள மரத்தில் ஒரு முனையத்தை (node) கிளிக் செய்யுங்கள். அதன் களப்பெயர் கீழிருந்து மேல் நோக்கி (leaf → root) எவ்வாறு கட்டப்படுகிறது எனக் காண்பீர்கள் — படம் 12.6 இல் உள்ள <span class="mono">challenger.atc.fhda.edu</span> உதாரணத்தின் அடிப்படையில்.
      <div id="domainTree" style="margin-top:10px;"></div>
      <div class="breadcrumb-build" id="domainBreadcrumb">ஒரு முனையத்தைத் தேர்ந்தெடுக்கவும் (Click a node)…</div>
    </div>

    <h4>களப்பெயருக்கான விதிமுறைகள் (Rules for Domain Names)</h4>
    <ul>
      <li>களப்பெயரானது a–z, A–Z வரையிலான ஆங்கில எழுத்துக்களையும் 0–9 வரையிலான எண்களையும் கொண்டிருக்க முடியும்.</li>
      <li>இடைக்கோடு (hyphen -) அனுமதிக்கப்படலாம். ஆனால் அது களப் பெயரின் முதல் எழுத்தாக இருக்க முடியாது.</li>
      <li>இடைவெளிகள் அனுமதிக்கப்படுவதில்லை.</li>
      <li>சிறப்பு குறியீடுகள் (!, $, &amp;, மற்றும் பல) அனுமதிக்கப்படுவதில்லை.</li>
      <li>ஒரு முழுமையான களப்பெயரில் அதிகபட்சமாக 253 எழுத்துக்கள் இடம் பெறலாம்.</li>
      <li>களப்பெயர்கள் எழுத்து வடிவ உணர் திறன் அற்றவை (case-insensitive).</li>
    </ul>

    <div class="activity-box">
      <span class="lbl">🧪 Debugging Lab — களப்பெயர் சரிபார்ப்பான் (Domain Name Validator)</span>
      மேலே உள்ள விதிகளின்படி, ஒரு களப்பெயர் சரியானதா எனச் சரிபார்க்கவும்.
      <div style="margin-top:10px;"><input type="text" id="domValInput" value="-my site@.com"></div>
      <div class="btn-row">
        <button class="btn btn-primary" id="domValBtn">சரிபார் (Validate)</button>
        <button class="btn btn-ghost" data-preset="my-site.com">✅ my-site.com</button>
        <button class="btn btn-ghost" data-preset="-wrongsite.com">❌ -wrongsite.com</button>
        <button class="btn btn-ghost" data-preset="my site.com">❌ my site.com</button>
        <button class="btn btn-ghost" data-preset="my@site.com">❌ my@site.com</button>
      </div>
      <div id="domValOut" style="margin-top:12px;"></div>
    </div>

    <h4>Generic Top-Level Domain names (gTLD)</h4>
    <div class="tb-def">
      களப்பெயரின் கடைசிப் பகுதியே உயர்நிலை களப்பெயர் ஆகும். பொது உயர்நிலை களப்பெயர் என்பது பொதுவான நோக்கத்திற்காகப் பயன்படுத்தப்படுகிறது. இது IANA என்ற அமைப்பினால் பராமரிக்கப்படுகின்றன.

    <details class="acc">

function renderExamPrep(){
  return `
  <div class="topic-header">
    <div class="crumb">தேர்வு தயாரிப்பு</div>
    <h2>தேர்வு தயாரிப்பு <span class="eng">(Exam Preparation)</span></h2>
  </div>

  <div class="card">
    <h3>⭐ Must Know · Must Remember</h3>
    <ul>
      <li>களப்பெயர் முறைமை (DNS) களப்பெயர்களின் அனைத்து அடைவுகளையும் பராமரிக்கிறது. இது களப்பெயர்களைப் பயன்படுத்தி வலைத்தளங்களை அணுக உதவுகிறது. மேலும் இது களப்பெயரை IP முகவரியாக மொழிபெயர்க்கிறது.</li>
      <li>IP முகவரி என்பது வலையமைப்பில் உள்ள ஒரு கணினியை தனித்து அடையாளம் காண உதவும் ஒரு தருக்க முகவரி ஆகும். இதில் இரண்டு வகைகள் உள்ளன: IPv4 மற்றும் IPv6.</li>
      <li>IPv4 முகவரி = கணினிக்கு வழங்கப்படும் 32 பிட் தனித்துவமான முகவரி. இதைக் குறிக்க இரண்டு வழிகள் உள்ளன: இருநிலை குறியீடு, புள்ளி-தசம குறியீடு.</li>
      <li>IPv6 முகவரி = ஒரு கணினிக்குக் கொடுக்கப்படும் 128 பிட் தனித்த முகவரி. இது பதினாறு நிலை எண்களால் குறிக்கப்படுகிறது.</li>
      <li>URL (Uniform Resource Locator) = இணையத்தில் உள்ள ஒரு ஆவணத்தின் முகவரி. URL இரண்டு வகைகளாகப் பிரிக்கப்படுகிறது: முழுநிலை URL மற்றும் சார்புநிலை URL.</li>
      <li>URL இன் நான்கு பாகங்கள்: நெறிமுறைகள், களப்பெயர், கோப்புறை பெயர் மற்றும் கோப்பு பெயர். முழுநிலை URL இல் இந்த நான்கு பகுதிகளும் அடிப்படையானவை.</li>
      <li>சார்புநிலை URL இல் கோப்புறையுடன் கூடிய கோப்பு பெயர் அல்லது கோப்பு பெயர் மட்டும் இடம்பெற்றிருக்கும்.</li>
      <li>களப்பெயர் முறைமையில் (DNS) 4 முக்கிய கூறுகள் உள்ளன: பெயர்வெளி, பெயர் சேவையகம், மண்டலம் மற்றும் தீர்வி.</li>
      <li>சிட்டை (label) = ஒரு சரம், இது அதிகபட்சம் 63 எழுத்துக்களைக் கொண்டிருக்கலாம். ஒரு மட்டத்தில் (level) உள்ள ஒவ்வொரு முனையமும் (node) தனித்த சிட்டைகளைக் கொண்டிருக்க வேண்டும்.</li>
      <li>களப் பெயர் வெளி என்பது உயர் மட்டத்தில் (top level) மூல உறுப்பைக் (root element) கொண்ட ஒரு தலைகீழ் மர அமைப்பாகும். இந்த மர அமைப்பு 0 முதல் 127 வரை மொத்தம் 128 மட்டங்களைக் கொண்டிருக்கும்.</li>

/* =========================================================================
   QUICK-CHECK MCQ HELPER (generic renderer + event wiring)
   ========================================================================= */
function mcqHTML(qid, qObj, tierClass, tierLabel){
  const letters = ['அ','ஆ','இ','ஈ','உ'];
  let optsHtml = qObj.o.map((opt,i) =>
    `<div class="opt" data-qid="${qid}" data-idx="${i}"><span class="letter">${letters[i]}</span><span>${opt}</span></div>`
  ).join('');
  return `
  <div class="q-block" id="block-${qid}">
    ${tierLabel ? `<span class="q-meta ${tierClass}">${tierLabel}</span>` : ''}
    <div class="q-text">${qObj.q}</div>
    <div class="opts-wrap">${optsHtml}</div>
    <div class="feedback-line" id="fb-${qid}"></div>
    ${qObj.exp ? `<div class="explain-box" id="exp-${qid}">💡 ${qObj.exp}</div>` : ''}
  </div>`;
}
function wireMCQ(containerSel, dataMap){
  document.querySelectorAll(containerSel + ' .opt').forEach(opt => {
    opt.addEventListener('click', function(){
      const qid = this.dataset.qid;
      const idx = parseInt(this.dataset.idx,10);
      const block = document.getElementById('block-'+qid);
      if(block.dataset.answered) return;
      block.dataset.answered = '1';
      const qObj = dataMap[qid];
      const opts = block.querySelectorAll('.opt');
      opts.forEach((o,i) => {
        if(i === qObj.c) o.classList.add('correct');
        if(i === idx && idx !== qObj.c) o.classList.add('incorrect');
      });
      const fb = document.getElementById('fb-'+qid);
      if(idx === qObj.c){ fb.textContent = '✅ சரியான விடை!'; fb.className='feedback-line ok'; }
      else { fb.textContent = '❌ தவறான விடை. சரியான விடை: ' + qObj.o[qObj.c]; fb.className='feedback-line bad'; }
      const exp = document.getElementById('exp-'+qid);
      if(exp) exp.classList.add('show');
    });
  });
}

/* ---- IP Address simulator wiring ---- */
function toBin8(n){ return (n>>>0).toString(2).padStart(8,'0'); }
function wireIPAddr(){
  function update(){
    const vals = [0,1,2,3].map(i => {
      let v = parseInt(document.getElementById('ipByte'+i).value,10);
      if(isNaN(v)) v = 0;
      v = Math.max(0, Math.min(255, v));
      document.getElementById('ipByte'+i).value = v;
      return v;
    });
    document.getElementById('ipBinaryOut').textContent = 'Binary: ' + vals.map(toBin8).join(' . ');
    document.getElementById('ipDottedOut').textContent = 'Dotted Decimal: ' + vals.join('.');
  }
  [0,1,2,3].forEach(i => document.getElementById('ipByte'+i).addEventListener('input', update));
  document.getElementById('ipConvertBtn').addEventListener('click', update);
  document.getElementById('ipLoadExampleBtn').addEventListener('click', () => {
    [128,143,137,144].forEach((v,i) => document.getElementById('ipByte'+i).value = v);
    update();
  });
  document.getElementById('ipRandomBtn').addEventListener('click', () => {
    [0,1,2,3].forEach(i => document.getElementById('ipByte'+i).value = Math.floor(Math.random()*256));
    update();
  });
  update();
}

/* ---- URL parser wiring ---- */
function wireURL(){
  function parse(){
    const raw = document.getElementById('urlInput').value.trim();
    const out = document.getElementById('urlParseOut');
    const typeOut = document.getElementById('urlTypeOut');
    out.innerHTML = '';
    const protoMatch = raw.match(/^([a-zA-Z]+):\/\//);
    if(protoMatch){
      const protocol = protoMatch[1];
      const rest = raw.slice(protoMatch[0].length);
      const firstSlash = rest.indexOf('/');
      const domain = firstSlash === -1 ? rest : rest.slice(0, firstSlash);
      const pathPart = firstSlash === -1 ? '' : rest.slice(firstSlash+1);
      const lastSlash = pathPart.lastIndexOf('/');
      const folders = lastSlash === -1 ? '' : pathPart.slice(0, lastSlash);
      const file = lastSlash === -1 ? pathPart : pathPart.slice(lastSlash+1);
      out.innerHTML =
        '<span class="url-chip chip-protocol">Protocol: '+protocol+'</span>' +
        '<span class="url-chip chip-domain">Domain: '+domain+'</span>' +
        (folders ? '<span class="url-chip chip-folder">Folders: '+folders+'</span>' : '<span class="url-chip chip-none">Folders: (இல்லை)</span>') +
        (file ? '<span class="url-chip chip-file">File: '+file+'</span>' : '<span class="url-chip chip-none">File: (இல்லை)</span>');
      typeOut.innerHTML = '🟦 இது <b>முழு நிலை URL (Absolute URL)</b> — நான்கு பகுதிகளும் (அல்லது protocol+domain) தெளிவாக உள்ளன.';
    } else {
      out.innerHTML = '<span class="url-chip chip-folder">Folder/File path: '+raw+'</span>';
      typeOut.innerHTML = '🟧 இது <b>சார்பு நிலை URL (Relative URL)</b> — Protocol/Domain இல்லாமல் கோப்பு/கோப்புறைப் பெயர் மட்டும் உள்ளது.';
    }
  }
  document.getElementById('urlParseBtn').addEventListener('click', parse);
  document.getElementById('urlRelExampleBtn').addEventListener('click', () => {
    document.getElementById('urlInput').value = 'sites/default/files/press_release/pr070119a.jpg';
    parse();
  });
  parse();
}

/* ---- Domain Name Tree + Validator wiring ---- */
function wireNamespace(){
  // Tree model matching Fig 12.6: root -> edu -> fhda -> atc -> challenger
  const treeHTML = `
    <ul class="tree">
      <li><button class="node-btn" data-path="">Root</button>
        <ul class="tree">
          <li><button class="node-btn" data-path="edu">edu</button>
            <ul class="tree">
              <li><button class="node-btn" data-path="fhda.edu">fhda</button>
                <ul class="tree">
                  <li><button class="node-btn" data-path="atc.fhda.edu">atc</button>
                    <ul class="tree">
                      <li><button class="node-btn" data-path="challenger.atc.fhda.edu">challenger</button></li>
                    </ul>
                  </li>
                </ul>
              </li>
            </ul>
          </li>
          <li><button class="node-btn" data-path="com">com</button></li>
          <li><button class="node-btn" data-path="org">org</button></li>
          <li><button class="node-btn" data-path="net">net</button></li>
        </ul>
      </li>
    </ul>`;
  document.getElementById('domainTree').innerHTML = treeHTML;
  document.querySelectorAll('#domainTree .node-btn').forEach(btn => {
    btn.addEventListener('click', function(){
      document.querySelectorAll('#domainTree .node-btn').forEach(b => b.classList.remove('leaf-selected'));
      this.classList.add('leaf-selected');
      const path = this.dataset.path;
      const bc = document.getElementById('domainBreadcrumb');
      if(!path){ bc.textContent = 'Root — NULL (வெற்றுச் சரம்)'; return; }
      const labels = path.split('.');
      let html = labels.map((l,i) => i===0 ? l : '<span style="color:#fff;">.</span>'+l).join('');
      bc.innerHTML = html + '.&nbsp;&nbsp;&nbsp;← (leaf → root படித்தல்: ' + labels.join(' → ') + ' → Root)';
    });
  });

  // Domain validator
  function validate(name){
    const rules = [];
    const noSpace = !/\s/.test(name);
    rules.push({label:'இடைவெளிகள் இல்லை', pass:noSpace});
    const onlyAllowed = /^[a-zA-Z0-9.\-]+$/.test(name);
    rules.push({label:'அனுமதிக்கப்பட்ட எழுத்துக்கள் மட்டும் (a-z, A-Z, 0-9, hyphen, dot)', pass:onlyAllowed});
    const labels = name.split('.');
    const noLeadHyphen = labels.every(l => !l.startsWith('-'));
    rules.push({label:'எந்த சிட்டையும் hyphen-இல் தொடங்கவில்லை', pass:noLeadHyphen});
    const lenOk = name.length > 0 && name.length <= 253;
    rules.push({label:'மொத்த நீளம் ≤ 253 எழுத்துக்கள்', pass:lenOk});
    const labelLenOk = labels.every(l => l.length <= 63);
    rules.push({label:'ஒவ்வொரு சிட்டையும் ≤ 63 எழுத்துக்கள்', pass:labelLenOk});
    const allPass = rules.every(r => r.pass);
    return {rules, allPass};
  }
  function renderValidation(name){
    const res = validate(name);
    let html = '<div style="font-weight:800;margin-bottom:8px;">'+(res.allPass ? '✅ செல்லுபடியாகும் களப்பெயர்!' : '❌ இந்தக் களப்பெயர் விதிமீறலைக் கொண்டுள்ளது')+'</div>';
    html += '<ul>' + res.rules.map(r => '<li style="color:'+(r.pass?'#15803d':'#c0392b')+';">'+(r.pass?'✅':'❌')+' '+r.label+'</li>').join('') + '</ul>';
    document.getElementById('domValOut').innerHTML = html;
  }
  document.getElementById('domValBtn').addEventListener('click', () => renderValidation(document.getElementById('domValInput').value.trim()));
  document.querySelectorAll('[data-preset]').forEach(btn => {
    btn.addEventListener('click', () => { document.getElementById('domValInput').value = btn.dataset.preset; renderValidation(btn.dataset.preset); });
  });
  renderValidation(document.getElementById('domValInput').value.trim());
}

  {active:['n-root'], log:'Root Server: "எனக்குத் தெரியாது, ஆனால் .org சேவையகத்திடம் கேளுங்கள்" என பதிலளிக்கிறது.'},
  {active:['n-local','n-org'], log:'உள்ளூர் சேவையகம் .org (TLD / Org Server) சேவையகத்திடம் வினவுகிறது.'},
  {active:['n-org'], log:'.org சேவையகம்: "எனக்குத் தெரியாது, tnscert.org சேவையகத்திடம் கேளுங்கள்" எனக் கூறுகிறது.'},
  {active:['n-local','n-auth'], log:'உள்ளூர் சேவையகம் Authoritative DNS Server (tnscert.org) இடம் வினவுகிறது.'},
  {active:['n-auth'], log:'tnscert.org சேவையகம்: "www.tnscert.org is at 198.71.57.84" என பதிலளிக்கிறது. ✅'},
  {active:['n-local','n-resolver'], log:'உள்ளூர் சேவையகம் இந்த IP முகவரியை தீர்வியிடம் அனுப்புகிறது; தீர்வி அதை இடைத்தேக்கத்தில் (cache) சேமிக்கிறது.'},
  {active:['n-resolver','n-browser'], log:'தீர்வி IP முகவரியை உலாவிக்கு அனுப்புகிறது. உலாவி 198.71.57.84 உடன் இணைந்து வலைப்பக்கத்தைக் காட்டுகிறது. 🎉'},
];
let dnsStep = -1, dnsTimer = null;
function wireDNSWork(){
  dnsStep = -1;
  clearInterval(dnsTimer); dnsTimer = null;
  document.getElementById('dnsStepBtn').addEventListener('click', () => dnsAdvance());
  document.getElementById('dnsResetBtn').addEventListener('click', dnsReset);
  document.getElementById('dnsPlayBtn').addEventListener('click', () => {
    clearInterval(dnsTimer);
    dnsTimer = setInterval(() => {
      if(dnsStep >= DNS_STEPS.length - 1){ clearInterval(dnsTimer); return; }
      dnsAdvance();
    }, 1400);
  });
}
function dnsAllNodes(){ return ['n-browser','n-resolver','n-local','n-root','n-org','n-auth']; }
function dnsAdvance(){
  if(dnsStep >= DNS_STEPS.length - 1) return;
  dnsStep++;
  dnsAllNodes().forEach(id => document.getElementById(id) && document.getElementById(id).classList.remove('active'));
  const s = DNS_STEPS[dnsStep];
  s.active.forEach(id => { const el = document.getElementById(id); if(el) el.classList.add('active'); });
  const log = document.getElementById('dnsLog');
  const line = document.createElement('div');
  line.className = 'ln';
  line.innerHTML = '<span class="step-no">படி '+(dnsStep+1)+'/'+DNS_STEPS.length+':</span> ' + s.log;
  log.appendChild(line);
  log.scrollTop = log.scrollHeight;
  if(dnsStep === DNS_STEPS.length - 1){
    const done = document.createElement('div');
    done.className = 'ln';
    done.innerHTML = '<b style="color:#4ade80;">✔ DNS தீர்வு நிறைவடைந்தது (Resolution Complete)!</b>';
    log.appendChild(done);
  }
}
function dnsReset(){
  clearInterval(dnsTimer); dnsTimer = null;
  dnsStep = -1;
  dnsAllNodes().forEach(id => document.getElementById(id) && document.getElementById(id).classList.remove('active'));
  document.getElementById('dnsLog').innerHTML = '<div class="ln">▶ "Step" பொத்தானை அழுத்தி தொடங்குங்கள்…</div>';
}

/* ---- Practice page wiring ---- */
function wirePractice(){
  document.getElementById('mcqBookWrap').innerHTML = Object.keys(MCQ_BOOK).map(k => mcqHTML(k, MCQ_BOOK[k], '', '')).join('');
  wireMCQ('#mcqBookWrap', MCQ_BOOK);

  document.getElementById('mcqExtraWrap').innerHTML = Object.keys(MCQ_EXTRA).map(k => mcqHTML(k, MCQ_EXTRA[k], MCQ_EXTRA[k].tier, MCQ_EXTRA[k].tierLabel)).join('');
  wireMCQ('#mcqExtraWrap', MCQ_EXTRA);

  // True / False
  const tfWrap = document.getElementById('tfWrap');
  tfWrap.innerHTML = TF_QS.map((tf,i) => `
    <div class="q-block" id="tf-block-${i}">
      <div class="q-text">${i+1}. ${tf.q}</div>
      <div class="btn-row">
        <button class="btn btn-ghost tf-btn" data-i="${i}" data-val="true">சரி (True)</button>
        <button class="btn btn-ghost tf-btn" data-i="${i}" data-val="false">தவறு (False)</button>
      </div>
      <div class="feedback-line" id="tf-fb-${i}"></div>
    </div>`).join('');
  document.querySelectorAll('.tf-btn').forEach(btn => {
    btn.addEventListener('click', function(){
      const i = parseInt(this.dataset.i,10);
      const block = document.getElementById('tf-block-'+i);
      if(block.dataset.answered) return;
      block.dataset.answered = '1';
      const chosen = this.dataset.val === 'true';
      const fb = document.getElementById('tf-fb-'+i);
      if(chosen === TF_QS[i].a){ fb.className='feedback-line ok'; fb.textContent = '✅ சரி! ' + TF_QS[i].exp; }
      else { fb.className='feedback-line bad'; fb.textContent = '❌ தவறு. ' + TF_QS[i].exp; }
    });
  });

  // Fill in the blanks
  const fibWrap = document.getElementById('fibWrap');
  fibWrap.innerHTML = FIB_QS.map((f,i) => `<div class="fib-row">${i+1}. ${f.text.replace('______________','')} <input type="text" id="fib-${i}" placeholder="விடையை இங்கே தட்டச்சு செய்யவும்"></div>`).join('');
  document.getElementById('fibCheckBtn').addEventListener('click', () => {
    let correct = 0;
    FIB_QS.forEach((f,i) => {
      const val = (document.getElementById('fib-'+i).value || '').trim().toLowerCase();
      const ok = val === f.ans || val.replace(/\s/g,'') === f.ans.replace(/\s/g,'');
      document.getElementById('fib-'+i).style.borderColor = val === '' ? 'var(--border)' : (ok ? 'var(--correct)' : 'var(--incorrect)');
      if(ok) correct++;
    });
    document.getElementById('fibResult').innerHTML = correct + ' / ' + FIB_QS.length + ' சரியானவை. (சரியான விடைகள்: ' + FIB_QS.map(f=>f.ans).join(', ') + ')';
  });

  // Match the following
  const matchWrap = document.getElementById('matchWrap');
  let selectedLeft = null;
  const matched = {};
  function renderMatch(){
    matchWrap.innerHTML = `
      <div style="display:flex;gap:30px;flex-wrap:wrap;">
        <div><b>TLD</b><div id="matchLeftCol" style="margin-top:8px;"></div></div>
        <div><b>பொருள்</b><div id="matchRightCol" style="margin-top:8px;"></div></div>
      </div>
      <div id="matchResult" style="margin-top:10px;font-weight:700;"></div>`;
    const leftCol = document.getElementById('matchLeftCol');
    const rightCol = document.getElementById('matchRightCol');
    MATCH_LEFT.forEach(l => {
      const b = document.createElement('button');
      b.className = 'btn btn-ghost'; b.style.display='block'; b.style.marginBottom='8px'; b.style.minWidth='140px';
      b.textContent = l + (matched[l] ? ' ✅ → ' + matched[l] : '');
      if(matched[l]) b.disabled = true;
      b.addEventListener('click', () => { selectedLeft = l; renderMatch(); b.style.outline='3px solid var(--accent)'; });
      leftCol.appendChild(b);
    });
    MATCH_RIGHT.forEach(r => {
      const usedUp = Object.values(matched).includes(r);
      const b = document.createElement('button');
      b.className = 'btn btn-ghost'; b.style.display='block'; b.style.marginBottom='8px'; b.style.minWidth='220px';
      b.textContent = r + (usedUp ? ' ✅' : '');
      if(usedUp) b.disabled = true;
      b.addEventListener('click', () => {
        if(!selectedLeft) return;
        matched[selectedLeft] = r;
        selectedLeft = null;
        renderMatch();
        if(Object.keys(matched).length === MATCH_LEFT.length){
          const allCorrect = MATCH_LEFT.every(l => matched[l] === MATCH_ANSWER[l]);
          document.getElementById('matchResult').textContent = allCorrect ? '🎉 அனைத்தும் சரி!' : 'முடிந்தது — சில பொருத்தங்களை சரிபார்க்கவும் (மேலே உள்ள பட்டியலுடன் ஒப்பிடவும்).';
        }
      });
      rightCol.appendChild(b);
    });
  }
  renderMatch();

  // Debugging Lab
  const debugWrap = document.getElementById('debugWrap');
  debugWrap.innerHTML = DEBUG_CASES.map((c,i) => `
    <div class="card" style="margin-bottom:12px;">
      <div><span style="color:var(--incorrect);font-weight:800;">❌ </span><span class="mono">${c.wrong}</span></div>
      <button class="btn btn-ghost" style="margin-top:8px;" data-dbg="${i}">என்ன தவறு? (What's wrong?)</button>
      <div class="explain-box" id="dbg-${i}">
        <b>வகை:</b> ${c.errorType}<br>
        <b>ஏன்?:</b> ${c.why}<br>
        <span style="color:var(--correct);font-weight:800;">✅ சரியான வடிவம்:</span> <span class="mono">${c.fix}</span>
      </div>
    </div>`).join('');
  document.querySelectorAll('[data-dbg]').forEach(btn => {
    btn.addEventListener('click', function(){ document.getElementById('dbg-'+this.dataset.dbg).classList.toggle('show'); });
  });
}

<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>பாடம் 15 — மின்-வணிகம் | Computer Applications Learning Lab</title>
<style>
  :root{
    --bg:#fbf5f8;
    --card:#ffffff;
    --primary:#be185d;
    --primary-dark:#831843;
    --primary-light:#fce7f3;
    --accent:#d97706;
    --accent-light:#fef3c7;
    --correct:#15803d;
    --correct-bg:#eafaf0;
    --incorrect:#c0392b;
    --incorrect-bg:#fdecec;
    --warn:#b45309;
    --warn-bg:#fff6e6;
    --text:#241521;
    --muted:#6b5a66;
    --border:#f0dce7;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Noto Sans Tamil','Latha','Nirmala UI','Segoe UI',Tahoma,sans-serif;
    background:var(--bg);
    color:var(--text);
    line-height:1.65;
  }
  [lang-ta]{font-size:1rem;}
  h1,h2,h3,h4{line-height:1.45;}
  a{color:var(--primary);}
  button{font-family:inherit;}
  .app-shell{display:flex;flex-direction:column;min-height:100vh;}

  header.top{
    background:linear-gradient(120deg,var(--primary-dark),var(--primary));
    color:#fff;
    padding:12px 16px;
    display:flex;
    align-items:center;
    gap:12px;
    position:sticky;top:0;z-index:40;
    box-shadow:0 2px 10px rgba(0,0,0,.15);
  }
  header.top .burger{
    background:rgba(255,255,255,.15);border:none;color:#fff;border-radius:8px;
    width:40px;height:40px;font-size:1.2rem;cursor:pointer;flex:0 0 auto;
    display:none;align-items:center;justify-content:center;
  }
  header.top .title-wrap{flex:1;min-width:0;}
  header.top h1{margin:0;font-size:1.05rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  header.top p{margin:0;font-size:.75rem;color:#fbe1ee;}
  header.top .lang-toggle{
    display:flex;background:rgba(255,255,255,.15);border-radius:999px;padding:3px;flex:0 0 auto;
  }
  header.top .lang-toggle button{
    border:none;background:transparent;color:#fdeef5;padding:6px 12px;border-radius:999px;
    font-size:.8rem;font-weight:700;cursor:pointer;
  }
  header.top .lang-toggle button.active{background:#fff;color:var(--primary-dark);}

  .body-row{display:flex;flex:1;min-height:0;}

  nav.sidebar{
    width:280px;flex:0 0 auto;background:#fff;border-right:1px solid var(--border);
    padding:16px 10px 90px;overflow-y:auto;
  }
  nav.sidebar .progress-wrap{padding:6px 8px 16px;}
  nav.sidebar .progress-label{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted);margin-bottom:6px;}
  nav.sidebar .progress-bar{height:8px;background:var(--border);border-radius:999px;overflow:hidden;}
  nav.sidebar .progress-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));transition:width .3s;}
  .topic-btn{
    display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;
    background:transparent;border:none;border-radius:10px;padding:10px 10px;margin-bottom:4px;
    cursor:pointer;font-size:.92rem;color:var(--text);
  }
  .topic-btn:hover{background:var(--primary-light);}
  .topic-btn.active{background:var(--primary-light);color:var(--primary-dark);font-weight:700;}
  .topic-btn .num{flex:0 0 auto;font-size:.72rem;color:var(--muted);background:#f6eef2;border-radius:6px;padding:2px 6px;min-width:50px;text-align:center;}
  .topic-btn.active .num{background:var(--primary);color:#fff;}
  .topic-btn .chk{flex:0 0 auto;margin-left:auto;color:var(--correct);font-weight:800;}
  .sidebar-section-label{font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:14px 8px 6px;}

  .sidebar-backdrop{display:none;}

  main.content{flex:1;min-width:0;padding:22px 20px 110px;overflow-y:auto;}
  .content-inner{max-width:920px;margin:0 auto;}
  .topic-header{margin-bottom:18px;}
  .topic-header .crumb{font-size:.8rem;color:var(--muted);margin-bottom:4px;}
  .topic-header h2{margin:0 0 6px;font-size:1.5rem;color:var(--primary-dark);}
  .topic-header .goals{background:var(--primary-light);border-radius:12px;padding:12px 16px;font-size:.92rem;}
  .topic-header .goals b{color:var(--primary-dark);}

  .card{
    background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    padding:18px 18px;margin-bottom:18px;box-shadow:0 2px 10px rgba(80,20,50,.05);
  }
  .card h3{margin-top:0;color:var(--primary-dark);font-size:1.12rem;}
  .card h4{color:var(--accent);font-size:1rem;margin-bottom:6px;}

  .tb-def{background:#eef4ff;border-left:5px solid #2563eb;border-radius:10px;padding:12px 16px;margin:12px 0;}
  .tb-def .lbl{font-weight:800;color:#1d4ed8;font-size:.82rem;margin-bottom:4px;display:block;}
  .easy{background:var(--primary-light);border-left:5px solid var(--primary);border-radius:10px;padding:12px 16px;margin:12px 0;}
  .easy .lbl{font-weight:800;color:var(--primary-dark);font-size:.82rem;margin-bottom:4px;display:block;}
  .analogy{background:#fff7ed;border-left:5px solid var(--accent);border-radius:10px;padding:12px 16px;margin:12px 0;}
  .analogy .lbl{font-weight:800;color:#92400e;font-size:.82rem;margin-bottom:4px;display:block;}
  .example-box{background:#f5f3ff;border-left:5px solid #7c3aed;border-radius:10px;padding:12px 16px;margin:12px 0;}
  .example-box .lbl{font-weight:800;color:#7c3aed;font-size:.82rem;margin-bottom:4px;display:block;}
  .activity-box{background:#ecfeff;border-left:5px solid #0891b2;border-radius:10px;padding:12px 16px;margin:12px 0;}
  .activity-box .lbl{font-weight:800;color:#0e7490;font-size:.82rem;margin-bottom:4px;display:block;}
  .mistake-box{background:var(--warn-bg);border-left:5px solid var(--warn);border-radius:10px;padding:12px 16px;margin:12px 0;}
  .mistake-box .lbl{font-weight:800;color:var(--warn);font-size:.82rem;margin-bottom:4px;display:block;}
  .exam-point{background:#fdf2f8;border-left:5px solid #db2777;border-radius:10px;padding:12px 16px;margin:12px 0;}
  .exam-point .lbl{font-weight:800;color:#be185d;font-size:.82rem;margin-bottom:4px;display:block;}
  .tryit-box{background:#f0fdf4;border:2px dashed #16a34a;border-radius:10px;padding:14px 16px;margin:12px 0;}
  .tryit-box .lbl{font-weight:800;color:#15803d;font-size:.82rem;margin-bottom:4px;display:block;}
  .quickcheck{background:#f8fafc;border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin:12px 0;}
  .quickcheck .lbl{font-weight:800;color:var(--muted);font-size:.82rem;margin-bottom:4px;display:block;}
  .needs-verify{background:#fff1f2;border-left:5px solid #e11d48;border-radius:10px;padding:12px 16px;margin:12px 0;font-size:.85rem;}
  .needs-verify .lbl{font-weight:800;color:#be123c;font-size:.82rem;margin-bottom:4px;display:block;}

  table.tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.9rem;}
  table.tbl th, table.tbl td{border:1px solid var(--border);padding:8px 10px;text-align:left;}
  table.tbl th{background:var(--primary-light);color:var(--primary-dark);}
  table.tbl tr:nth-child(even) td{background:#fdfafc;}

  .eng{color:var(--muted);font-weight:600;}
  code, .mono{font-family:'JetBrains Mono',Consolas,Menlo,monospace;background:#f5ecf1;padding:1px 6px;border-radius:6px;font-size:.9em;}

  .diagram-box{background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px;margin:12px 0;overflow-x:auto;}
  .diagram-cap{text-align:center;font-size:.8rem;color:var(--muted);margin-top:8px;}
  .flow-row{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;}
  .flow-node{background:var(--primary-light);border:2px solid var(--primary);border-radius:10px;padding:10px 14px;font-size:.85rem;font-weight:700;text-align:center;color:var(--primary-dark);min-width:100px;transition:all .25s;}
  .flow-node.active{background:var(--primary);color:#fff;transform:scale(1.07);box-shadow:0 4px 14px rgba(190,24,93,.4);}
  .flow-node.muted{opacity:.35;}
  .flow-node.done{background:var(--correct-bg);border-color:var(--correct);color:var(--correct);}
  .flow-arrow{font-size:1.3rem;color:var(--muted);}
  .flow-arrow.active{color:var(--accent);font-weight:900;}

  .tab-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
  .tab-btn{border:1.5px solid var(--border);background:#fff;border-radius:999px;padding:8px 16px;font-size:.85rem;font-weight:700;cursor:pointer;color:var(--text);}
  .tab-btn:hover{border-color:var(--primary);}
  .tab-btn.active{background:var(--primary);border-color:var(--primary);color:#fff;}

  .pillar-grid{display:flex;gap:4px;justify-content:center;align-items:stretch;margin:14px 0;flex-wrap:wrap;}
  .pillar{flex:1;min-width:110px;background:var(--primary-light);border:2px solid var(--primary);border-top:6px solid var(--accent);border-radius:8px;padding:12px 8px;text-align:center;font-size:.78rem;font-weight:700;cursor:pointer;color:var(--primary-dark);}
  .pillar.active{background:var(--primary);color:#fff;}
  .pillar-roof{background:var(--primary-dark);color:#fff;text-align:center;padding:10px;border-radius:10px 10px 0 0;font-weight:800;margin-bottom:0;}

  .sort-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:12px 0;}
  .sort-bin{border:2px dashed var(--border);border-radius:12px;padding:12px;min-height:90px;}
  .sort-bin h4{margin:0 0 8px;text-align:center;}
  .sort-pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0;}
  .sort-item{background:#fff;border:1.5px solid var(--border);border-radius:10px;padding:8px 12px;font-size:.82rem;font-weight:700;cursor:pointer;}
  .sort-item:hover{border-color:var(--primary);}
  .sort-item.placed{opacity:.35;pointer-events:none;}
  .sort-bin .item-in{display:inline-block;background:var(--primary-light);border-radius:8px;padding:4px 10px;margin:3px;font-size:.78rem;font-weight:700;}
  @media (max-width:600px){.sort-grid{grid-template-columns:1fr;}}

  .matrix-wrap{display:flex;gap:6px;justify-content:center;margin:14px 0;overflow-x:auto;}
  .matrix-table{border-collapse:collapse;}
  .matrix-table th, .matrix-table td{border:2px solid #fff;padding:0;text-align:center;}
  .matrix-table th{background:var(--primary-dark);color:#fff;font-size:.78rem;padding:8px;min-width:90px;}
  .matrix-cell{width:90px;height:60px;font-weight:800;font-size:.85rem;cursor:pointer;color:#fff;display:flex;align-items:center;justify-content:center;transition:transform .15s;}
  .matrix-cell:hover{transform:scale(1.06);outline:3px solid var(--accent);}
  .matrix-cell.active{outline:4px solid var(--primary-dark);}

  .revmodel-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0;}
  .revmodel-card{border:2px solid var(--border);border-radius:12px;padding:12px;text-align:center;cursor:pointer;background:#fff;font-weight:700;font-size:.82rem;}
  .revmodel-card.active{border-color:var(--accent);background:var(--accent-light);}

  .ev-stage{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:10px;}
  .ev-counter{font-weight:800;color:var(--primary-dark);font-size:.9rem;}

  .wave-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:12px 0;}
  .wave-card{border:2px solid var(--border);border-radius:12px;padding:14px;background:#fff;cursor:pointer;}
  .wave-card.active{border-color:var(--primary);background:var(--primary-light);}
  .wave-card h4{margin:0 0 6px;}

  .ex-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin:12px 0;}
  .ex-chip{background:#fff;border:1.5px solid var(--border);border-radius:10px;padding:10px;text-align:center;font-size:.82rem;font-weight:700;cursor:pointer;}
  .ex-chip:hover{border-color:var(--primary);background:var(--primary-light);}
  .ex-chip .cat{display:none;font-size:.7rem;font-weight:600;color:var(--accent);margin-top:4px;}
  .ex-chip.revealed .cat{display:block;}

  .cmp-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0;}
  .cmp-card{border:1.5px solid var(--border);border-radius:12px;padding:14px;background:#fff;}
  .cmp-card h4{margin-top:0;}
  @media (max-width:600px){.cmp-grid{grid-template-columns:1fr;}}

  .btn{border:none;border-radius:10px;padding:10px 18px;font-weight:700;font-size:.9rem;cursor:pointer;transition:transform .1s,opacity .15s;}
  .btn:active{transform:scale(.96);}
  .btn-primary{background:var(--primary);color:#fff;}
  .btn-primary:hover{background:var(--primary-dark);}
  .btn-accent{background:var(--accent);color:#fff;}
  .btn-ghost{background:#f6eef2;color:var(--text);}
  .btn-ghost:hover{background:#ecdfe6;}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;}

  input[type=text], input[type=number], select{
    font-family:inherit;border:1.5px solid var(--border);border-radius:8px;padding:8px 10px;font-size:.92rem;width:100%;
  }

  .q-block{border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:14px;background:#fff;}
  .q-block .q-meta{font-size:.72rem;font-weight:800;color:#fff;background:var(--muted);display:inline-block;padding:2px 10px;border-radius:999px;margin-bottom:8px;}
  .q-block .q-meta.tier-green{background:#16a34a;}
  .q-block .q-meta.tier-yellow{background:#d97706;}
  .q-block .q-meta.tier-red{background:#dc2626;}
  .q-text{font-weight:700;margin-bottom:10px;}
  .opt{display:flex;align-items:center;gap:10px;border:1.5px solid var(--border);border-radius:9px;padding:9px 12px;margin-bottom:7px;cursor:pointer;font-size:.9rem;background:#fbfafb;}
  .opt:hover{border-color:var(--primary);background:var(--primary-light);}
  .opt.correct{border-color:var(--correct);background:var(--correct-bg);}
  .opt.incorrect{border-color:var(--incorrect);background:var(--incorrect-bg);}
  .opt .letter{width:24px;height:24px;border-radius:50%;background:#efe4ea;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.78rem;flex:0 0 auto;}
  .opt.correct .letter{background:var(--correct);color:#fff;}
  .opt.incorrect .letter{background:var(--incorrect);color:#fff;}
  .feedback-line{font-size:.85rem;font-weight:700;margin-top:6px;min-height:1.2em;}
  .feedback-line.ok{color:var(--correct);}
  .feedback-line.bad{color:var(--incorrect);}
  .explain-box{display:none;background:#f8fafc;border-radius:8px;padding:10px 12px;margin-top:8px;font-size:.85rem;}
  .explain-box.show{display:block;}

  details.acc{border:1px solid var(--border);border-radius:10px;margin-bottom:10px;overflow:hidden;}
  details.acc summary{padding:12px 14px;cursor:pointer;font-weight:700;background:#fdfafc;}
  details.acc[open] summary{background:var(--primary-light);color:var(--primary-dark);}
  details.acc .acc-body{padding:12px 16px;}

  .fib-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px;font-size:.92rem;}
  .fib-row input{width:200px;}

  .bottom-bar{
    position:sticky;bottom:0;background:#fff;border-top:1px solid var(--border);
    display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;z-index:30;
  }
  .bottom-bar .mark-btn{background:var(--correct-bg);color:var(--correct);}
  .bottom-bar .mark-btn.done{background:var(--correct);color:#fff;}

  footer.note{text-align:center;font-size:.72rem;color:#a68a9a;padding:10px;background:#fff;border-top:1px solid var(--border);}

  @media (max-width:860px){
    nav.sidebar{
      position:fixed;top:0;left:0;bottom:0;z-index:60;transform:translateX(-100%);
      transition:transform .22s ease;box-shadow:4px 0 24px rgba(0,0,0,.25);
    }
    nav.sidebar.open{transform:translateX(0);}
    header.top .burger{display:flex;}
    .sidebar-backdrop.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;}
    main.content{padding:16px 12px 100px;}
    .topic-header h2{font-size:1.25rem;}
    .cmp-grid{grid-template-columns:1fr;}
    .matrix-cell{width:64px;height:48px;font-size:.68rem;}
    .matrix-table th{min-width:64px;font-size:.66rem;padding:5px;}
  }
  @media (max-width:480px){
    header.top h1{font-size:.92rem;}
    .flow-node{min-width:80px;font-size:.78rem;padding:8px 10px;}
  }
</style>
</head>
<body>
<div class="app-shell">
  <header class="top">
    <button class="burger" id="burgerBtn" aria-label="பட்டி">☰</button>
    <div class="title-wrap">
      <h1>Computer Applications Learning Lab · Class 12 · Tamil Nadu State Board</h1>
      <p>பாடம் 15 — மின்-வணிகம் (E-Commerce)</p>
    </div>
    <div class="lang-toggle" role="group" aria-label="Interface language">
      <button id="langTa" class="active" data-lang="ta">தமிழ்</button>
      <button id="langEn" data-lang="en">English</button>
    </div>
  </header>

  <div class="body-row">
    <div class="sidebar-backdrop" id="backdrop"></div>
    <nav class="sidebar" id="sidebar" aria-label="பாட பட்டியல்">
      <div class="progress-wrap">
        <div class="progress-label"><span>முன்னேற்றம் / Progress</span><span id="progPct">0%</span></div>
        <div class="progress-bar"><div class="progress-fill" id="progFill" style="width:0%"></div></div>
      </div>
      <div class="sidebar-section-label">தலைப்புகள் (Topics)</div>
      <div id="topicList"></div>
    </nav>

    <main class="content">
      <div class="content-inner" id="mainContent"></div>
    </main>
  </div>

  <div class="bottom-bar">
    <button class="btn btn-ghost" id="prevTopicBtn">⬅ முந்தையது</button>
    <button class="btn mark-btn" id="markCompleteBtn">✔ Mark Complete</button>
    <button class="btn btn-primary" id="nextTopicBtn">அடுத்தது ➡</button>
  </div>
  <footer class="note">Vagai Sudar · Class 12 Computer Applications · Chapter 15: E-Commerce · தமிழக அரசு பாடநூல் அடிப்படையில் · ஆஃப்லைன் கற்றல் கூடம்</footer>
</div>

<script>
/* ============================= STORAGE ============================= */
const STORE_KEY = 'ca12_ecommerce_lab_v1';
function loadState(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){ /* storage unavailable */ }
  return { completed:[], lang:'ta' };
}
function saveState(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){ /* ignore */ }
}
let state = loadState();

/* ============================= TOPICS ============================= */
const TOPICS = [
  {id:'intro',      num:'15.1', title:'அறிமுகம் — மின்-தொழில் & மின்-வணிகம்'},
  {id:'evolution',  num:'15.2', title:'பரிணாம வளர்ச்சி'},
  {id:'waves',      num:'15.3', title:'வளர்ச்சி அலைகள்'},
  {id:'models',     num:'15.4', title:'வர்த்தக மாதிரிகள்'},
  {id:'revenue',    num:'15.5', title:'வருவாய் மாதிரிகள்'},
  {id:'comparison', num:'15.6', title:'மரபு வணிகம் Vs மின்-வணிகம்'},
  {id:'proscons',   num:'15.7', title:'நன்மைகள் & குறைபாடுகள்'},
  {id:'practice',   num:'Practice', title:'பயிற்சி & Debugging Lab'},
  {id:'examprep',   num:'Exam', title:'தேர்வு தயாரிப்பு'},
];
let currentIdx = 0;

/* ============================= SIDEBAR / NAV ============================= */
function renderSidebar(){
  const wrap = document.getElementById('topicList');
  wrap.innerHTML = '';
  TOPICS.forEach((t, i) => {
    const btn = document.createElement('button');
    btn.className = 'topic-btn' + (i === currentIdx ? ' active' : '');
    const done = state.completed.includes(t.id);
    btn.innerHTML = '<span class="num">'+t.num+'</span><span>'+t.title+'</span>' + (done ? '<span class="chk">✔</span>' : '');
    btn.addEventListener('click', () => { goTo(i); closeSidebarMobile(); });
    wrap.appendChild(btn);
  });
  const pct = Math.round((state.completed.length / TOPICS.length) * 100);
  document.getElementById('progPct').textContent = pct + '%';
  document.getElementById('progFill').style.width = pct + '%';
}

function goTo(i){
  currentIdx = Math.max(0, Math.min(TOPICS.length - 1, i));
  renderMain();
  renderSidebar();
  updateBottomBar();
  window.scrollTo({top:0, behavior:'smooth'});
  document.querySelector('main.content').scrollTo({top:0, behavior:'smooth'});
}

function updateBottomBar(){
  document.getElementById('prevTopicBtn').disabled = currentIdx === 0;
  document.getElementById('nextTopicBtn').disabled = currentIdx === TOPICS.length - 1;
  const markBtn = document.getElementById('markCompleteBtn');

/* ============================= MCQ HELPER ============================= */
function mcqHTML(qid, qObj, tierClass, tierLabel){
  const letters = ['அ','ஆ','இ','ஈ','உ'];
  let optsHtml = qObj.o.map((opt,i) =>
    `<div class="opt" data-qid="${qid}" data-idx="${i}"><span class="letter">${letters[i]}</span><span>${opt}</span></div>`
  ).join('');
  return `
  <div class="q-block" id="block-${qid}">
    ${tierLabel ? `<span class="q-meta ${tierClass}">${tierLabel}</span>` : ''}
    <div class="q-text">${qObj.q}</div>
    <div class="opts-wrap">${optsHtml}</div>
    <div class="feedback-line" id="fb-${qid}"></div>
    ${qObj.exp ? `<div class="explain-box" id="exp-${qid}">💡 ${qObj.exp}</div>` : ''}
  </div>`;
}
function wireMCQ(containerSel, dataMap){
  document.querySelectorAll(containerSel + ' .opt').forEach(opt => {
    opt.addEventListener('click', function(){
      const qid = this.dataset.qid;
      const idx = parseInt(this.dataset.idx,10);
      const block = document.getElementById('block-'+qid);
      if(block.dataset.answered) return;
      block.dataset.answered = '1';
      const qObj = dataMap[qid];
      const opts = block.querySelectorAll('.opt');
      opts.forEach((o,i) => {
        if(i === qObj.c) o.classList.add('correct');
        if(i === idx && idx !== qObj.c) o.classList.add('incorrect');
      });
      const fb = document.getElementById('fb-'+qid);
      if(idx === qObj.c){ fb.textContent = '✅ சரியான விடை!'; fb.className='feedback-line ok'; }
      else { fb.textContent = '❌ தவறான விடை. சரியான விடை: ' + qObj.o[qObj.c]; fb.className='feedback-line bad'; }
      const exp = document.getElementById('exp-'+qid);
      if(exp) exp.classList.add('show');
    });
  });
}

  {n:'புத்தகம் 📖', t:'tangible'}, {n:'DVD 💿', t:'tangible'}, {n:'மின் விளக்கு 💡', t:'tangible'},
  {n:'பதிவிறக்கம் செய்யப்பட்ட விளையாட்டு 🎮', t:'intangible'}, {n:'இசைக் கோப்பு 🎵', t:'intangible'}, {n:'திரைப்படக் கோப்பு 🎬', t:'intangible'},
];
function wireIntro(){
  document.getElementById('pillarGrid').innerHTML = PILLARS.map(p =>
    `<div class="pillar" data-k="${p.k}">${p.t}</div>`).join('');
  document.querySelectorAll('.pillar').forEach(el => {
    el.addEventListener('click', function(){
      document.querySelectorAll('.pillar').forEach(x=>x.classList.remove('active'));
      this.classList.add('active');
      const p = PILLARS.find(x=>x.k===this.dataset.k);
      const panel = document.getElementById('pillarDetail');
      panel.style.display = 'block';
      panel.innerHTML = '<span class="lbl">💡 '+p.t+' <span class="eng">('+p.en+')</span></span>'+p.d;
    });
  });

  let placed = {};
  function renderSort(){
    document.getElementById('sortPool').innerHTML = SORT_ITEMS.map((it,i) =>
      `<div class="sort-item ${placed[i]?'placed':''}" data-i="${i}">${it.n}</div>`).join('');
    document.querySelectorAll('.sort-item').forEach(el => {
      el.addEventListener('click', function(){
        const i = parseInt(this.dataset.i,10);
        if(placed[i]) return;
        placed[i] = SORT_ITEMS[i].t;
        renderSort();
        checkSort();
      });
    });
    const tBin = document.querySelector('#binTangible .bin-items');
    const iBin = document.querySelector('#binIntangible .bin-items');
    tBin.innerHTML = Object.keys(placed).filter(i=>placed[i]==='tangible').map(i=>`<span class="item-in">${SORT_ITEMS[i].n}</span>`).join('');
    iBin.innerHTML = Object.keys(placed).filter(i=>placed[i]==='intangible').map(i=>`<span class="item-in">${SORT_ITEMS[i].n}</span>`).join('');
  }
  function checkSort(){
    const done = Object.keys(placed).length === SORT_ITEMS.length;
    document.getElementById('sortResult').textContent = done ? '🎉 அனைத்தும் சரியாக வகைப்படுத்தப்பட்டது!' : (Object.keys(placed).length + ' / ' + SORT_ITEMS.length + ' வைக்கப்பட்டது.');
  }
  renderSort();
  document.getElementById('sortResetBtn').addEventListener('click', () => { placed = {}; renderSort(); document.getElementById('sortResult').textContent=''; });
}

}

};
function wireModels(){
  const rows = ['BUSINESS','CONSUMER','GOVERNMENT'];
  const labels = {BUSINESS:'BUSINESS', CONSUMER:'CONSUMER', GOVERNMENT:'GOVERNMENT'};
  const shortFrom = {BUSINESS:'B', CONSUMER:'C', GOVERNMENT:'G'};
  const colors = {BUSINESS:'#be185d', CONSUMER:'#0891b2', GOVERNMENT:'#7c3aed'};
  let html = '<tr><th></th>' + rows.map(c=>'<th>'+labels[c]+'</th>').join('') + '</tr>';
  rows.forEach(r => {
    html += '<tr><th>'+labels[r]+'</th>';
    rows.forEach(c => {
      const code = shortFrom[r]+'2'+shortFrom[c];
      html += `<td><div class="matrix-cell" data-code="${code}" style="background:${colors[r]}">${code}</div></td>`;
    });
    html += '</tr>';
  });
  document.getElementById('matrixTable').innerHTML = html;
  document.querySelectorAll('.matrix-cell').forEach(cell => {
    cell.addEventListener('click', function(){
      document.querySelectorAll('.matrix-cell').forEach(x=>x.classList.remove('active'));
      this.classList.add('active');
      const info = MODEL_INFO[this.dataset.code];
      const panel = document.getElementById('matrixDetail');
      panel.style.display = 'block';
      panel.innerHTML = '<span class="lbl">📘 '+info.t+'</span>'+info.d+'<div class="example-box" style="margin-top:8px;"><span class="lbl">🧩 உதாரணம்</span>'+info.eg+'</div>';
    });
  });
}

      const val = (document.getElementById('fib-'+i).value || '').trim().toLowerCase();
      const ok = val === f.ans || val.replace(/\s/g,'') === f.ans.replace(/\s/g,'');
      document.getElementById('fib-'+i).style.borderColor = val === '' ? 'var(--border)' : (ok ? 'var(--correct)' : 'var(--incorrect)');
      if(ok) correct++;
    });
    document.getElementById('fibResult').innerHTML = correct + ' / ' + FIB_QS.length + ' சரியானவை. (சரியான விடைகள்: ' + FIB_QS.map(f=>f.ans).join(', ') + ')';

      </div>
      <div id="matchResult" style="margin-top:10px;font-weight:700;"></div>`;
    const leftCol = document.getElementById('matchLeftCol');
    const rightCol = document.getElementById('matchRightCol');
    MATCH_LEFT.forEach(l => {
      const b = document.createElement('button');
      b.className = 'btn btn-ghost'; b.style.display='block'; b.style.marginBottom='8px'; b.style.minWidth='160px';
      b.textContent = l + (matched[l] ? ' ✅' : '');
      if(matched[l]) b.disabled = true;
      b.addEventListener('click', () => { selectedLeft = l; renderMatch(); });
      leftCol.appendChild(b);
    });
    MATCH_RIGHT.forEach(r => {
      const usedUp = Object.values(matched).includes(r);
      const b = document.createElement('button');
      b.className = 'btn btn-ghost'; b.style.display='block'; b.style.marginBottom='8px'; b.style.minWidth='320px'; b.style.textAlign='left';

        selectedLeft = null;

          const allCorrect = MATCH_LEFT.every(l => matched[l] === MATCH_ANSWER[l]);

      rightCol.appendChild(b);

    <div class="card" style="margin-bottom:12px;">
      <div><span style="color:var(--incorrect);font-weight:800;">❌ </span><span style="font-weight:700;">${c.wrong}</span></div>
      <button class="btn btn-ghost" style="margin-top:8px;" data-mis="${i}">ஏன் தவறு? (Why is this wrong?)</button>
      <div class="explain-box" id="mis-${i}">
        <b>வகை:</b> ${c.type}<br>
        <b>ஏன்?:</b> ${c.why}<br>
        <span style="color:var(--correct);font-weight:800;">✅ சரியான புரிதல்:</span> ${c.fix}
      </div>
    </div>`).join('');
  document.querySelectorAll('[data-mis]').forEach(btn => {
    btn.addEventListener('click', function(){ document.getElementById('mis-'+this.dataset.mis).classList.toggle('show'); });
  });
}

/* =========================================================================
   EXAM PREP WIRING
   ========================================================================= */
function wireExamPrep(){
  document.getElementById('goToPracticeBtn').addEventListener('click', () => {
    const idx = TOPICS.findIndex(t => t.id === 'practice');
    goTo(idx);
  });
  document.getElementById('challengeWrap').innerHTML = Object.keys(CHALLENGE_QS).map(k => mcqHTML(k, CHALLENGE_QS[k], 'tier-red', '🔴 Challenge')).join('');
  wireMCQ('#challengeWrap', CHALLENGE_QS);
}

/* ============================= INIT ============================= */
setLang(state.lang || 'ta');
renderSidebar();
renderMain();
updateBottomBar();
</script>
</body>

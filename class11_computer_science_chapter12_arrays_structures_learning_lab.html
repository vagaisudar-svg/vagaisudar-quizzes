<style>

    --card:#ffffff;

    --primary-dark:#1e3a8a;

<script>
/* =========================================================================
   STORAGE
   ========================================================================= */
const STORE_KEY = 'cs11_ch12_arrays_structures_lab_v1';
function loadState(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){ /* ignore */ }
  return {lang:'en', completed:[]};
}
function saveState(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){ /* ignore */ }
}
let state = loadState();

/* =========================================================================
   UTIL
   ========================================================================= */
function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function parseNums(str){
  return String(str).split(/[,\s]+/).map(s=>s.trim()).filter(s=>s!=='').map(Number).filter(n=>!isNaN(n));
}

function arrayVis(values, opts){
  opts = opts || {};
  const activeSet = new Set(opts.highlight || []);
  const okSet = new Set(opts.ok || []);
  const noSet = new Set(opts.no || []);
  const dimSet = new Set(opts.dim || []);
  const addrStart = (opts.addrStart === undefined) ? null : opts.addrStart;
  const bytes = opts.bytesPerElem || 4;
  const prefix = opts.prefix || 'a';
  let html = '<div class="array-vis">';
  values.forEach((v,i)=>{
    let cls = 'array-cell';
    if(activeSet.has(i)) cls += ' active';
    if(okSet.has(i)) cls += ' ok';
    if(noSet.has(i)) cls += ' no';
    if(dimSet.has(i)) cls += ' dim';
    const shown = (v===undefined || v===null || v==='') ? (opts.emptyLabel || '—') : esc(v);
    html += '<div class="'+cls+'">';
    html += '<div class="idx">'+prefix+'['+i+']</div>';
    html += '<div class="val">'+shown+'</div>';
    if(addrStart !== null) html += '<div class="addr">'+(addrStart + i*bytes)+'</div>';
    html += '</div>';
  });
  html += '</div>';
  return html;
}

function structVis(fields, opts){
  opts = opts || {};
  const activeIdx = (opts.active === undefined) ? -1 : opts.active;
  let html = '<div class="struct-box">';
  fields.forEach((f,i)=>{
    html += '<div class="struct-field'+(i===activeIdx?' active':'')+'">';
    html += '<div class="fname">'+esc(f.name)+'</div>';
    html += '<div class="ftype">'+esc(f.type)+'</div>';
    html += '<div class="fbytes">'+f.bytes+' byte'+(f.bytes>1?'s':'')+(f.value!==undefined?(' = '+esc(f.value)):'')+'</div>';
    html += '</div>';
  });
  html += '</div>';
  return html;
}

    int num[10], even=0, odd=0;

function mcqHTML(qid, qObj, tierClass, tierLabel){
  const letters = ['A','B','C','D'];
  let optsHtml = qObj.o.map((opt,i)=>
    `<div class="opt" data-qid="${qid}" data-idx="${i}"><span class="letter">${letters[i]}</span><span>${esc(opt)}</span></div>`
  ).join('');
  return `
  <div class="q-block" id="block-${qid}">
    ${tierLabel ? `<span class="q-meta ${tierClass}">${tierLabel}</span>` : ''}
    <div class="q-text">${esc(qObj.q)}</div>
    <div class="opts-wrap">${optsHtml}</div>
    <div class="feedback-line" id="fb-${qid}"></div>
    ${qObj.exp ? `<div class="explain-box" id="exp-${qid}">💡 ${esc(qObj.exp)}</div>` : ''}
  </div>`;
}
function wireMCQ(containerSel, dataMap, onAnswered){
  document.querySelectorAll(containerSel + ' .opt').forEach(opt=>{
    opt.addEventListener('click', function(){
      const qid = this.dataset.qid;
      const idx = parseInt(this.dataset.idx,10);
      const block = document.getElementById('block-'+qid);
      if(block.dataset.answered) return;
      block.dataset.answered = '1';
      const qObj = dataMap[qid];
      const opts = block.querySelectorAll('.opt');
      opts.forEach((o,i)=>{
        if(i===qObj.c) o.classList.add('correct');
        if(i===idx && idx!==qObj.c) o.classList.add('incorrect');
      });
      const fb = document.getElementById('fb-'+qid);
      const ok = idx===qObj.c;
      fb.textContent = ok ? '🎉 Correct!' : '❌ Not quite. Correct answer: ' + qObj.o[qObj.c];
      fb.className = 'feedback-line ' + (ok?'ok':'bad');
      const exp = document.getElementById('exp-'+qid);
      if(exp) exp.classList.add('show');
      if(onAnswered) onAnswered(qid, ok);
    });
  });
}

/* =========================================================================
   TOPIC 1 — Overview & Concept Map
   ========================================================================= */
function renderOverview(){
  return `
  <div class="topic-header">
    <div class="crumb">Unit III · Chapter 12 · 12.1</div>
    <h2>Introduction to Arrays <span style="color:var(--muted);font-weight:500;">&amp; Chapter Concept Map</span></h2>
    <div class="goals">
      <b>Learning Objectives (textbook):</b> Know the structured data type using arrays · Know the types of arrays · Write programs to manipulate different types of arrays · (later in this chapter) understand structures and how they group mixed data types.
    </div>
  </div>

  <div class="card">
    <h3>12.1 Introduction</h3>
    <div class="tb-def">
      <span class="lbl">📘 Textbook Definition</span>
      "The variables are used to store data. These variables are one of the basic building blocks in C++. A single variable is used to store a single value that can be used anywhere in the memory. In some situations, we need to store multiple values of the same type. In that case, it needs multiple variables of the same data type. ... An array is a collection of variables of the same type that are referenced by a common name."
    </div>
    <div class="easy">
      <span class="lbl">💡 Easy Explanation</span>
      To store the roll numbers of 100 students, the textbook points out it would take 100 separate variables — <span class="mono">roll1, roll2, roll3 ... roll100</span>. That is hard to declare and hard to manage. An <b>array</b> solves this: one name, many boxes of the same type, each identified by a number called an <b>index</b> (or subscript) that starts from 0.
    </div>
    <div class="analogy">
      <span class="lbl">🔗 Real-life Analogy</span>
      Think of an egg tray with 10 slots. The tray has ONE name ("egg tray"), but each slot has its own position (slot 0, slot 1 ... slot 9). You don't need 10 different names for 10 eggs — you just say "the egg in slot 3". An array works exactly the same way for data in memory.

let loopSim = null;
function wireArrInit(){
  document.getElementById('codeInputLoop').innerHTML = esc(CODE_INPUT_LOOP);
  document.getElementById('fig121').innerHTML = arrayVis([19,21,16,1,50], {prefix:'age'});

  function resetLoop(){
    const vals = parseNums(document.getElementById('loopVals').value);
    loopSim = {vals: vals, i:0, filled: new Array(5).fill('')};
    document.getElementById('loopBoxes').innerHTML = arrayVis(loopSim.filled, {prefix:'num', emptyLabel:'?'});
    document.getElementById('loopLog').innerHTML = '<div class="ln">Press "Step" to begin the loop (i = 0)...</div>';
  }
  function stepLoop(){
    if(!loopSim) resetLoop();
    const log = document.getElementById('loopLog');
    if(loopSim.i >= 5){
      log.innerHTML += '<div class="ln"><span class="step-no">Condition:</span> i &lt; 5 → <span class="tf f">FALSE (i=5)</span> → <b>Exit loop</b></div>';
      log.scrollTop = log.scrollHeight;
      return;
    }
    const i = loopSim.i;
    const v = (loopSim.vals[i] !== undefined) ? loopSim.vals[i] : 0;
    loopSim.filled[i] = v;
    document.getElementById('loopBoxes').innerHTML = arrayVis(loopSim.filled, {prefix:'num', highlight:[i], emptyLabel:'?'});
    log.innerHTML += `<div class="ln"><span class="step-no">Iteration ${i+1}:</span> i &lt; 5 → <span class="tf t">TRUE (i=${i})</span> &nbsp;|&nbsp; cout prompts "Enter value ${i+1}= " &nbsp;|&nbsp; cin stores <b>num[${i}] = ${v}</b> &nbsp;|&nbsp; i++ → i=${i+1}</div>`;
    log.scrollTop = log.scrollHeight;
    loopSim.i++;
  }
  document.getElementById('loopStepBtn').addEventListener('click', stepLoop);
  document.getElementById('loopResetBtn').addEventListener('click', resetLoop);
  resetLoop();

  const qs = {
    q3:{q:'int age[]={6,90,20,18,2}; How many elements are there in this array?', o:['2','5','6','4'], c:1, exp:'Textbook Evaluation, Section A, Q2. The compiler counts 5 values inside the braces, so the array size becomes 5.'}

}

function renderStrPalin(){
  return `
  <div class="topic-header">
    <div class="crumb">Chapter 12 · Strings</div>
    <h2>Program: Check Palindrome or Not</h2>
    <div class="goals"><b>Goal:</b> Trace a complete string-processing program, and learn to spot a very common bracing mistake.</div>
  </div>

  <div class="card">
    <h3>📘 Textbook Program</h3>
    <div class="code-box" id="codePalinTB"></div>
    <div class="code-cap">Output</div>
    <div class="out-box" id="outPalin"></div>

    <div class="mistake-box">
      <span class="lbl">⚠️ Common Mistake — Missing Braces</span>
      Look very carefully at the inner loop body:
      <div class="code-box">if(a[j]!=a[i])
    flag=0;
    break;</div>
      Because there is <b>no { }</b> around the <span class="mono">if</span>, only <span class="mono">flag=0;</span> belongs to the <span class="mono">if</span>. The <span class="mono">break;</span> line runs <b>unconditionally, every single time</b>, after only the very first comparison — so the loop actually stops after checking just one pair of characters, and never finishes comparing the rest of the string!
      <br><br>
      Worse still, the outer <span class="mono">for(len=strlen(a); a[len]!='\\0'; ++len)</span> loop also has no braces, so its "body" is the entire inner <span class="mono">for</span> loop. Since <span class="mono">len</span> is set to <span class="mono">strlen(a)</span> — which already points at the null character — the condition <span class="mono">a[len]!='\\0'</span> is <b>false immediately</b>, so the inner loop (the real comparison logic) <b>never runs at all</b>! <span class="mono">flag</span> stays at its starting value of 1, so this program as printed would say "palindrome" for <i>any</i> word typed in.
    </div>

    <div class="fixbox">
      <span class="lbl">✅ Improved Example (corrected)</span>
      <div class="code-box" id="codePalinFixed"></div>
      Two fixes: (1) <span class="mono">len = strlen(a);</span> is written as a normal statement, not a stray <span class="mono">for</span> loop. (2) Curly braces <span class="mono">{ }</span> now wrap both <span class="mono">flag=0;</span> and <span class="mono">break;</span> so they only run together, only when a mismatch is actually found.
    </div>
  </div>

  <div class="card">
    <h3>🧪 Step-by-step Simulation — Palindrome Tracer</h3>
    <p>This simulator follows the <b>corrected logic</b> so you can see how a real palindrome check should work: two pointers, <span class="mono">i</span> from the left and <span class="mono">j</span> from the right, move toward the middle.</p>
    <div class="field-row">
      <div class="f"><label>Word to check</label><input type="text" id="palinWord" value="madam" maxlength="12"></div>
      <div class="f"><button class="btn btn-primary" id="palinStepBtn">▶ Step</button></div>
      <div class="f"><button class="btn btn-ghost" id="palinResetBtn">⟲ Reset</button></div>
    </div>
    <div id="palinBoxes"></div>
    <div class="log-panel" id="palinLog"><div class="ln">Press "Step" to compare a[i] and a[j]...</div></div>
  </div>

  <div class="quickcheck"><span class="lbl">✅ Quick Check</span><div id="qc-strpalin"></div></div>
  `;
}
let palinSim = null;
function wireStrPalin(){
  document.getElementById('codePalinTB').innerHTML = esc(CODE_PALINDROME_TB);
  document.getElementById('outPalin').innerHTML = esc(OUT_PALINDROME);
  document.getElementById('codePalinFixed').innerHTML = esc(CODE_PALINDROME_FIXED);

  function resetPalin(){
    const word = (document.getElementById('palinWord').value || '').toLowerCase().replace(/[^a-z0-9]/g,'');
    palinSim = {word, i:0, j:word.length-1, flag:1, done:false};
    document.getElementById('palinBoxes').innerHTML = arrayVis(word.split(''), {prefix:'a', highlight:[palinSim.i, palinSim.j]});
    document.getElementById('palinLog').innerHTML = `<div class="ln">len = ${word.length}. i starts at 0, j starts at ${palinSim.j}. Press "Step"...</div>`;
  }
  function stepPalin(){
    if(!palinSim) resetPalin();
    const log = document.getElementById('palinLog');
    const {word} = palinSim;
    if(palinSim.done) return;
    if(palinSim.i >= word.length/2){
      palinSim.done = true;
      const verdict = palinSim.flag===1 ? 'The String is palindrome' : 'The String is not palindrome';
      document.getElementById('palinBoxes').innerHTML = arrayVis(word.split(''), {prefix:'a', ok: palinSim.flag===1 ? word.split('').map((_,k)=>k) : []});
      log.innerHTML += `<div class="ln"><b>i &lt; len/2 is now FALSE → loop ends. flag = ${palinSim.flag} → "${verdict}"</b></div>`;
      log.scrollTop = log.scrollHeight;
      return;
    }
    const {i,j} = palinSim;
    const match = word[i] === word[j];
    document.getElementById('palinBoxes').innerHTML = arrayVis(word.split(''), {prefix:'a', highlight:[i,j]});
    log.innerHTML += `<div class="ln"><span class="step-no">Compare:</span> a[${i}]='${word[i]}' vs a[${j}]='${word[j]}' → <span class="tf ${match?'t':'f'}">${match?'MATCH':'MISMATCH'}</span></div>`;
    if(!match){
      palinSim.flag = 0;
      palinSim.done = true;
      document.getElementById('palinBoxes').innerHTML = arrayVis(word.split(''), {prefix:'a', no:[i,j]});
      log.innerHTML += `<div class="ln"><b>flag = 0, break; → "The String is not palindrome"</b></div>`;
    } else {
      palinSim.i++; palinSim.j--;
    }
    log.scrollTop = log.scrollHeight;
  }
  document.getElementById('palinStepBtn').addEventListener('click', stepPalin);
  document.getElementById('palinResetBtn').addEventListener('click', resetPalin);
  resetPalin();

  const qs = {
    q7:{q:'In the corrected palindrome program, what do the pointers i and j do?', o:['i and j both start from 0', 'i moves from the left end, j moves from the right end, towards the middle', 'i and j stay fixed', 'j always equals i'], c:1, exp:'Learning Activity — i starts at the first character (0), j starts at the last character (len-1); each step moves i forward and j backward.'}
  };
  document.getElementById('qc-strpalin').innerHTML = mcqHTML('q7', qs.q7, 'tier-yellow', '🟡 Practice');
  wireMCQ('#qc-strpalin', qs);
}

frank.age

let sbFields = [{name:'rollno', type:'long'}, {name:'age', type:'int'}, {name:'weight', type:'float'}];
function wireStructBasics(){
  document.getElementById('fig125').innerHTML = structVis([{name:'Rollno',type:'long',bytes:4},{name:'Age',type:'int',bytes:2},{name:'weight',type:'float',bytes:4}]);

          <option value="char"${f.type==='char'?' selected':''}>char</option>
        </select></div>
      </div>`;
    });
    document.getElementById('structBuilderFields').innerHTML = html;

  }

  function buildStruct(){

    let decl = 'struct MyStruct\n{\n';

  }

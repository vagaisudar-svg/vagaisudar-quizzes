<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>7th Tamil - Term 3 Unit 2 - Quiz</title>
<style>
  :root{
    --maroon:#7a1f2b;
    --maroon-dark:#5c1620;
    --pink-bg:#fdf3f0;
    --card-bg:#ffffff;
    --border:#d9c7c1;
    --correct:#1e7e34;
    --correct-bg:#d4edda;
    --incorrect:#b02a37;
    --incorrect-bg:#f8d7da;
    --selected:#7a1f2b;
    --text:#2b2b2b;
    --muted:#6b6b6b;
    --flag:#a15c00;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI', Tahoma, Verdana, Arial, sans-serif;
    background:linear-gradient(135deg,#fdf3f0,#f5e6e0);
    color:var(--text);
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:20px 12px;
  }
  .app{
    width:100%;
    max-width:720px;
  }
  header{
    text-align:center;
    margin-bottom:18px;
  }
  header h1{
    font-size:1.4rem;
    color:var(--maroon);
    margin:0 0 4px 0;
  }
  header p{
    margin:0;
    color:var(--muted);
    font-size:0.9rem;
  }
  .card{
    background:var(--card-bg);
    border-radius:16px;
    box-shadow:0 6px 20px rgba(122,31,43,0.12);
    padding:22px 20px;
    margin-bottom:16px;
  }
  .progress-wrap{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:10px;
    font-size:0.9rem;
    color:var(--muted);
    font-weight:600;
  }
  .progress-bar-bg{
    width:100%;
    background:#eee2df;
    border-radius:8px;
    height:8px;
    overflow:hidden;
    margin-bottom:18px;
  }
  .progress-bar-fill{
    height:100%;
    background:linear-gradient(90deg,var(--maroon),#b8434f);
    border-radius:8px;
    transition:width 0.3s ease;
  }
  .question-badge{
    display:inline-block;
    background:var(--maroon);
    color:#fff;
    font-weight:700;
    font-size:0.8rem;
    padding:4px 12px;
    border-radius:999px;
    margin-bottom:12px;
  }
  .question-text{
    font-size:1.15rem;
    font-weight:600;
    line-height:1.5;
    margin-bottom:18px;
    color:var(--text);
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .option{
    display:flex;
    align-items:center;
    gap:12px;
    border:2px solid var(--border);
    border-radius:12px;
    padding:12px 14px;
    cursor:pointer;
    transition:all 0.15s ease;
    background:#fff;
    font-size:1rem;
  }
  .option:hover{
    border-color:var(--maroon);
    background:#fdf3f0;
  }
  .option.selected{
    border-color:var(--selected);
    background:#f6e4e6;
    font-weight:600;
  }
  .option.correct{
    border-color:var(--correct);
    background:var(--correct-bg);
    font-weight:600;
  }
  .option.incorrect{
    border-color:var(--incorrect);
    background:var(--incorrect-bg);
    font-weight:600;
  }
  .option .letter{
    display:flex;
    align-items:center;
    justify-content:center;
    min-width:28px;
    height:28px;
    border-radius:50%;
    background:#f1dfda;
    color:var(--maroon);
    font-weight:700;
    font-size:0.85rem;
    flex-shrink:0;
  }
  .option.selected .letter{background:var(--maroon);color:#fff;}
  .option.correct .letter{background:var(--correct);color:#fff;}
  .option.incorrect .letter{background:var(--incorrect);color:#fff;}
  .option .mark{
    margin-left:auto;
    font-weight:700;
    font-size:1.1rem;
  }
  .nav-buttons{
    display:flex;
    justify-content:space-between;
    gap:10px;
    margin-top:20px;
  }
  button{
    font-family:inherit;
    border:none;
    border-radius:10px;
    padding:12px 20px;
    font-size:0.95rem;
    font-weight:600;
    cursor:pointer;
    transition:transform 0.1s ease, opacity 0.15s ease;
  }
  button:active{transform:scale(0.97);}
  button:disabled{
    opacity:0.4;
    cursor:not-allowed;
  }
  .btn-primary{
    background:var(--maroon);
    color:#fff;
  }
  .btn-primary:hover:not(:disabled){background:var(--maroon-dark);}
  .btn-secondary{
    background:#eee2df;
    color:var(--maroon-dark);
  }
  .btn-secondary:hover:not(:disabled){background:#e2d0cb;}
  .flex-grow{flex:1;}

  /* Results screen */
  .score-circle{
    width:150px;
    height:150px;
    border-radius:50%;
    margin:0 auto 18px auto;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    background:conic-gradient(var(--maroon) calc(var(--pct) * 1%), #eee2df 0);
    position:relative;
  }
  .score-circle::before{
    content:"";
    position:absolute;
    width:118px;
    height:118px;
    border-radius:50%;
    background:#fff;
  }
  .score-circle .score-text{
    position:relative;
    z-index:1;
    text-align:center;
  }
  .score-circle .score-text .big{
    font-size:1.8rem;
    font-weight:800;
    color:var(--maroon);
    display:block;
  }
  .score-circle .score-text .small{
    font-size:0.75rem;
    color:var(--muted);
  }
  .summary-line{
    text-align:center;
    font-size:1.05rem;
    margin-bottom:22px;
    color:var(--text);
  }
  .summary-line b{color:var(--maroon);}

  .review-item{
    border:1px solid var(--border);
    border-radius:12px;
    padding:14px 16px;
    margin-bottom:12px;
  }
  .review-item .rq{
    font-weight:600;
    margin-bottom:8px;
    line-height:1.5;
  }
  .review-item .status{
    font-size:0.8rem;
    font-weight:700;
    padding:2px 10px;
    border-radius:999px;
    display:inline-block;
    margin-bottom:8px;
  }
  .status.correct-status{background:var(--correct-bg);color:var(--correct);}
  .status.incorrect-status{background:var(--incorrect-bg);color:var(--incorrect);}
  .status.skipped-status{background:#eee2df;color:var(--muted);}
  .review-item .row{
    font-size:0.9rem;
    margin:2px 0;
  }
  .review-item .row.your-wrong{color:var(--incorrect);}
  .review-item .row.correct-ans{color:var(--correct);font-weight:600;}
  .flag-note{
    font-size:0.75rem;
    color:var(--flag);
    background:#fff3e0;
    border:1px dashed var(--flag);
    border-radius:8px;
    padding:6px 10px;
    margin-top:8px;
  }
  .flag-inline{
    color:var(--flag);
    font-size:0.75rem;
    font-weight:700;
    margin-left:6px;
  }
  #restartBtn{
    display:block;
    margin:20px auto 0 auto;
    width:100%;
    max-width:260px;
  }
  .toggle-review{
    display:block;
    margin:0 auto 16px auto;
    background:none;
    color:var(--maroon);
    text-decoration:underline;
    font-weight:600;
  }
  .hidden{display:none;}

  @media (max-width:480px){
    .card{padding:16px 14px;}
    .question-text{font-size:1.05rem;}
    header h1{font-size:1.2rem;}
    .nav-buttons{flex-wrap:wrap;}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>7th Tamil - Term 3 - Unit 2</h1>
    <p>Interactive Practice Quiz (100 Questions)</p>
  </header>

  <!-- QUIZ SCREEN -->
  <div id="quizScreen" class="card">
    <div class="progress-wrap">
      <span id="progressText">Question 1 of 100</span>
      <span id="scoreSoFar"></span>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progressBarFill" style="width:1%;"></div>
    </div>
    <div class="question-badge" id="questionBadge">Q1</div>
    <div class="question-text" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="nav-buttons">
      <button class="btn-secondary" id="prevBtn">&larr; Previous</button>
      <button class="btn-primary" id="nextBtn">Next &rarr;</button>
    </div>
  </div>

  <!-- RESULTS SCREEN -->
  <div id="resultsScreen" class="card hidden">
    <div class="score-circle" id="scoreCircle">
      <div class="score-text">
        <span class="big" id="scorePercentBig">0%</span>
        <span class="small">Score</span>
      </div>
    </div>
    <div class="summary-line">
      You scored <b id="scoreFraction">0/100</b> — <span id="scoreRemark"></span>
    </div>
    <button class="toggle-review" id="toggleReviewBtn">Show detailed review &#9660;</button>
    <div id="reviewList" class="hidden"></div>
    <button class="btn-primary" id="restartBtn">Restart Quiz</button>
  </div>
</div>

<script>
/* =========================================================================
   QUESTION DATA
   Extracted from the uploaded PDF "7th_T3_U2.pdf" (100 questions total).
   answer index: 0=A, 1=B, 2=C, 3=D
   flagged: true  -> The PDF did NOT mark a correct answer for this question.
            The answer shown was inferred from standard Tamil curriculum
            knowledge (this unit covers Poigai Azhwar, Bhoothathazhwar,
            Munaipadiyar and Tamil grammar). These should be verified
            against the textbook/teacher's key before relying on them,
            especially the Munaipadiyar agricultural-metaphor set
            (Q32-37) and a few Thirukkural specifics (Q41,42,46,47,53,90).
   ========================================================================= */
const QUESTIONS = [
{q:"'வையம்' என்னும் சொல்லின் பொருள் என்ன?",o:["கடல்","உலகம்","வானம்","நெருப்பு"],a:1},
{q:"'வெய்ய' என்னும் சொல்லின் பொருள் என்ன?",o:["குளிர்ச்சி வீசும்","வெப்பக்கதிர் வீசும்","இருள் சூழ்ந்த","ஒளி பொருந்திய"],a:1},
{q:"'சுடர் ஆழியான்' என்று அழைக்கப்படுபவர் யார்?",o:["சிவன்","திருமால்","பிரம்மா","முருகன்"],a:1},
{q:"'இடர் ஆழி' என்பதில் 'இடர்' என்பதன் பொருள் என்ன?",o:["மகிழ்ச்சி","ஆர்வம்","துன்பம்","இன்பம்"],a:2},
{q:"பொய்கையாழ்வார் பூமியை எவ்விதமாக உருவகப்படுத்துகிறார்?",o:["அகல்விளக்கு","நெய்","சுடர்","திரி"],a:0},
{q:"பொய்கையாழ்வார் ஒலிக்கின்ற கடலை எவ்வாறு உருவகப்படுத்துகிறார்?",o:["சுடர்","விளக்கு","நெய்","மாலை"],a:2},
{q:"பொய்கையாழ்வார் கதிரவனை எவ்வாறு உருவகப்படுத்துகிறார்?",o:["நெய்","சுடர்","கடல்","விளக்கு"],a:3},
{q:"பொய்கையாழ்வார் பிறந்த ஊர் எது?",o:["மாமல்லபுரம்","திருமுனைப்பாடி","திருவெஃகா","குன்றக்குடி"],a:2},
{q:"திருவெஃகா என்னும் ஊர் எந்த மாவட்டத்திற்கு அருகில் உள்ளது?",o:["காஞ்சிபுரம்","சென்னை","மதுரை","திருச்சி"],a:0},
{q:"நாலாயிரத் திவ்வியப் பிரபந்தத்தில் உள்ள முதல் திருவந்தாதியைப் பாடியவர் யார்?",o:["பேயாழ்வார்","பூதத்தாழ்வார்","பொய்கையாழ்வார்","நம்மாழ்வார்"],a:2},
{q:"'தகளி' என்னும் சொல்லின் பொருள் என்ன?",o:["எண்ணெய்","திரி","சுடர்","அகல்விளக்கு"],a:3},
{q:"'சிந்தை' என்னும் சொல்லின் பொருள் என்ன?",o:["அறிவு","மனம்","செயல்","சொல்"],a:1},
{q:"'ஞானம்' என்னும் சொல்லின் பொருள் என்ன?",o:["அறியாமை","அறிவு","செல்வம்","வறுமை"],a:1},
{q:"'நாரணன்' என்று அழைக்கப்படுபவர் யார்?",o:["பிரம்மா","திருமால்","சிவன்","இந்திரன்"],a:1},
{q:"பூதத்தாழ்வார் அன்பை எவ்விதமாக உருவகப்படுத்துகிறார்?",o:["நெய்","திரி","சுடர்","அகல்விளக்கு"],a:3},
{q:"பூதத்தாழ்வார் ஆர்வத்தை எவ்விதமாக உருவகப்படுத்துகிறார்?",o:["திரி","நெய்","அகல்விளக்கு","சுடர்"],a:1},
{q:"பூதத்தாழ்வார் சிந்தையை (மனம்) எவ்விதமாக உருவகப்படுத்துகிறார்?",o:["இடுகின்ற திரி","அகல்விளக்கு","நெய்","சுடர்"],a:0},
{q:"ஞானத்தமிழ் பயின்றவர் என்று தன்னைக் கூறிக் கொள்பவர் யார்?",o:["பொய்கையாழ்வார்","பூதத்தாழ்வார்","பேயாழ்வார்","திருமங்கையாழ்வார்"],a:1},
{q:"அந்தாதி என்பதில் 'அந்தம்' என்பதன் பொருள் என்ன?",o:["முதல்","இடை","முடிவு","தொடக்கம்"],a:2},
{q:"அந்தாதி என்பதில் 'ஆதி' என்பதன் பொருள் என்ன?",o:["முடிவு","இடை","முதல்","இறுதி"],a:2},
{q:"அந்தாதி என்பது எவ்வகை இலக்கியங்களில் ஒன்று?",o:["காப்பியம்","சிற்றிலக்கியம்","புதுக்கவிதை","புதினம்"],a:1},
{q:"பூதத்தாழ்வார் பிறந்த ஊர் எது?",o:["திருவெஃகா","திருமுனைப்பாடி","மாமல்லபுரம்","குன்றக்குடி"],a:2},
{q:"மாமல்லபுரம் எந்த நகரத்திற்கு அடுத்துள்ளது?",o:["காஞ்சிபுரம்","சென்னை","செங்கல்பட்டு","வேலூர்"],a:1},
{q:"நாலாயிரத் திவ்வியப் பிரபந்தத்தில் இரண்டாம் திருவந்தாதியைப் பாடியவர் யார்?",o:["பூதத்தாழ்வார்","பொய்கையாழ்வார்","பேயாழ்வார்","ஆண்டாள்"],a:0},
{q:"'ஞானச்சுடர்' என்னும் சொல்லைப் பிரித்து எழுதக் கிடைப்பது எது?",o:["ஞான + சுடர்","ஞானச் + சுடர்","ஞானம் + சுடர்","ஞானி + சுடர்"],a:2},
{q:"இன்பு + உருகு என்பதனைச் சேர்த்தெழுதக் கிடைக்கும் சொல் எது?",o:["இன்பு உருகு","இன்பும் உருகு","இன்பருகு","இன்புருகு"],a:3},
{q:"'வித்து' என்னும் சொல்லின் பொருள் என்ன?",o:["நிலம்","விதை","செடி","பயிர்"],a:1},
{q:"'ஈன' என்னும் சொல்லின் பொருள் என்ன?",o:["பெற","இழக்க","கொடுக்க","விதைக்க"],a:0},
{q:"'களை' என்னும் சொல்லின் பொருள் என்ன?",o:["பசுமையான பயிர்","வேண்டாத செடி","விளைநிலம்","எரு"],a:1},
{q:"'பைங்கூழ்' என்னும் சொல்லின் பொருள் என்ன?",o:["காய்ந்த புல்","வேண்டாத செடி","பசுமையான பயிர்","நல்ல விதை"],a:2},
{q:"'வன்சொல்' என்னும் சொல்லின் பொருள் என்ன?",o:["இன்சொல்","கடுஞ்சொல்","உண்மை","பொய்"],a:1},
{q:"முனைப்பாடியார் விளைநிலமாக எதனை உருவகப்படுத்துகிறார்?",o:["இன்சொல்","வன்சொல்","ஈகை","உண்மை"],a:2,flagged:true},

/* ================= APP STATE ================= */
const TOTAL = QUESTIONS.length;
let current = 0;
let userAnswers = new Array(TOTAL).fill(null); // stores selected option index or null

/* ================= DOM ELEMENTS ================= */
const quizScreen = document.getElementById('quizScreen');
const resultsScreen = document.getElementById('resultsScreen');
const progressText = document.getElementById('progressText');
const scoreSoFar = document.getElementById('scoreSoFar');
const progressBarFill = document.getElementById('progressBarFill');
const questionBadge = document.getElementById('questionBadge');
const questionText = document.getElementById('questionText');
const optionsContainer = document.getElementById('optionsContainer');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');

const letters = ['A','B','C','D'];

function renderQuestion(){
  const item = QUESTIONS[current];
  progressText.textContent = `Question ${current+1} of ${TOTAL}`;
  progressBarFill.style.width = ((current+1)/TOTAL*100) + '%';
  questionBadge.textContent = 'Q' + (current+1) + (item.flagged ? ' \u26A0' : '');
  questionText.textContent = item.q;

  let answeredCount = userAnswers.filter(a => a !== null).length;
  scoreSoFar.textContent = `Answered: ${answeredCount}/${TOTAL}`;

  optionsContainer.innerHTML = '';
  item.o.forEach((optText, idx) => {
    const div = document.createElement('div');
    div.className = 'option';
    if(userAnswers[current] === idx){
      div.classList.add('selected');
    }
    div.innerHTML = `<span class="letter">${letters[idx]}</span><span>${optText}</span>`;
    div.addEventListener('click', () => selectOption(idx));
    optionsContainer.appendChild(div);
  });

  prevBtn.disabled = (current === 0);
  nextBtn.textContent = (current === TOTAL-1) ? 'Finish \u2713' : 'Next \u2192';
}

function selectOption(idx){
  userAnswers[current] = idx;
  renderQuestion();
}

function goNext(){
  if(current < TOTAL - 1){
    current++;
    renderQuestion();
    window.scrollTo({top:0, behavior:'smooth'});
  } else {
    showResults();
  }
}

function goPrev(){
  if(current > 0){
    current--;
    renderQuestion();
    window.scrollTo({top:0, behavior:'smooth'});
  }
}

nextBtn.addEventListener('click', goNext);
prevBtn.addEventListener('click', goPrev);

/* ================= RESULTS ================= */
const scorePercentBig = document.getElementById('scorePercentBig');
const scoreFraction = document.getElementById('scoreFraction');
const scoreRemark = document.getElementById('scoreRemark');
const scoreCircle = document.getElementById('scoreCircle');
const reviewList = document.getElementById('reviewList');
const toggleReviewBtn = document.getElementById('toggleReviewBtn');
const restartBtn = document.getElementById('restartBtn');

function showResults(){
  quizScreen.classList.add('hidden');
  resultsScreen.classList.remove('hidden');

  let correctCount = 0;
  QUESTIONS.forEach((item, i) => {
    if(userAnswers[i] === item.a) correctCount++;
  });
  const pct = Math.round((correctCount/TOTAL)*100);

  scorePercentBig.textContent = pct + '%';
  scoreFraction.textContent = `${correctCount}/${TOTAL}`;
  scoreCircle.style.setProperty('--pct', pct);

  let remark = '';
  if(pct >= 90) remark = 'Excellent work! 🌟';
  else if(pct >= 75) remark = 'Great job! 👍';
  else if(pct >= 50) remark = 'Good effort — keep practicing.';
  else remark = 'Keep practicing, you will improve!';
  scoreRemark.textContent = remark;

  // Build review list
  reviewList.innerHTML = '';
  QUESTIONS.forEach((item, i) => {
    const userIdx = userAnswers[i];
    const isCorrect = userIdx === item.a;
    const isSkipped = userIdx === null;

    const div = document.createElement('div');
    div.className = 'review-item';

    let statusHtml = '';
    if(isSkipped){
      statusHtml = `<span class="status skipped-status">Not Answered</span>`;
    } else if(isCorrect){
      statusHtml = `<span class="status correct-status">Correct</span>`;
    } else {
      statusHtml = `<span class="status incorrect-status">Incorrect</span>`;
    }

    let flagHtml = item.flagged ? `<span class="flag-inline">\u26A0 Answer inferred</span>` : '';

    let rowsHtml = '';
    if(!isSkipped && !isCorrect){
      rowsHtml += `<div class="row your-wrong">Your answer: ${letters[userIdx]}. ${item.o[userIdx]}</div>`;
    }
    if(!isCorrect || isSkipped){
      rowsHtml += `<div class="row correct-ans">Correct answer: ${letters[item.a]}. ${item.o[item.a]}</div>`;
    } else {
      rowsHtml += `<div class="row correct-ans">Answer: ${letters[item.a]}. ${item.o[item.a]}</div>`;
    }

    let flagNote = item.flagged ? `<div class="flag-note">⚠️ This question's correct answer was not explicitly marked in the source PDF. The answer above was inferred based on standard Tamil curriculum knowledge — please verify with your textbook/teacher.</div>` : '';

    div.innerHTML = `
      <div class="rq">Q${i+1}. ${item.q} ${flagHtml}</div>
      ${statusHtml}
      ${rowsHtml}
      ${flagNote}
    `;
    reviewList.appendChild(div);
  });
}

toggleReviewBtn.addEventListener('click', () => {
  const isHidden = reviewList.classList.contains('hidden');
  reviewList.classList.toggle('hidden');
  toggleReviewBtn.innerHTML = isHidden ? 'Hide detailed review &#9650;' : 'Show detailed review &#9660;';
});

restartBtn.addEventListener('click', () => {
  current = 0;
  userAnswers = new Array(TOTAL).fill(null);
  resultsScreen.classList.add('hidden');
  quizScreen.classList.remove('hidden');
  reviewList.classList.add('hidden');
  toggleReviewBtn.innerHTML = 'Show detailed review &#9660;';
  renderQuestion();
  window.scrollTo({top:0, behavior:'smooth'});
});

/* ================= INIT ================= */
renderQuestion();
</script>
</body>
</html>

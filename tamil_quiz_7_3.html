<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>7ஆம் வகுப்பு தமிழ் - இயல் 3 - வினா விடைகள்</title>
<style>
  :root{
    --bg1:#0f2027;
    --bg2:#20639b;
    --card:#ffffff;
    --text:#222;
    --muted:#666;
    --correct:#0f9d58;
    --correct-bg:#e3f9ed;
    --wrong:#e63946;
    --wrong-bg:#fdeaec;
    --accent:#ff6b35;
    --accent-hover:#e2551f;
    --border:#e0e0e0;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family: 'Noto Sans Tamil', 'Segoe UI', Tahoma, Verdana, sans-serif;
    background: linear-gradient(135deg, var(--bg1), var(--bg2));
    min-height:100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:20px;
  }
  .app{
    width:100%;
    max-width:720px;
    margin-top:10px;
  }
  .header{
    text-align:center;
    color:#fff;
    margin-bottom:16px;
  }
  .header h1{
    font-size:1.4rem;
    margin:0 0 4px 0;
    font-weight:700;
  }
  .header p{
    margin:0;
    opacity:0.85;
    font-size:0.9rem;
  }
  .card{
    background:var(--card);
    border-radius:16px;
    box-shadow:0 10px 30px rgba(0,0,0,0.25);
    padding:24px;
    min-height:360px;
    display:flex;
    flex-direction:column;
  }
  .progress-wrap{
    margin-bottom:18px;
  }
  .progress-text{
    display:flex;
    justify-content:space-between;
    font-size:0.85rem;
    color:var(--muted);
    margin-bottom:6px;
  }
  .progress-bar-bg{
    width:100%;
    height:8px;
    background:#eee;
    border-radius:4px;
    overflow:hidden;
  }
  .progress-bar-fill{
    height:100%;
    background:linear-gradient(90deg, var(--bg1), var(--bg2));
    border-radius:4px;
    transition: width 0.3s ease;
  }
  .question-text{
    font-size:1.15rem;
    font-weight:600;
    color:var(--text);
    line-height:1.6;
    margin-bottom:20px;
    white-space:pre-wrap;
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:12px;
    flex:1;
  }
  .option{
    border:2px solid var(--border);
    border-radius:10px;
    padding:14px 16px;
    cursor:pointer;
    font-size:1rem;
    line-height:1.5;
    display:flex;
    align-items:flex-start;
    gap:10px;
    transition: all 0.15s ease;
    background:#fafafa;
  }
  .option:hover{
    border-color:var(--accent);
    background:#f0f4fb;
  }
  .option.selected{
    border-color:var(--accent);
    background:#e3ecfb;
  }
  .option .letter{
    font-weight:700;
    min-width:24px;
    color:var(--accent);
  }
  .option.show-correct{
    border-color:var(--correct);
    background:var(--correct-bg);
  }
  .option.show-correct .letter{
    color:var(--correct);
  }
  .option.show-wrong{
    border-color:var(--wrong);
    background:var(--wrong-bg);
  }
  .option.show-wrong .letter{
    color:var(--wrong);
  }
  .option.disabled{
    cursor:default;
  }
  .nav-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:22px;
    gap:10px;
  }
  button{
    font-family:inherit;
    font-size:0.95rem;
    font-weight:600;
    padding:12px 22px;
    border-radius:10px;
    border:none;
    cursor:pointer;
    transition: background 0.15s ease, opacity 0.15s ease;
  }
  .btn-primary{
    background: var(--accent);
    color:#fff;
  }
  .btn-primary:hover{ background: var(--accent-hover); }
  .btn-secondary{
    background:#eee;
    color:#333;
  }
  .btn-secondary:hover{ background:#ddd; }
  button:disabled{
    opacity:0.4;
    cursor:not-allowed;
  }
  .feedback-banner{
    margin-top:8px;
    padding:12px 16px;
    border-radius:10px;
    font-weight:700;
    font-size:0.95rem;
    line-height:1.5;
  }
  .feedback-correct{
    background:var(--correct-bg);
    color:var(--correct);
  }
  .feedback-wrong{
    background:var(--wrong-bg);
    color:var(--wrong);
  }
  .jump-hint{
    font-size:0.8rem;
    color:var(--muted);
    text-align:center;
    margin-top:10px;
  }
  /* Results screen */
  .results-summary{
    text-align:center;
    margin-bottom:20px;
  }
  .results-score{
    font-size:2.6rem;
    font-weight:800;
    color:var(--accent);
    margin:6px 0;
  }
  .results-percent{
    font-size:1.1rem;
    color:var(--muted);
    margin-bottom:14px;
  }
  .review-item{
    border:1px solid var(--border);
    border-radius:10px;
    padding:14px;
    margin-bottom:12px;
  }
  .review-item.correct{ border-left:5px solid var(--correct); }
  .review-item.incorrect{ border-left:5px solid var(--wrong); }
  .review-q{
    font-weight:600;
    margin-bottom:8px;
    line-height:1.5;
  }
  .review-line{
    font-size:0.92rem;
    margin:3px 0;
    line-height:1.5;
  }
  .review-line.your-correct{ color:var(--correct); }
  .review-line.your-wrong{ color:var(--wrong); }
  .review-line.answer{ color:var(--correct); }
  .review-line.unanswered{ color:var(--muted); font-style:italic; }
  .tag{
    display:inline-block;
    font-size:0.75rem;
    font-weight:700;
    padding:2px 10px;
    border-radius:20px;
    margin-bottom:8px;
  }
  .tag.correct{ background:var(--correct-bg); color:var(--correct); }
  .tag.incorrect{ background:var(--wrong-bg); color:var(--wrong); }
  #review-container{
    max-height:520px;
    overflow-y:auto;
    margin-top:10px;
    padding-right:4px;
  }
  .hidden{ display:none !important; }
  .footer-note{
    text-align:center;
    color:#fff;
    opacity:0.7;
    font-size:0.75rem;
    margin-top:16px;
  }
  @media (max-width:480px){
    .card{ padding:16px; border-radius:12px; }
    .question-text{ font-size:1.05rem; }
    .results-score{ font-size:2.1rem; }
    button{ padding:11px 16px; font-size:0.9rem; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>7ஆம் வகுப்பு - தமிழ் பருவம் 3 - இயல் 3</h1>
    <p>வினா விடைகள் - ஊடாடும் வினாடி வினா</p>
  </div>

  <div class="card" id="quiz-card">
    <div class="progress-wrap">
      <div class="progress-text">
        <span id="progress-label">வினா 1 / 100</span>
        <span id="score-live">மதிப்பெண்: 0</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progress-fill" style="width:1%;"></div>
      </div>
    </div>

    <div class="question-text" id="question-text"></div>
    <div class="options" id="options-container"></div>

    <div class="nav-row">
      <button class="btn-secondary" id="prev-btn">⟵ முந்தையது</button>
      <button class="btn-primary" id="next-btn">அடுத்தது ⟶</button>
    </div>
    <div class="jump-hint">ஒரு விடையைத் தேர்ந்தெடுத்தவுடன் அது சரியா தவறா எனத் தெரியும். பின் அடுத்த வினாவிற்குச் செல்லவும்.</div>
  </div>

  <div class="card hidden" id="results-card">
    <div class="results-summary">
      <div style="font-size:1.1rem;color:var(--muted);">உங்கள் முடிவு</div>
      <div class="results-score" id="final-score">0 / 100</div>
      <div class="results-percent" id="final-percent">0%</div>
      <button class="btn-primary" id="restart-btn">🔄 மீண்டும் தொடங்கு (Restart Quiz)</button>
    </div>
    <div id="review-container"></div>
  </div>

  <div class="footer-note">Vagai Sudar — 7th தமிழ் பருவம் 3 இயல் 3 வினா விடைகள் (100 வினாக்கள்)</div>
</div>

<script>
// ============ QUESTION DATA ============
// Extracted verbatim from the uploaded PDF. Every question has an explicit
// correct answer as marked in the source ("சரியான விடை"), so none required
// flagging as ambiguous/unmarked.
const QUESTIONS = [
{q:"'மலைப்பொழிவு' என்னும் பாடப்பகுதி எந்த நூலிலிருந்து எடுக்கப்பட்டுள்ளது?",o:["இயேசு காவியம்","தேம்பாவணி","சீறாப்புராணம்","ரட்சணிய யாத்திரிகம்"],c:0},
{q:"இயேசு காவியம் என்னும் நூலை எழுதியவர் யார்?",o:["உமறுப்புலவர்","வீரமாமுனிவர்","கண்ணதாசன்","எச்.ஏ. கிருட்டிணனார்"],c:2},
{q:"உலகம் எதனால் நிலைதடுமாறுகிறது என்று கண்ணதாசன் குறிப்பிடுகிறார்?",o:["வறுமையாலும் நோயாலும்","சாதிகளாலும் பேதங்களாலும்","மலையாலும் புயலாலும்","போர்களாலும் பஞ்சத்தாலும்"],c:1},
{q:"'பேதங்கள்' என்னும் சொல்லின் பொருள் என்ன?",o:["உயர்வு","அறம்","வேறுபாடுகள்","கருணை"],c:2},
{q:"'உன்னதம்' என்னும் சொல்லின் பொருள் என்ன?",o:["உயர்வு","அறம்","வேறுபாடுகள்","கருணை"],c:0},
{q:"'இரக்கம்' என்னும் சொல்லின் பொருள் என்ன?",o:["அறம்","கருணை","உயர்வு","வேறுபாடு"],c:1},
{q:"'தர்மம்' என்னும் சொல்லின் பொருள் என்ன?",o:["அறம்","கருணை","உயர்வு","வேறுபாடு"],c:0},
{q:"எந்த ஒன்றை நம்பிய பிறகு சண்டைகள் நீங்கி உலகம் அடங்கிவிடும் என்று இயேசுநாதர் கூறுகிறார்?",o:["அன்பு","அறம் (தர்மம்)","செல்வம்","கல்வி"],c:1},
{q:"பொருள் ஈட்டுவதிலும் எந்த வழியைப் பின்பற்ற வேண்டும் என்று 'மலைப்பொழிவு' பாடல் கூறுகிறது?",o:["குறுக்கு வழி","அறவழி","விரைவான வழி","பொருள்வழி"],c:1},
{q:"எவ்விதமான வாழ்வை இவ்வுலகம் பெற வேண்டும் என இயேசுநாதர் கூறுகிறார்?",o:["ஏற்றத்தாழ்வு இல்லா வாழ்வு","செல்வம் மிகுந்த வாழ்வு","துன்பம் நிறைந்த வாழ்வு","தனிமையான வாழ்வு"],c:0},
{q:"யாருக்கு இறைவனின் இரக்கம் பரிசாகக் கிடைக்கும் என்று இயேசுநாதர் கூறுகிறார்?",o:["செல்வம் உடையோருக்கு","கல்வி கற்றோருக்கு","இரக்கம் உடையோருக்கு (பிற உயிர்களின் மீது இரக்கம் காட்டுவோருக்கு)","வலிமை உடையோருக்கு"],c:2},
{q:"மனிதன் எதில் விழுந்துவிட்டால் அவனது வாழ்க்கை பாலைவனம் போல் பயனற்றதாகிவிடும்?",o:["நதியில்","ஆசையில்","சினத்தில்","அறியாமையில்"],c:1},
{q:"நல்ல உள்ளத்தோடு வாழ்ந்தால் மனிதனின் வாழ்க்கை எவ்வாறு மாறிவிடும்?",o:["பாலைவனம்","கடல்","மலர்ச்சோலை (சோலைவனம்)","வானம்"],c:2},
{q:"மனிதர்கள் எதனால் தாமும் துன்புற்றுப் பிறரையும் துன்புறுத்துகின்றனர்?",o:["அறியாமையால்","சண்டை சச்சரவுகளால்","வறுமையால்","நோயால்"],c:1},
{q:"மனிதர்கள் எத்தகைய பொய்யுறவுகளாக வாழ்கின்றனர் என்று கண்ணதாசன் குறிப்பிடுகிறார்?",o:["ஏழை என்றும் பணக்காரன் என்றும் பேசி","தன்னாடு என்றும் பிறர்நாடு என்றும் பேசி","உயர்ந்தவர் என்றும் தாழ்ந்தவர் என்றும் பேசி","தெரிந்தவர் என்றும் தெரியாதவர் என்றும் பேசி"],c:1},
{q:"எத்தனை போட்டிகளால் பயனற்ற கனவுகள்தாம் தோன்றுகின்றன என்று பாடல் கூறுகிறது?",o:["நூறு போட்டிகள்","ஆயிரம் போட்டிகள்","பத்தாயிரம் போட்டிகள்","பல போட்டிகள்"],c:1},
{q:"போட்டிகள் இல்லாமல் அமைதியாக வாழ்ந்தால் இதயம் எந்த அளவுக்கு உயர்ந்ததாக மாறும்?",o:["வானளவு","கடலளவு","மலையளவு","உலகளவு"],c:2},
{q:"கண்ணதாசனின் இயற்பெயர் என்ன?",o:["முத்தையா","மாணிக்கம்","சுப்புரத்தினம்","ராசகோபாலன்"],c:0},
{q:"கண்ணதாசன் எந்தச் சிறப்புப்பெயரால் அழைக்கப்படுகிறார்?",o:["கவிமணி","கவியரசு","கவிக்கோ","கவிப்பேரரசு"],c:1},
{q:"கண்ணதாசன் எந்த மாநிலத்தின் அரசவைக்கவிஞராக இருந்துள்ளார்?",o:["கேரளா","ஆந்திரா","கர்நாடகா","தமிழகம்"],c:3},
{q:"இயேசுவின் வாழ்க்கை வரலாற்றையும் அவரது அறிவுரைகளையும் கூறும் நூல் எது?",o:["திருவிவிலியம்","இயேசுகாவியம்","இரட்சணிய யாத்திரிகம்","தேம்பாவணி"],c:1},
{q:"'இமைக்கும் போதில்' என்னும் தொடர் குறிப்பிடுவது எக்காலத்தை?",o:["தூங்கும் காலம்","விழித்திருக்கும் காலம்","குறுகிய காலம்","நீண்ட காலம்"],c:2},
{q:"'மலையளவு' என்னும் சொல்லைப் பிரித்து எழுதக்கிடைப்பது எது?",o:["மலை + களவு","மலை + அளவு","மலையின் + அளவு","மலையில் + அளவு"],c:1},
{q:"'தன்னாடு' என்னும் சொல்லைப் பிரித்து எழுதக்கிடைப்பது எது?",o:["தன் + னாடு","தன்மை + னாடு","தன் + நாடு","தன்மை + நாடு"],c:2},

{q:"'Astronomy' என்ற ஆங்கிலச் சொல்லுக்கு இணையான தமிழ்ச் சொல் எது?",o:["கொள்கை","தத்துவம்","சமயம்","வானியல்"],c:3}

const OPTION_LETTERS = ['A','B','C','D'];
let current = 0;
let answers = new Array(QUESTIONS.length).fill(null); // stores selected index or null

const questionText = document.getElementById('question-text');
const optionsContainer = document.getElementById('options-container');
const progressLabel = document.getElementById('progress-label');
const scoreLive = document.getElementById('score-live');
const progressFill = document.getElementById('progress-fill');
const prevBtn = document.getElementById('prev-btn');
const nextBtn = document.getElementById('next-btn');
const quizCard = document.getElementById('quiz-card');
const resultsCard = document.getElementById('results-card');
const finalScore = document.getElementById('final-score');
const finalPercent = document.getElementById('final-percent');
const reviewContainer = document.getElementById('review-container');
const restartBtn = document.getElementById('restart-btn');

function liveScore(){
  let s = 0;
  answers.forEach((a,i)=>{ if(a !== null && a === QUESTIONS[i].c) s++; });
  return s;
}

function renderQuestion(){
  const item = QUESTIONS[current];
  const answered = answers[current] !== null;

  questionText.textContent = (current+1) + ". " + item.q;
  optionsContainer.innerHTML = '';

  item.o.forEach((optText, idx)=>{
    const div = document.createElement('div');
    div.className = 'option';

    if(answered){
      div.classList.add('disabled');
      if(idx === item.c){
        // always reveal the correct answer once the question is answered
        div.classList.add('show-correct');
      }
      if(idx === answers[current] && idx !== item.c){
        div.classList.add('show-wrong');
      }
    }

    div.innerHTML = '<span class="letter">' + OPTION_LETTERS[idx] + '.</span><span>' + optText + '</span>';
    if(!answered){
      div.addEventListener('click', ()=> selectOption(idx));
    }
    optionsContainer.appendChild(div);
  });

  // instant feedback banner
  let feedback = document.getElementById('feedback-banner');
  if(feedback) feedback.remove();
  if(answered){
    feedback = document.createElement('div');
    feedback.id = 'feedback-banner';
    const isCorrect = answers[current] === item.c;
    feedback.className = 'feedback-banner ' + (isCorrect ? 'feedback-correct' : 'feedback-wrong');
    feedback.textContent = isCorrect ? '✔ சரியான விடை!' : ('✘ தவறு. சரியான விடை: ' + OPTION_LETTERS[item.c] + '. ' + item.o[item.c]);
    optionsContainer.appendChild(feedback);
  }

  progressLabel.textContent = 'வினா ' + (current+1) + ' / ' + QUESTIONS.length;
  scoreLive.textContent = 'மதிப்பெண்: ' + liveScore();
  progressFill.style.width = (((current+1)/QUESTIONS.length)*100) + '%';

  prevBtn.disabled = current === 0;
  nextBtn.textContent = (current === QUESTIONS.length - 1) ? 'முடிவுகளைக் காட்டு ✔' : 'அடுத்தது ⟶';
}

function selectOption(idx){
  if(answers[current] !== null) return; // already answered, locked
  answers[current] = idx;
  renderQuestion();
}

prevBtn.addEventListener('click', ()=>{
  if(current > 0){ current--; renderQuestion(); }
});

nextBtn.addEventListener('click', ()=>{
  if(current < QUESTIONS.length - 1){
    current++;
    renderQuestion();
  } else {
    showResults();
  }
});

function showResults(){
  quizCard.classList.add('hidden');
  resultsCard.classList.remove('hidden');

  const score = liveScore();
  const total = QUESTIONS.length;
  const pct = Math.round((score/total)*100);

  finalScore.textContent = score + ' / ' + total;
  finalPercent.textContent = pct + '%' + (pct >= 50 ? ' — நன்று!' : ' — மேலும் பயிற்சி தேவை');

  reviewContainer.innerHTML = '';
  QUESTIONS.forEach((item, i)=>{
    const userAns = answers[i];
    const isCorrect = userAns === item.c;
    const wrap = document.createElement('div');
    wrap.className = 'review-item ' + (isCorrect ? 'correct' : 'incorrect');

    const tag = document.createElement('div');
    tag.className = 'tag ' + (isCorrect ? 'correct' : 'incorrect');
    tag.textContent = isCorrect ? 'சரி' : (userAns === null ? 'பதிலளிக்கவில்லை' : 'தவறு');
    wrap.appendChild(tag);

    const qDiv = document.createElement('div');
    qDiv.className = 'review-q';
    qDiv.textContent = (i+1) + '. ' + item.q;
    wrap.appendChild(qDiv);

    if(userAns !== null){
      const yourLine = document.createElement('div');
      yourLine.className = 'review-line ' + (isCorrect ? 'your-correct' : 'your-wrong');
      yourLine.textContent = 'உங்கள் விடை: ' + OPTION_LETTERS[userAns] + '. ' + item.o[userAns];
      wrap.appendChild(yourLine);
    } else {
      const noAns = document.createElement('div');
      noAns.className = 'review-line unanswered';
      noAns.textContent = 'நீங்கள் இந்த வினாவிற்குப் பதிலளிக்கவில்லை.';
      wrap.appendChild(noAns);
    }

    if(!isCorrect){
      const correctLine = document.createElement('div');
      correctLine.className = 'review-line answer';
      correctLine.textContent = 'சரியான விடை: ' + OPTION_LETTERS[item.c] + '. ' + item.o[item.c];
      wrap.appendChild(correctLine);
    }

    reviewContainer.appendChild(wrap);
  });
}

restartBtn.addEventListener('click', ()=>{
  current = 0;
  answers = new Array(QUESTIONS.length).fill(null);
  resultsCard.classList.add('hidden');
  quizCard.classList.remove('hidden');
  renderQuestion();
});

// init
renderQuestion();
</script>

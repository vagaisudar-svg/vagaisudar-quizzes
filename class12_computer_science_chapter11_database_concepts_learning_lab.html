<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>பாடம் 11 — தரவுத்தள கருத்துகள் (Database Concepts) | Computer Science Learning Lab</title>
<style>
  :root{
    --bg:#f6f1f7;
    --card:#ffffff;
    --primary:#8b2f97;
    --primary-dark:#5e1f68;
    --primary-light:#f3e5f7;
    --accent:#c0407e;
    --accent-light:#fdeaf3;
    --correct:#15803d;
    --correct-bg:#eafaf0;
    --incorrect:#c0392b;
    --incorrect-bg:#fdecec;
    --warn:#c2651b;
    --warn-bg:#fff3e6;
    --text:#241a2b;
    --muted:#6b5c72;
    --border:#e6d9ea;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Noto Sans Tamil','Latha','Nirmala UI','Segoe UI',Tahoma,sans-serif;
    background:var(--bg);
    color:var(--text);
    line-height:1.65;
  }
  h1,h2,h3,h4{line-height:1.45;}
  a{color:var(--primary);}
  button{font-family:inherit;}
  .app-shell{display:flex;flex-direction:column;min-height:100vh;}

  /* ---- Header ---- */
  header.top{
    background:linear-gradient(120deg,var(--primary-dark),var(--primary));
    color:#fff;
    padding:12px 16px;
    display:flex;
    align-items:center;
    gap:12px;
    position:sticky;top:0;z-index:40;
    box-shadow:0 2px 10px rgba(0,0,0,.15);
  }
  header.top .burger{
    background:rgba(255,255,255,.15);border:none;color:#fff;border-radius:8px;
    width:40px;height:40px;font-size:1.2rem;cursor:pointer;flex:0 0 auto;
    display:none;align-items:center;justify-content:center;
  }
  header.top .title-wrap{flex:1;min-width:0;}
  header.top h1{margin:0;font-size:1.05rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  header.top p{margin:0;font-size:.75rem;color:#f3dcee;}
  header.top .lang-toggle{
    display:flex;background:rgba(255,255,255,.15);border-radius:999px;padding:3px;flex:0 0 auto;
  }
  header.top .lang-toggle button{
    border:none;background:transparent;color:#fbeefa;padding:6px 12px;border-radius:999px;
    font-size:.8rem;font-weight:700;cursor:pointer;
  }
  header.top .lang-toggle button.active{background:#fff;color:var(--primary-dark);}

  .body-row{display:flex;flex:1;min-height:0;}

  /* ---- Sidebar ---- */
  nav.sidebar{
    width:280px;flex:0 0 auto;background:#fff;border-right:1px solid var(--border);
    padding:16px 10px 90px;overflow-y:auto;
  }
  nav.sidebar .progress-wrap{padding:6px 8px 16px;}
  nav.sidebar .progress-label{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted);margin-bottom:6px;}
  nav.sidebar .progress-bar{height:8px;background:var(--border);border-radius:999px;overflow:hidden;}
  nav.sidebar .progress-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));transition:width .3s;}
  .topic-btn{
    display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;
    background:transparent;border:none;border-radius:10px;padding:10px 10px;margin-bottom:4px;
    cursor:pointer;font-size:.92rem;color:var(--text);
  }
  .topic-btn:hover{background:var(--primary-light);}
  .topic-btn.active{background:var(--primary-light);color:var(--primary-dark);font-weight:700;}
  .topic-btn .num{flex:0 0 auto;font-size:.72rem;color:var(--muted);background:#eee3f0;border-radius:6px;padding:2px 6px;min-width:50px;text-align:center;}
  .topic-btn.active .num{background:var(--primary);color:#fff;}
  .topic-btn .chk{flex:0 0 auto;margin-left:auto;color:var(--correct);font-weight:800;}
  .sidebar-section-label{font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:14px 8px 6px;}

  .sidebar-backdrop{display:none;}

  /* ---- Main ---- */
  main.content{flex:1;min-width:0;padding:22px 20px 110px;overflow-y:auto;}
  .content-inner{max-width:920px;margin:0 auto;}
  .topic-header{margin-bottom:18px;}
  .topic-header .crumb{font-size:.8rem;color:var(--muted);margin-bottom:4px;}
  .topic-header h2{margin:0 0 6px;font-size:1.5rem;color:var(--primary-dark);}
  .topic-header .goals{background:var(--primary-light);border-radius:12px;padding:12px 16px;font-size:.92rem;}
  .topic-header .goals b{color:var(--primary-dark);}

  .card{
    background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    padding:18px 18px;margin-bottom:18px;box-shadow:0 2px 10px rgba(50,20,55,.05);
  }
  .card h3{margin-top:0;color:var(--primary-dark);font-size:1.12rem;}
  .card h4{color:var(--accent);font-size:1rem;margin-bottom:6px;}

  .tb-def{background:#f3eaff;border-left:5px solid #7c3aed;border-radius:10px;padding:12px 16px;margin:12px 0;}
  .tb-def .lbl{font-weight:800;color:#5b21b6;font-size:.82rem;margin-bottom:4px;display:block;}
  .easy{background:var(--primary-light);border-left:5px solid var(--primary);border-radius:10px;padding:12px 16px;margin:12px 0;}
  .easy .lbl{font-weight:800;color:var(--primary-dark);font-size:.82rem;margin-bottom:4px;display:block;}
  .analogy{background:#fff7ed;border-left:5px solid #ea580c;border-radius:10px;padding:12px 16px;margin:12px 0;}
  .analogy .lbl{font-weight:800;color:#c2410c;font-size:.82rem;margin-bottom:4px;display:block;}
  .example-box{background:var(--accent-light);border-left:5px solid var(--accent);border-radius:10px;padding:12px 16px;margin:12px 0;}
  .example-box .lbl{font-weight:800;color:#9d174d;font-size:.82rem;margin-bottom:4px;display:block;}
  .activity-box{background:#ecfeff;border-left:5px solid #0891b2;border-radius:10px;padding:12px 16px;margin:12px 0;}
  .activity-box .lbl{font-weight:800;color:#0e7490;font-size:.82rem;margin-bottom:4px;display:block;}
  .mistake-box{background:var(--warn-bg);border-left:5px solid var(--warn);border-radius:10px;padding:12px 16px;margin:12px 0;}
  .mistake-box .lbl{font-weight:800;color:var(--warn);font-size:.82rem;margin-bottom:4px;display:block;}
  .exam-point{background:#fdf2f8;border-left:5px solid #db2777;border-radius:10px;padding:12px 16px;margin:12px 0;}
  .exam-point .lbl{font-weight:800;color:#be185d;font-size:.82rem;margin-bottom:4px;display:block;}
  .tryit-box{background:#f0fdf4;border:2px dashed #16a34a;border-radius:10px;padding:14px 16px;margin:12px 0;}
  .tryit-box .lbl{font-weight:800;color:#15803d;font-size:.82rem;margin-bottom:4px;display:block;}
  .quickcheck{background:#f8fafc;border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin:12px 0;}
  .quickcheck .lbl{font-weight:800;color:var(--muted);font-size:.82rem;margin-bottom:4px;display:block;}

  table.tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.92rem;}
  table.tbl th, table.tbl td{border:1px solid var(--border);padding:8px 10px;text-align:left;}
  table.tbl th{background:var(--primary-light);color:var(--primary-dark);}
  table.tbl tr:nth-child(even) td{background:#fbf7fc;}
  .tbl-wrap{overflow-x:auto;}

  .eng{color:var(--muted);font-weight:600;}
  code, .mono{font-family:'JetBrains Mono',Consolas,Menlo,monospace;background:#f1e7f4;padding:1px 6px;border-radius:6px;font-size:.9em;}

  /* Diagrams */
  .diagram-box{background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px;margin:12px 0;overflow-x:auto;}
  .diagram-cap{text-align:center;font-size:.8rem;color:var(--muted);margin-top:8px;}
  .flow-row{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;}
  .flow-col{display:flex;flex-direction:column;align-items:center;gap:6px;}
  .flow-node{background:var(--primary-light);border:2px solid var(--primary);border-radius:10px;padding:10px 14px;font-size:.85rem;font-weight:700;text-align:center;color:var(--primary-dark);min-width:100px;}
  .flow-node.active{background:var(--primary);color:#fff;transform:scale(1.07);box-shadow:0 4px 14px rgba(139,47,151,.4);}
  .flow-node.muted{opacity:.45;}
  .flow-node.ellipse{border-radius:50%;background:#fff7ed;border-color:#ea580c;color:#9a3412;padding:14px 10px;min-width:70px;}
  .flow-node.diamond-wrap{background:none;border:none;padding:0;min-width:0;}
  .flow-node.leaf{background:#ecfdf5;border-color:#16a34a;color:#166534;}
  .diamond{width:90px;height:60px;background:#fff3e0;border:2px solid #ea580c;transform:rotate(45deg);display:flex;align-items:center;justify-content:center;margin:14px auto;}
  .diamond span{transform:rotate(-45deg);font-size:.78rem;font-weight:800;color:#9a3412;text-align:center;}
  .flow-arrow{font-size:1.3rem;color:var(--muted);}
  .flow-arrow.active{color:var(--accent);font-weight:900;}
  .flow-down{font-size:1.3rem;color:var(--muted);text-align:center;width:100%;}
  .map-tree{list-style:none;padding:0;margin:0;text-align:center;}
  .map-tree li{margin:4px 0;}

  /* Model gallery / relationship / algebra tabs */
  .tab-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
  .tab-btn{border:1.5px solid var(--border);background:#fff;border-radius:999px;padding:8px 16px;font-size:.85rem;font-weight:700;cursor:pointer;color:var(--text);}
  .tab-btn:hover{border-color:var(--primary);}
  .tab-btn.active{background:var(--primary);border-color:var(--primary);color:#fff;}

  /* Buttons */
  .btn{border:none;border-radius:10px;padding:10px 18px;font-weight:700;font-size:.9rem;cursor:pointer;transition:transform .1s,opacity .15s;}
  .btn:active{transform:scale(.96);}
  .btn-primary{background:var(--primary);color:#fff;}
  .btn-primary:hover{background:var(--primary-dark);}
  .btn-accent{background:var(--accent);color:#fff;}
  .btn-ghost{background:#f1e7f4;color:var(--text);}
  .btn-ghost:hover{background:#e5d4ea;}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;}

  select, input[type=text]{
    font-family:inherit;border:1.5px solid var(--border);border-radius:8px;padding:8px 10px;font-size:.92rem;
  }

  /* MCQ option styling (shared) */
  .q-block{border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:14px;background:#fff;}
  .q-block .q-meta{font-size:.72rem;font-weight:800;color:#fff;background:var(--muted);display:inline-block;padding:2px 10px;border-radius:999px;margin-bottom:8px;}
  .q-block .q-meta.tier-green{background:#16a34a;}
  .q-block .q-meta.tier-yellow{background:#d97706;}
  .q-block .q-meta.tier-red{background:#dc2626;}
  .q-text{font-weight:700;margin-bottom:10px;}
  .opt{display:flex;align-items:center;gap:10px;border:1.5px solid var(--border);border-radius:9px;padding:9px 12px;margin-bottom:7px;cursor:pointer;font-size:.9rem;background:#fbfafc;}
  .opt:hover{border-color:var(--primary);background:var(--primary-light);}
  .opt.correct{border-color:var(--correct);background:var(--correct-bg);}
  .opt.incorrect{border-color:var(--incorrect);background:var(--incorrect-bg);}
  .opt .letter{width:24px;height:24px;border-radius:50%;background:#efe4f1;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.78rem;flex:0 0 auto;}
  .opt.correct .letter{background:var(--correct);color:#fff;}
  .opt.incorrect .letter{background:var(--incorrect);color:#fff;}
  .feedback-line{font-size:.85rem;font-weight:700;margin-top:6px;min-height:1.2em;}
  .feedback-line.ok{color:var(--correct);}
  .feedback-line.bad{color:var(--incorrect);}
  .explain-box{display:none;background:#f8fafc;border-radius:8px;padding:10px 12px;margin-top:8px;font-size:.85rem;}
  .explain-box.show{display:block;}
  .hint-btn{background:#fff7ed;border:1px dashed #ea580c;color:#9a3412;border-radius:8px;padding:5px 12px;font-size:.78rem;font-weight:700;cursor:pointer;margin-bottom:8px;}
  .hint-text{display:none;font-size:.82rem;color:#9a3412;background:#fff7ed;border-radius:8px;padding:8px 10px;margin-bottom:8px;}
  .hint-text.show{display:block;}

  details.acc{border:1px solid var(--border);border-radius:10px;margin-bottom:10px;overflow:hidden;}
  details.acc summary{padding:12px 14px;cursor:pointer;font-weight:700;background:#fafbfc;}
  details.acc[open] summary{background:var(--primary-light);color:var(--primary-dark);}
  details.acc .acc-body{padding:12px 16px;}

  .fib-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px;font-size:.92rem;}
  .fib-row input{width:200px;}

  /* Debugging / misconception cards */
  .misc-card{border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:12px;}
  .misc-wrong{background:var(--incorrect-bg);border-radius:8px;padding:10px 12px;margin-bottom:8px;font-size:.9rem;}
  .misc-right{display:none;background:var(--correct-bg);border-radius:8px;padding:10px 12px;font-size:.9rem;}
  .misc-right.show{display:block;}

  /* Database structure simulator */
  .db-table-wrap{overflow-x:auto;}
  table.db-sim{border-collapse:collapse;width:100%;margin:10px 0;}
  table.db-sim th, table.db-sim td{border:2px solid var(--border);padding:10px 12px;font-size:.9rem;text-align:left;cursor:pointer;transition:background .15s;}
  table.db-sim th{background:#eee0f2;color:var(--primary-dark);font-weight:800;}
  table.db-sim th.col-hl, table.db-sim td.col-hl{background:#c7f9e7 !important;}
  table.db-sim tr.row-hl td{background:#ffe8b8 !important;}
  table.db-sim.relation-hl{outline:3px solid var(--accent);outline-offset:4px;}
  .sim-caption{font-size:.85rem;color:var(--muted);margin-top:6px;}

  /* Predict game */
  .predict-opt{border:1.5px solid var(--border);border-radius:10px;padding:10px;cursor:pointer;background:#fbfafc;}
  .predict-opt:hover{border-color:var(--primary);}
  .predict-opt.correct{border-color:var(--correct);background:var(--correct-bg);}
  .predict-opt.incorrect{border-color:var(--incorrect);background:var(--incorrect-bg);}
  .predict-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px;}
  table.mini{border-collapse:collapse;width:100%;font-size:.78rem;}
  table.mini th, table.mini td{border:1px solid var(--border);padding:4px 6px;}
  table.mini th{background:var(--primary-light);}

  /* Log panel (step-by-step execution trace) */
  .log-panel{background:#241129;color:#f3e4f7;border-radius:10px;padding:12px 14px;font-family:monospace;font-size:.82rem;max-height:260px;overflow-y:auto;margin-top:10px;}
  .log-panel .ln{margin-bottom:6px;padding-bottom:6px;border-bottom:1px dashed #5c3763;}
  .log-panel .ln:last-child{border-bottom:none;}
  .log-panel .ln .step-no{color:#f0abfc;font-weight:700;}
  .log-panel .ln.keep{color:#86efac;}
  .log-panel .ln.drop{color:#fca5a5;}
  .log-empty{color:#9ca3af;font-style:italic;}

  .chip-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
  .chip{background:var(--primary-light);color:var(--primary-dark);border:none;border-radius:999px;padding:6px 14px;font-size:.8rem;font-weight:700;cursor:pointer;}
  .chip:hover{background:var(--primary);color:#fff;}

  /* Bottom bar */
  .bottom-bar{
    position:sticky;bottom:0;background:#fff;border-top:1px solid var(--border);
    display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;z-index:30;
  }
  .bottom-bar .mark-btn{background:var(--correct-bg);color:var(--correct);}
  .bottom-bar .mark-btn.done{background:var(--correct);color:#fff;}

  footer.note{text-align:center;font-size:.72rem;color:#9aa6b2;padding:10px;background:#fff;border-top:1px solid var(--border);}

  @media (max-width:860px){
    nav.sidebar{
      position:fixed;top:0;left:0;bottom:0;z-index:60;transform:translateX(-100%);
      transition:transform .22s ease;box-shadow:4px 0 24px rgba(0,0,0,.25);
    }
    nav.sidebar.open{transform:translateX(0);}
    header.top .burger{display:flex;}
    .sidebar-backdrop.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;}
    main.content{padding:16px 12px 100px;}
    .topic-header h2{font-size:1.25rem;}
    .predict-grid{grid-template-columns:1fr;}
  }
  @media (max-width:480px){
    header.top h1{font-size:.92rem;}
    .flow-node{min-width:80px;font-size:.78rem;padding:8px 10px;}
  }
</style>
</head>
<body>
<div class="app-shell">
  <header class="top">
    <button class="burger" id="burgerBtn" aria-label="பட்டி">☰</button>
    <div class="title-wrap">
      <h1>Computer Science Learning Lab · Class 12 · Tamil Nadu State Board</h1>
      <p>பாடம் 11 — தரவுத்தள கருத்துகள் (Database Concepts)</p>
    </div>
    <div class="lang-toggle" role="group" aria-label="Interface language">
      <button id="langTa" class="active" data-lang="ta">தமிழ்</button>
      <button id="langEn" data-lang="en">English</button>
    </div>
  </header>

  <div class="body-row">
    <div class="sidebar-backdrop" id="backdrop"></div>
    <nav class="sidebar" id="sidebar" aria-label="பாட பட்டியல்">
      <div class="progress-wrap">
        <div class="progress-label"><span>முன்னேற்றம் / Progress</span><span id="progPct">0%</span></div>
        <div class="progress-bar"><div class="progress-fill" id="progFill" style="width:0%"></div></div>
      </div>
      <div class="sidebar-section-label">தலைப்புகள் (Topics)</div>
      <div id="topicList"></div>
    </nav>

    <main class="content">
      <div class="content-inner" id="mainContent"></div>
    </main>
  </div>

  <div class="bottom-bar">
    <button class="btn btn-ghost" id="prevTopicBtn">⬅ முந்தையது</button>
    <button class="btn mark-btn" id="markCompleteBtn">✔ Mark Complete</button>
    <button class="btn btn-primary" id="nextTopicBtn">அடுத்தது ➡</button>
  </div>
  <footer class="note">Vagai Sudar · Class 12 Computer Science · Chapter 11: Database Concepts · தமிழக அரசு பாடநூல் அடிப்படையில் · ஆஃப்லைன் கற்றல் கூடம்</footer>
</div>

<script>
/* =========================================================================
   STORAGE (safe wrapper)
   ========================================================================= */
const STORE_KEY = 'cs12_dbconcepts_lab_v1';
function loadState(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){ /* storage unavailable - continue with defaults */ }
  return { completed:[], lang:'ta', quiz:{} };
}
function saveState(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){ /* ignore */ }
}
let state = loadState();

/* =========================================================================
   TOPIC DATA
   ========================================================================= */
const TOPICS = [
  {id:'intro',         num:'Intro',    title:'அறிமுகம் & கருத்து வரைபடம்'},
  {id:'foundation',    num:'11.1-11.3',title:'தரவு, தகவல் & தரவுத்தளம்'},
  {id:'dbms',          num:'11.4',     title:'DBMS & RDBMS'},
  {id:'components',    num:'11.4.4',   title:'DBMS கூறுகள்'},
  {id:'structure',     num:'11.5',     title:'தரவுத்தள அமைப்பு'},
  {id:'models',        num:'11.6',     title:'தரவு மாதிரிகள் (Data Models)'},
  {id:'users',         num:'11.6.2',   title:'DBMS பயனர் வகைகள்'},
  {id:'compare',       num:'11.7',     title:'DBMS vs RDBMS'},
  {id:'relationships', num:'11.8',     title:'உறவுமுறை வகைகள்'},
  {id:'algebra',       num:'11.9',     title:'Relational Algebra'},
  {id:'practice',      num:'Practice', title:'பயிற்சி & Debugging Lab'},
  {id:'examprep',      num:'Exam',     title:'தேர்வு தயாரிப்பு'},
];
let currentIdx = 0;

/* =========================================================================
   SIDEBAR / NAV RENDERING
   ========================================================================= */
function renderSidebar(){
  const wrap = document.getElementById('topicList');
  wrap.innerHTML = '';
  TOPICS.forEach((t, i) => {
    const btn = document.createElement('button');
    btn.className = 'topic-btn' + (i === currentIdx ? ' active' : '');
    const done = state.completed.includes(t.id);
    btn.innerHTML = '<span class="num">'+t.num+'</span><span>'+t.title+'</span>' + (done ? '<span class="chk">✔</span>' : '');
    btn.addEventListener('click', () => { goTo(i); closeSidebarMobile(); });
    wrap.appendChild(btn);
  });
  const pct = Math.round((state.completed.length / TOPICS.length) * 100);
  document.getElementById('progPct').textContent = pct + '%';
  document.getElementById('progFill').style.width = pct + '%';
}

function goTo(i){
  currentIdx = Math.max(0, Math.min(TOPICS.length - 1, i));
  renderMain();
  renderSidebar();
  updateBottomBar();
  window.scrollTo({top:0, behavior:'smooth'});
  document.querySelector('main.content').scrollTo({top:0, behavior:'smooth'});
}
function goToTopicId(id){
  const i = TOPICS.findIndex(t => t.id === id);
  if(i >= 0) goTo(i);
}

function updateBottomBar(){
  document.getElementById('prevTopicBtn').disabled = currentIdx === 0;
  document.getElementById('nextTopicBtn').disabled = currentIdx === TOPICS.length - 1;
  const markBtn = document.getElementById('markCompleteBtn');
  const done = state.completed.includes(TOPICS[currentIdx].id);
  markBtn.classList.toggle('done', done);
  markBtn.textContent = done ? '✔ முடிந்தது (Completed)' : '✔ Mark Complete';
}

document.getElementById('prevTopicBtn').addEventListener('click', () => goTo(currentIdx - 1));
document.getElementById('nextTopicBtn').addEventListener('click', () => goTo(currentIdx + 1));
document.getElementById('markCompleteBtn').addEventListener('click', () => {
  const id = TOPICS[currentIdx].id;
  const idx = state.completed.indexOf(id);
  if(idx === -1) state.completed.push(id); else state.completed.splice(idx,1);
  saveState();
  renderSidebar();
  updateBottomBar();
});

/* mobile sidebar */
const sidebar = document.getElementById('sidebar');
const backdrop = document.getElementById('backdrop');

  sidebar.classList.toggle('open');

});
backdrop.addEventListener('click', closeSidebarMobile);

/* language toggle (UI chrome only; lesson text follows textbook Tamil with English technical terms inline, since DB terms such as DBMS, RDBMS, SELECT, PROJECT, relation, tuple, attribute always stay in English) */
document.getElementById('langTa').addEventListener('click', () => setLang('ta'));
document.getElementById('langEn').addEventListener('click', () => setLang('en'));
function setLang(l){
  state.lang = l; saveState();
  document.getElementById('langTa').classList.toggle('active', l==='ta');
  document.getElementById('langEn').classList.toggle('active', l==='en');
  document.body.setAttribute('data-lang', l);
}

function buildTable(rows, cols, rowClassFn){
  let h = '<div class="tbl-wrap"><table class="tbl mini"><tr>' + cols.map(c=>'<th>'+COL_LABEL[c]+'</th>').join('') + '</tr>';
  rows.forEach((r,i) => {
    const cls = rowClassFn ? rowClassFn(r,i) : '';
    h += '<tr class="'+cls+'">' + cols.map(c=>'<td>'+r[c]+'</td>').join('') + '</tr>';
  });
  h += '</table></div>';
  return h;
}

function renderDbms(){
  return `

    <div class="crumb">பாடம் 11 › 11.4</div>
    <h2>DBMS &amp; RDBMS</h2>

  </div>

    <h3>11.4 DataBase Management System (DBMS)</h3>
    <div class="tb-def">
      <span class="lbl">📘 பாடநூல் வரையறை</span>
      A DBMS is a software that allows us to create, define and manipulate database, allowing users to store, process and analyze data easily. DBMS provides us with an interface or a tool, to perform various operations to create a database, storing of data and for updating data, etc. DBMS also provides protection and security to the databases. It also maintains data consistency in case of multiple users.<br>
      <b>Examples of DBMS softwares:</b> Foxpro, dbase.
    </div>
    <div class="analogy">
      <span class="lbl">🔗 எளிய ஒப்புமை (Easy Explanation)</span>
      DBMS என்பது ஒரு தரவுத்தளத்துடன் பேசுவதற்கான "இடைமுகம்" (interface) போன்றது — நீங்கள் நேரடியாக கோப்பில் (file) தரவை எழுதவோ, தேடவோ தேவையில்லை; DBMS அதைப் பாதுகாப்பாகவும் முறையாகவும் செய்து தரும்.
    </div>

    <h4>11.4.1 Relational Database Management System (RDBMS)</h4>
    <div class="tb-def">
      <span class="lbl">📘 பாடநூல் வரையறை</span>
      RDBMS is more advanced version of DBMS, that allows to data in a more efficient way. It is used to store and manupulate the data that are in the form of tables.<br>
      <b>Example of RDBMS:</b> MySQL, Oracle, MS-Access etc.
    </div>
    <div class="mistake-box">
      <span class="lbl">⚠️ பொதுவான தவறு (Common Misconception)</span>
      DBMS, RDBMS இரண்டும் ஒன்றே என நினைப்பது தவறு. DBMS ஒரு பொதுவான தரவுத்தள மென்பொருள் (எ.கா. FoxPro, dbase); RDBMS அதைவிட மேம்பட்டது — தரவை அட்டவணைகளாக (tables) சேமிக்கிறது, Normalization மூலம் redundancy-ஐ குறைக்கிறது, Keys பயன்படுத்துகிறது (எ.கா. MySQL, Oracle, MS-Access).
    </div>

    <div class="tbl-wrap">

      <tr><th>பண்பு (Characteristic)</th><th>விளக்கம் (பாடநூல்)</th></tr>

      <tr><td><b>2. Reduced Redundancy</b></td><td>Hard drives were once expensive, so repetition of data was a big problem. RDBMS follows Normalisation which divides the data so that repetition is minimum.</td></tr>
      <tr><td><b>3. Data Consistency</b></td><td>On live data, continuously updated and added — maintaining consistency can be a challenge, but RDBMS handles it by itself.</td></tr>
      <tr><td><b>4. Support Multiple user &amp; Concurrent Access</b></td><td>RDBMS allows multiple users to work on it (update, insert, delete) at the same time and still maintains data consistency.</td></tr>
      <tr><td><b>5. Query Language</b></td><td>RDBMS provides users with a simple query language, using which data can be easily fetched, inserted, deleted and updated.</td></tr>
      <tr><td><b>6. Security</b></td><td>RDBMS takes care of security, protecting data from unauthorized access, using user accounts with different access permissions.</td></tr>
      <tr><td><b>7. DBMS Supports Transactions</b></td><td>It allows us to better handle and manage data integrity in real world applications where multi-threading is extensively used.</td></tr>

function algSteps(){
  const steps = [];
  if(algState.op === 'select'){
    const cond = algState.cond;
    STUDENT.forEach(r => {
      const keep = r.course === cond;
      steps.push({cls: keep?'keep':'drop', text: 'Row '+r.no+' ('+r.name+', course="'+r.course+'") — condition course="'+cond+'" → '+(keep?'TRUE ✓ → வைத்துக்கொள்ளப்படுகிறது':'FALSE ✗ → நீக்கப்படுகிறது')});
    });
    steps.push({final:true, result: STUDENT.filter(r=>r.course===cond), cols:['no','name','course','year'], note:'σ<sub>course</sub> = "'+cond+'" (STUDENT)'});
  } else if(algState.op === 'project'){
    const cols = algState.projCols.length ? algState.projCols : ['course'];
    steps.push({cls:'keep', text:'தேர்ந்தெடுக்கப்பட்ட columns: '+cols.map(c=>COL_LABEL[c]).join(', ')+' — மற்ற columns நீக்கப்படுகின்றன (vertical subset)'});
    let rows = STUDENT.map(r => { const o={}; cols.forEach(c=>o[c]=r[c]); return o; });
    const before = rows.length;
    const seen = new Set(); const dedup = [];
    rows.forEach(r => { const key = JSON.stringify(r); if(!seen.has(key)){ seen.add(key); dedup.push(r); } });
    if(dedup.length < before) steps.push({cls:'drop', text:'நகல் வரிசைகள் (duplicate rows) கண்டறியப்பட்டு நீக்கப்படுகின்றன — duplicate row is removed in the result (textbook note)'});
    else steps.push({cls:'keep', text:'இந்தத் தேர்வில் நகல் வரிசைகள் (duplicates) எதுவும் இல்லை'});
    steps.push({final:true, result:dedup, cols:cols, note:'∏<sub>'+cols.map(c=>COL_LABEL[c].toLowerCase()).join(', ')+'</sub>(STUDENT)'});
  } else if(algState.op === 'union'){
    const seen = new Set(); const out = [];
    TABLE_A.forEach(r=>{ const k=r.no; steps.push({cls:'keep', text:'Table A row '+r.no+' ('+r.name+') → result-இல் சேர்க்கப்படுகிறது'}); if(!seen.has(k)){seen.add(k); out.push(r);} });
    TABLE_B.forEach(r=>{ const k=r.no; const dup = seen.has(k); steps.push({cls: dup?'drop':'keep', text:'Table B row '+r.no+' ('+r.name+') → '+(dup?'ஏற்கனவே உள்ளது (duplicate) → நீக்கப்படுகிறது':'புதியது → result-இல் சேர்க்கப்படுகிறது')}); if(!dup){seen.add(k); out.push({no:r.no,name:r.no==='cs2'?'GowriShankar':r.name});} });
    out.sort((a,b)=>a.no.localeCompare(b.no));
    steps.push({final:true, result:out, cols:['no','name'], note:'Table A ∪ Table B (duplicates removed)'});
  } else if(algState.op === 'intersect'){
    const bSet = new Set(TABLE_B.map(r=>r.no));
    const out = [];
    TABLE_A.forEach(r=>{ const inB = bSet.has(r.no); steps.push({cls: inB?'keep':'drop', text:'Table A row '+r.no+' ('+r.name+') — Table B-இலும் உள்ளதா? '+(inB?'ஆம் (TRUE) → result-இல் சேர்க்கப்படுகிறது':'இல்லை (FALSE) → நீக்கப்படுகிறது')}); if(inB) out.push(r); });
    steps.push({final:true, result:out, cols:['no','name'], note:'A ∩ B'});
  } else if(algState.op === 'diff'){
    const bSet = new Set(TABLE_B.map(r=>r.no));
    const out = [];
    TABLE_A.forEach(r=>{ const inB = bSet.has(r.no); steps.push({cls: inB?'drop':'keep', text:'Table A row '+r.no+' ('+r.name+') — Table B-இல் உள்ளதா? '+(inB?'ஆம் → A−B இலிருந்து நீக்கப்படுகிறது':'இல்லை → A−B இல் வைத்துக்கொள்ளப்படுகிறது')}); if(!inB) out.push(r); });
    steps.push({final:true, result:out, cols:['no','name'], note:'Table A − Table B'});
  } else if(algState.op === 'cart'){
    const out = [];
    CART_A.forEach((a,i) => {
      CART_B.forEach((b,j) => {
        steps.push({cls:'keep', text:'Outer i='+(i+1)+'/3 ('+a.no+' '+a.name+')  ×  Inner j='+(j+1)+'/3 ('+b.code+' '+b.subject+')  →  combined row added'});
        out.push({no:a.no, name:a.name, code:b.code, subject:b.subject});
      });
    });
    steps.push({final:true, result:out, cols:['no','name','code','subject'], note:'Table A X Table B  (3 × 3 = 9 tuples, nested-loop style)'});
  }
  return steps;
}

function wireAlgStage(){
  const tabs = document.querySelectorAll('#algTabs .tab-btn');
  tabs.forEach(b => b.addEventListener('click', function(){
    tabs.forEach(x=>x.classList.remove('active'));
    this.classList.add('active');
    algState.op = this.dataset.alg;
    algState.step = 0; algState.log = []; algState.result = null;
    renderAlgStage();
  }));
  const condSel = document.getElementById('selCondInput');
  if(condSel){ condSel.value = algState.cond; condSel.addEventListener('change', function(){ algState.cond = this.value; algState.step=0; algState.log=[]; algState.result=null; algRefreshLogAndResult(); }); }
  document.querySelectorAll('.projChk').forEach(chk => {
    chk.checked = algState.projCols.includes(chk.value);
    chk.addEventListener('change', function(){
      const vals = Array.from(document.querySelectorAll('.projChk:checked')).map(c=>c.value);
      algState.projCols = vals.length ? vals : ['course'];
      algState.step=0; algState.log=[]; algState.result=null; algRefreshLogAndResult();
    });
  });
  const stepBtn = document.getElementById('algStepBtn');
  const resetBtn = document.getElementById('algResetBtn');
  if(stepBtn) stepBtn.addEventListener('click', algNextStep);
  if(resetBtn) resetBtn.addEventListener('click', () => { algState.step=0; algState.log=[]; algState.result=null; algRefreshLogAndResult(); });
}
function algRefreshLogAndResult(){
  const logEl = document.getElementById('algLog');
  const resEl = document.getElementById('algResultWrap');
  if(logEl) logEl.innerHTML = '<div class="log-empty">"▶ அடுத்த படி" பொத்தானை அழுத்தி படிப்படியாகப் பாருங்கள் (Run Step-by-Step)...</div>';
  if(resEl) resEl.innerHTML = '';
}
function algNextStep(){
  const steps = algSteps();
  if(algState.step >= steps.length) return;
  const s = steps[algState.step];
  const logEl = document.getElementById('algLog');
  if(logEl.querySelector('.log-empty')) logEl.innerHTML = '';
  if(s.final){
    algState.result = s;
    const resEl = document.getElementById('algResultWrap');
    resEl.innerHTML = '<div class="tryit-box"><span class="lbl">✅ Result — '+s.note+'</span>'+buildTable(s.result, s.cols)+
      (s.result.length===0 ? '<p>(result empty — ஒரு tuple கூட condition-ஐ பூர்த்தி செய்யவில்லை)</p>' : '')+
      '<p><b>என்ன நடந்தது?</b> மேலே உள்ள log panel-இல் ஒவ்வொரு row-உம் எப்படி சோதிக்கப்பட்டது (step-by-step) எனப் பாருங்கள்.</p></div>';
  } else {
    const ln = document.createElement('div');
    ln.className = 'ln ' + (s.cls||'');
    ln.innerHTML = '<span class="step-no">Step '+(algState.step+1)+':</span> '+s.text;
    logEl.appendChild(ln);
    logEl.scrollTop = logEl.scrollHeight;
  }
  algState.step++;
}

  'c3': {q:'🔴 PROJECT (∏) செயல்பாட்டிற்குப் பிறகு, SELECT (σ) செயல்பாட்டை ஏன் முதலில் செய்யக் கூடாது என ஒரு காரணம் சொல்லுங்கள் — STUDENT அட்டவணையில் ∏<sub>course</sub>(STUDENT) செய்த பின் course="Big Data" என SELECT செய்தால் என்ன நடக்கும்?', o:['studno, name, year columns ஏற்கனவே நீக்கப்பட்டுவிட்டதால், அந்த விவரங்களுடன் கூடிய முடிவு கிடைக்காது','எந்த மாற்றமும் இல்லை','Error ஏற்படும்','Duplicate rows தானாகவே சேர்க்கப்படும்'], c:0, exp:'PROJECT ஏற்கனவே columns-ஐ நீக்கிவிட்டால் (vertical subset), பிறகு செய்யப்படும் SELECT-க்கு அந்த columns கிடைக்காது — எனவே பொதுவாக முதலில் SELECT (rows வடிகட்ட), பிறகு PROJECT (columns தேர்ந்தெடுக்க) செய்வது வழக்கமான வரிசை.'},
};

/* =========================================================================
   QUICK-CHECK MCQ HELPER (generic renderer + event wiring)
   ========================================================================= */
function mcqHTML(qid, qObj, tierClass, tierLabel){
  const letters = ['அ','ஆ','இ','ஈ','உ'];
  let optsHtml = qObj.o.map((opt,i) =>
    `<div class="opt" data-qid="${qid}" data-idx="${i}"><span class="letter">${letters[i]}</span><span>${opt}</span></div>`
  ).join('');
  return `
  <div class="q-block" id="block-${qid}">
    ${tierLabel ? `<span class="q-meta ${tierClass}">${tierLabel}</span>` : ''}
    <div class="q-text">${qObj.q}</div>
    ${qObj.hint ? `<button class="hint-btn" id="hintbtn-${qid}">💡 Hint</button><div class="hint-text" id="hint-${qid}">${qObj.hint}</div>` : ''}
    <div class="opts-wrap">${optsHtml}</div>
    <div class="feedback-line" id="fb-${qid}"></div>
    ${qObj.exp ? `<div class="explain-box" id="exp-${qid}">💡 ${qObj.exp}</div>` : ''}
  </div>`;
}
function wireMCQ(containerSel, dataMap){
  document.querySelectorAll(containerSel + ' .hint-btn').forEach(btn => {
    btn.addEventListener('click', function(){
      const qid = this.id.replace('hintbtn-','');
      document.getElementById('hint-'+qid).classList.toggle('show');
    });
  });
  document.querySelectorAll(containerSel + ' .opt').forEach(opt => {
    opt.addEventListener('click', function(){
      const qid = this.dataset.qid;
      const idx = parseInt(this.dataset.idx,10);
      const block = document.getElementById('block-'+qid);
      if(block.dataset.answered) return;
      block.dataset.answered = '1';
      const qObj = dataMap[qid];
      const opts = block.querySelectorAll('.opt');
      opts.forEach((o,i) => {
        if(i === qObj.c) o.classList.add('correct');
        if(i === idx && idx !== qObj.c) o.classList.add('incorrect');
      });
      const fb = document.getElementById('fb-'+qid);
      if(idx === qObj.c){ fb.textContent = '✅ சரியான விடை!'; fb.className='feedback-line ok'; }
      else { fb.textContent = '❌ தவறான விடை. சரியான விடை: ' + qObj.o[qObj.c]; fb.className='feedback-line bad'; }
      const exp = document.getElementById('exp-'+qid);
      if(exp) exp.classList.add('show');
    });
  });
}

/* =========================================================================
   QUICK-CHECK QUESTION BANKS (one per topic, small, 1-2 Qs each)
   ========================================================================= */
const QC_BANKS = {
  foundation: { 'qc1': {q:'Information என்பது எது?', o:['தனித்த raw facts','செயலாக்கப்பட்ட, அர்த்தமுள்ள தரவு','ஒரு DBMS மென்பொருள்','ஒரு query language'], c:1, exp:'Information is processed data, which allows to be utilized in a significant way.'} },
  dbms: { 'qc2': {q:'RDBMS, DBMS-ஐ விட எதில் மேம்பட்டது?', o:['தரவை tables-ஆக சேமித்தல்','தரவை இழந்துவிடுதல்','slower access','no security'], c:0, exp:'RDBMS stores data as tables (relations) and adds normalization, keys, faster/secure access.'} },
  components: { 'qc3': {q:'DBMS-இன் 5 கூறுகளில் இல்லாதது எது?', o:['Hardware','Software','Internet Browser','Procedures/Methods'], c:2, exp:'5 components: Hardware, Software, Data, Procedures/Methods, Database Access Languages.'} },
  structure: { 'qc4': {q:'ஒரு row என அழைக்கப்படுவது?', o:['Attribute','Relation','Tuple','Field'], c:2, exp:'A Row is known as a TUPLE.'} },
  models: { 'qc5': {q:'ER model-இல் Diamond எதைக் குறிக்கிறது?', o:['Entity','Attribute','Relationship','Key'], c:2, exp:'Diamond represents the relationship in ER diagrams.'} },
  users: { 'qc6': {q:'DBMS-இன் security, license keys, user accounts ஆகியவற்றை பராமரிப்பவர் யார்?', o:['End User','DBA','Application Programmer','Database Designer'], c:1, exp:'Database Administrator (DBA) manages security, license keys, user accounts and access.'} },
  compare: { 'qc7': {q:'RDBMS-இல் Normalization எதைக் குறைக்கிறது?', o:['Security','Data Redundancy','Speed','Users'], c:1, exp:'RDBMS uses normalization to reduce redundancy.'} },
  relationships: { 'qc8': {q:'ஒரு Department-க்கு பல Staff உறுப்பினர்கள் — இது எவ்வகை உறவுமுறை?', o:['One-to-One','One-to-Many','Many-to-One','Many-to-Many'], c:1, exp:'One Department has many staff members → One-to-Many Relationship.'} },
  algebra: { 'qc9': {q:'PROJECT (∏) செயல்பாடு result-இல் என்ன செய்யும்?', o:['Rows-ஐ மட்டும் வடிகட்டும்','Duplicate rows-ஐ நீக்கும்','Duplicate rows-ஐ சேர்க்கும்','ஒன்றும் செய்யாது'], c:1, exp:'The projection eliminates columns not in the list, and the textbook notes "duplicate row is removed in the result".'} },
};
function renderQC(topicId){
  const bank = QC_BANKS[topicId];
  if(!bank) return '';
  let html = '';
  Object.keys(bank).forEach(qid => { html += mcqHTML(qid, bank[qid], '', ''); });
  return html;
}

/* =========================================================================
   WIRE-UP: called after each renderMain() to attach interactive JS per page
   ========================================================================= */
function wireUpHandlers(topicId){
  const qcMap = { foundation:'qc-foundation', dbms:'qc-dbms', components:'qc-components', structure:'qc-structure',
                  models:'qc-models', users:'qc-users', compare:'qc-compare', relationships:'qc-relationships', algebra:'qc-algebra' };
  if(qcMap[topicId]){
    const el = document.getElementById(qcMap[topicId]);
    if(el){ el.innerHTML = renderQC(topicId); wireMCQ('#'+qcMap[topicId], QC_BANKS[topicId]); }
  }

  if(topicId === 'structure') wireStructure();
  if(topicId === 'models') wireModels();
  if(topicId === 'relationships') wireRelationships();
  if(topicId === 'algebra'){ algState = { op:'select', cond:'Big Data', projCols:['course'], log:[], result:null, step:0 }; renderAlgStage(); }
  if(topicId === 'practice') wirePractice();
  if(topicId === 'examprep') wireExamPrep();
}

/* ---- Database Structure simulator wiring ---- */
function wireStructure(){
  const table = document.getElementById('structTable');
  const caption = document.getElementById('structCaption');
  if(!table) return;
  table.querySelectorAll('th').forEach(th => {
    th.addEventListener('click', function(){
      table.classList.remove('relation-hl');
      table.querySelectorAll('.col-hl').forEach(e=>e.classList.remove('col-hl'));
      table.querySelectorAll('.row-hl').forEach(e=>e.classList.remove('row-hl'));
      const colIdx = this.dataset.col;
      table.querySelectorAll('tr').forEach(tr => {
        const cell = tr.children[colIdx];
        if(cell) cell.classList.add('col-hl');
      });
      caption.textContent = '🟢 ATTRIBUTE / COLUMN தேர்ந்தெடுக்கப்பட்டது: "' + this.textContent + '" — இந்த column-இல் உள்ள அனைத்து மதிப்புகளும் ஒரே வகையான தகவலைக் (category) குறிக்கின்றன.';
    });
  });
  table.querySelectorAll('tr').forEach((tr,i) => {
    if(i===0) return;
    tr.addEventListener('click', function(e){
      if(e.target.tagName === 'TH') return;
      table.classList.remove('relation-hl');
      table.querySelectorAll('.col-hl').forEach(el=>el.classList.remove('col-hl'));
      table.querySelectorAll('.row-hl').forEach(el=>el.classList.remove('row-hl'));
      this.classList.add('row-hl');
      caption.textContent = '🟠 TUPLE / ROW தேர்ந்தெடுக்கப்பட்டது — இது ஒரு மாணவரின் முழு பதிவு (single record): ' + this.textContent.trim().replace(/\\s+/g,' ');
    });
  });
  document.getElementById('structRelationBtn').addEventListener('click', () => {
    table.querySelectorAll('.col-hl').forEach(el=>el.classList.remove('col-hl'));
    table.querySelectorAll('.row-hl').forEach(el=>el.classList.remove('row-hl'));
    table.classList.add('relation-hl');
    caption.textContent = '🟣 RELATION தேர்ந்தெடுக்கப்பட்டது — இந்த முழு அட்டவணையுமே ஒரு RELATION (table) ஆகும்.';
  });
  document.getElementById('structResetBtn').addEventListener('click', () => {
    table.classList.remove('relation-hl');
    table.querySelectorAll('.col-hl').forEach(el=>el.classList.remove('col-hl'));
    table.querySelectorAll('.row-hl').forEach(el=>el.classList.remove('row-hl'));
    caption.textContent = '👆 ஒரு column header அல்லது row-ஐ கிளிக் செய்து பாருங்கள்.';
  });
}

/* ---- Practice page wiring ---- */
function wirePractice(){
  const mcqWrap = document.getElementById('mcqBookWrap');
  mcqWrap.innerHTML = Object.keys(MCQ_BOOK).map(qid => mcqHTML(qid, MCQ_BOOK[qid], '', '')).join('');
  wireMCQ('#mcqBookWrap', MCQ_BOOK);

  const predictWrap = document.getElementById('predictWrap');
  predictWrap.innerHTML = PREDICT_QS.map((pq,i) => `
    <div class="q-block" id="pblock-${i}">
      <div class="q-text">${i+1}. ${pq.q}</div>
      <div class="predict-grid">
        ${pq.tables.map((t,j) => `<div class="predict-opt" data-pq="${i}" data-pidx="${j}"><b>${t.label}</b>${buildTable(t.rows, t.cols)}</div>`).join('')}
      </div>
      <div class="feedback-line" id="pfb-${i}"></div>
      <div class="explain-box" id="pexp-${i}">💡 ${pq.exp} &nbsp; <button class="chip" data-goto="algebra">➡ Relational Algebra Lab-இல் trace செய்ய</button></div>
    </div>
  `).join('');
  document.querySelectorAll('.predict-opt').forEach(opt => {
    opt.addEventListener('click', function(){
      const i = this.dataset.pq;
      const block = document.getElementById('pblock-'+i);
      if(block.dataset.answered) return;
      block.dataset.answered = '1';
      const j = parseInt(this.dataset.pidx,10);
      const pq = PREDICT_QS[i];
      block.querySelectorAll('.predict-opt').forEach((o,k) => {
        if(k === pq.c) o.classList.add('correct');
        if(k === j && j !== pq.c) o.classList.add('incorrect');
      });
      const fb = document.getElementById('pfb-'+i);
      fb.textContent = (j === pq.c) ? '✅ சரி!' : '❌ தவறு — சரியான தேர்வு: ' + pq.tables[pq.c].label;
      fb.className = 'feedback-line ' + (j===pq.c ? 'ok' : 'bad');
      document.getElementById('pexp-'+i).classList.add('show');
    });
  });
  predictWrap.querySelectorAll('[data-goto]').forEach(b => b.addEventListener('click', (e) => { e.stopPropagation(); goToTopicId(b.dataset.goto); }));

  const miscWrap = document.getElementById('misconceptWrap');
  miscWrap.innerHTML = MISCONCEPTIONS.map((m,i) => `
    <div class="misc-card">
      <div class="misc-wrong">❌ <b>தவறான புரிதல்:</b> ${m.wrong}</div>
      <button class="btn btn-ghost" id="miscbtn-${i}">✅ சரியான புரிதலைக் காட்டு</button>
      <div class="misc-right" id="miscright-${i}">✅ <b>சரியான புரிதல்:</b> ${m.right}</div>
    </div>
  `).join('');
  MISCONCEPTIONS.forEach((m,i) => {
    document.getElementById('miscbtn-'+i).addEventListener('click', function(){
      document.getElementById('miscright-'+i).classList.toggle('show');
    });
  });
}

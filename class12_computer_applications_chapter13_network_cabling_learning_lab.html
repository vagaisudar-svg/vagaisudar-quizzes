<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>பாடம் 13 — வலையமைப்பு வடமிடல் | Computer Applications Learning Lab</title>
<style>
  :root{
    --bg:#f3f6f8;
    --card:#ffffff;
    --primary:#0f766e;
    --primary-dark:#0b544e;
    --primary-light:#e6f5f3;
    --accent:#7c3aed;
    --accent-light:#f1e9ff;
    --correct:#15803d;
    --correct-bg:#eafaf0;
    --incorrect:#c0392b;
    --incorrect-bg:#fdecec;
    --warn:#b45309;
    --warn-bg:#fff6e6;
    --text:#1b2430;
    --muted:#5b6673;
    --border:#dfe6ea;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Noto Sans Tamil','Latha','Nirmala UI','Segoe UI',Tahoma,sans-serif;
    background:var(--bg);
    color:var(--text);
    line-height:1.65;
  }
  [lang-ta]{font-size:1rem;}
  h1,h2,h3,h4{line-height:1.45;}
  a{color:var(--primary);}
  button{font-family:inherit;}
  .app-shell{display:flex;flex-direction:column;min-height:100vh;}

  /* ---- Header ---- */
  header.top{
    background:linear-gradient(120deg,var(--primary-dark),var(--primary));
    color:#fff;
    padding:12px 16px;
    display:flex;
    align-items:center;
    gap:12px;
    position:sticky;top:0;z-index:40;
    box-shadow:0 2px 10px rgba(0,0,0,.15);
  }
  header.top .burger{
    background:rgba(255,255,255,.15);border:none;color:#fff;border-radius:8px;
    width:40px;height:40px;font-size:1.2rem;cursor:pointer;flex:0 0 auto;
    display:none;align-items:center;justify-content:center;
  }
  header.top .title-wrap{flex:1;min-width:0;}
  header.top h1{margin:0;font-size:1.05rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  header.top p{margin:0;font-size:.75rem;color:#d7efec;}
  header.top .lang-toggle{
    display:flex;background:rgba(255,255,255,.15);border-radius:999px;padding:3px;flex:0 0 auto;
  }
  header.top .lang-toggle button{
    border:none;background:transparent;color:#eafaf8;padding:6px 12px;border-radius:999px;
    font-size:.8rem;font-weight:700;cursor:pointer;
  }
  header.top .lang-toggle button.active{background:#fff;color:var(--primary-dark);}

  .body-row{display:flex;flex:1;min-height:0;}

  /* ---- Sidebar ---- */
  nav.sidebar{
    width:280px;flex:0 0 auto;background:#fff;border-right:1px solid var(--border);
    padding:16px 10px 90px;overflow-y:auto;
  }
  nav.sidebar .progress-wrap{padding:6px 8px 16px;}
  nav.sidebar .progress-label{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted);margin-bottom:6px;}
  nav.sidebar .progress-bar{height:8px;background:var(--border);border-radius:999px;overflow:hidden;}
  nav.sidebar .progress-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));transition:width .3s;}
  .topic-btn{
    display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;
    background:transparent;border:none;border-radius:10px;padding:10px 10px;margin-bottom:4px;
    cursor:pointer;font-size:.92rem;color:var(--text);
  }
  .topic-btn:hover{background:var(--primary-light);}
  .topic-btn.active{background:var(--primary-light);color:var(--primary-dark);font-weight:700;}
  .topic-btn .num{flex:0 0 auto;font-size:.72rem;color:var(--muted);background:#eef1f4;border-radius:6px;padding:2px 6px;min-width:50px;text-align:center;}
  .topic-btn.active .num{background:var(--primary);color:#fff;}
  .topic-btn .chk{flex:0 0 auto;margin-left:auto;color:var(--correct);font-weight:800;}
  .sidebar-section-label{font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:14px 8px 6px;}

  .sidebar-backdrop{display:none;}

  /* ---- Main ---- */
  main.content{flex:1;min-width:0;padding:22px 20px 110px;overflow-y:auto;}
  .content-inner{max-width:900px;margin:0 auto;}
  .topic-header{margin-bottom:18px;}
  .topic-header .crumb{font-size:.8rem;color:var(--muted);margin-bottom:4px;}
  .topic-header h2{margin:0 0 6px;font-size:1.5rem;color:var(--primary-dark);}
  .topic-header .goals{background:var(--primary-light);border-radius:12px;padding:12px 16px;font-size:.92rem;}
  .topic-header .goals b{color:var(--primary-dark);}

  .card{
    background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    padding:18px 18px;margin-bottom:18px;box-shadow:0 2px 10px rgba(20,30,40,.04);
  }
  .card h3{margin-top:0;color:var(--primary-dark);font-size:1.12rem;}
  .card h4{color:var(--accent);font-size:1rem;margin-bottom:6px;}

  .tb-def{background:#eef4ff;border-left:5px solid #2563eb;border-radius:10px;padding:12px 16px;margin:12px 0;}
  .tb-def .lbl{font-weight:800;color:#1d4ed8;font-size:.82rem;margin-bottom:4px;display:block;}
  .easy{background:var(--primary-light);border-left:5px solid var(--primary);border-radius:10px;padding:12px 16px;margin:12px 0;}
  .easy .lbl{font-weight:800;color:var(--primary-dark);font-size:.82rem;margin-bottom:4px;display:block;}
  .analogy{background:#fff7ed;border-left:5px solid #ea580c;border-radius:10px;padding:12px 16px;margin:12px 0;}
  .analogy .lbl{font-weight:800;color:#c2410c;font-size:.82rem;margin-bottom:4px;display:block;}
  .example-box{background:#f5f3ff;border-left:5px solid var(--accent);border-radius:10px;padding:12px 16px;margin:12px 0;}
  .example-box .lbl{font-weight:800;color:var(--accent);font-size:.82rem;margin-bottom:4px;display:block;}
  .activity-box{background:#ecfeff;border-left:5px solid #0891b2;border-radius:10px;padding:12px 16px;margin:12px 0;}
  .activity-box .lbl{font-weight:800;color:#0e7490;font-size:.82rem;margin-bottom:4px;display:block;}
  .mistake-box{background:var(--warn-bg);border-left:5px solid var(--warn);border-radius:10px;padding:12px 16px;margin:12px 0;}
  .mistake-box .lbl{font-weight:800;color:var(--warn);font-size:.82rem;margin-bottom:4px;display:block;}
  .exam-point{background:#fdf2f8;border-left:5px solid #db2777;border-radius:10px;padding:12px 16px;margin:12px 0;}
  .exam-point .lbl{font-weight:800;color:#be185d;font-size:.82rem;margin-bottom:4px;display:block;}
  .tryit-box{background:#f0fdf4;border:2px dashed #16a34a;border-radius:10px;padding:14px 16px;margin:12px 0;}
  .tryit-box .lbl{font-weight:800;color:#15803d;font-size:.82rem;margin-bottom:4px;display:block;}
  .quickcheck{background:#f8fafc;border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin:12px 0;}
  .quickcheck .lbl{font-weight:800;color:var(--muted);font-size:.82rem;margin-bottom:4px;display:block;}

  table.tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.92rem;}
  table.tbl th, table.tbl td{border:1px solid var(--border);padding:8px 10px;text-align:left;}
  table.tbl th{background:var(--primary-light);color:var(--primary-dark);}
  table.tbl tr:nth-child(even) td{background:#fafbfc;}

  .eng{color:var(--muted);font-weight:600;}
  code, .mono{font-family:'JetBrains Mono',Consolas,Menlo,monospace;background:#eef1f4;padding:1px 6px;border-radius:6px;font-size:.9em;}

  /* Diagrams */
  .diagram-box{background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px;margin:12px 0;overflow-x:auto;}
  .diagram-cap{text-align:center;font-size:.8rem;color:var(--muted);margin-top:8px;}
  .flow-row{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;}
  .flow-node{background:var(--primary-light);border:2px solid var(--primary);border-radius:10px;padding:10px 14px;font-size:.85rem;font-weight:700;text-align:center;color:var(--primary-dark);min-width:100px;}
  .flow-node.active{background:var(--primary);color:#fff;transform:scale(1.07);box-shadow:0 4px 14px rgba(15,118,110,.4);}
  .flow-node.muted{opacity:.45;}
  .flow-arrow{font-size:1.3rem;color:var(--muted);}
  .flow-arrow.active{color:var(--accent);font-weight:900;}

  /* Tabs (cable explorer / standards) */
  .tab-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
  .tab-btn{border:1.5px solid var(--border);background:#fff;border-radius:999px;padding:8px 16px;font-size:.85rem;font-weight:700;cursor:pointer;color:var(--text);}
  .tab-btn:hover{border-color:var(--primary);}
  .tab-btn.active{background:var(--primary);border-color:var(--primary);color:#fff;}

  /* RJ45 pin strip */
  .pin-strip{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:16px 0;}
  .pin-unit{text-align:center;width:58px;}
  .pin-swatch{height:64px;border-radius:6px;border:1.5px solid #cbd5e1;box-shadow:inset 0 0 0 1px rgba(0,0,0,.05);}
  .pin-num{font-size:.72rem;font-weight:800;color:var(--muted);margin-top:4px;}
  .pin-fn{font-size:.64rem;color:var(--muted);}
  .conn-wrap{display:flex;justify-content:space-between;gap:12px;}
  .conn-label{text-align:center;font-weight:800;font-size:.95rem;color:var(--primary-dark);margin-bottom:6px;}

  /* Buttons */
  .btn{border:none;border-radius:10px;padding:10px 18px;font-weight:700;font-size:.9rem;cursor:pointer;transition:transform .1s,opacity .15s;}
  .btn:active{transform:scale(.96);}
  .btn-primary{background:var(--primary);color:#fff;}
  .btn-primary:hover{background:var(--primary-dark);}
  .btn-accent{background:var(--accent);color:#fff;}
  .btn-ghost{background:#eef1f4;color:var(--text);}
  .btn-ghost:hover{background:#e3e7ec;}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;}

  input[type=text], input[type=number]{
    font-family:inherit;border:1.5px solid var(--border);border-radius:8px;padding:8px 10px;font-size:.92rem;width:100%;
  }

  /* MCQ option styling (shared) */
  .q-block{border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:14px;background:#fff;}
  .q-block .q-meta{font-size:.72rem;font-weight:800;color:#fff;background:var(--muted);display:inline-block;padding:2px 10px;border-radius:999px;margin-bottom:8px;}
  .q-block .q-meta.tier-green{background:#16a34a;}
  .q-block .q-meta.tier-yellow{background:#d97706;}
  .q-block .q-meta.tier-red{background:#dc2626;}
  .q-text{font-weight:700;margin-bottom:10px;}
  .opt{display:flex;align-items:center;gap:10px;border:1.5px solid var(--border);border-radius:9px;padding:9px 12px;margin-bottom:7px;cursor:pointer;font-size:.9rem;background:#fbfcfd;}
  .opt:hover{border-color:var(--primary);background:var(--primary-light);}
  .opt.correct{border-color:var(--correct);background:var(--correct-bg);}
  .opt.incorrect{border-color:var(--incorrect);background:var(--incorrect-bg);}
  .opt .letter{width:24px;height:24px;border-radius:50%;background:#e7e9f2;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.78rem;flex:0 0 auto;}
  .opt.correct .letter{background:var(--correct);color:#fff;}
  .opt.incorrect .letter{background:var(--incorrect);color:#fff;}
  .feedback-line{font-size:.85rem;font-weight:700;margin-top:6px;min-height:1.2em;}
  .feedback-line.ok{color:var(--correct);}
  .feedback-line.bad{color:var(--incorrect);}
  .explain-box{display:none;background:#f8fafc;border-radius:8px;padding:10px 12px;margin-top:8px;font-size:.85rem;}
  .explain-box.show{display:block;}

  details.acc{border:1px solid var(--border);border-radius:10px;margin-bottom:10px;overflow:hidden;}
  details.acc summary{padding:12px 14px;cursor:pointer;font-weight:700;background:#fafbfc;}
  details.acc[open] summary{background:var(--primary-light);color:var(--primary-dark);}
  details.acc .acc-body{padding:12px 16px;}

  .fib-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px;font-size:.92rem;}
  .fib-row input{width:200px;}

  /* Bottom bar */
  .bottom-bar{
    position:sticky;bottom:0;background:#fff;border-top:1px solid var(--border);
    display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;z-index:30;
  }
  .bottom-bar .mark-btn{background:var(--correct-bg);color:var(--correct);}
  .bottom-bar .mark-btn.done{background:var(--correct);color:#fff;}

  footer.note{text-align:center;font-size:.72rem;color:#9aa6b2;padding:10px;background:#fff;border-top:1px solid var(--border);}

  @media (max-width:860px){
    nav.sidebar{
      position:fixed;top:0;left:0;bottom:0;z-index:60;transform:translateX(-100%);
      transition:transform .22s ease;box-shadow:4px 0 24px rgba(0,0,0,.25);
    }
    nav.sidebar.open{transform:translateX(0);}
    header.top .burger{display:flex;}
    .sidebar-backdrop.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;}
    main.content{padding:16px 12px 100px;}
    .topic-header h2{font-size:1.25rem;}
  }
  @media (max-width:480px){
    header.top h1{font-size:.92rem;}
    .flow-node{min-width:80px;font-size:.78rem;padding:8px 10px;}
    .pin-unit{width:40px;}
    .pin-swatch{height:48px;}
  }
</style>
</head>
<body>
<div class="app-shell">
  <header class="top">
    <button class="burger" id="burgerBtn" aria-label="பட்டி">☰</button>
    <div class="title-wrap">
      <h1>Computer Applications Learning Lab · Class 12 · Tamil Nadu State Board</h1>
      <p>பாடம் 13 — வலையமைப்பு வடமிடல் (Network Cabling)</p>
    </div>
    <div class="lang-toggle" role="group" aria-label="Interface language">
      <button id="langTa" class="active" data-lang="ta">தமிழ்</button>
      <button id="langEn" data-lang="en">English</button>
    </div>
  </header>

  <div class="body-row">
    <div class="sidebar-backdrop" id="backdrop"></div>
    <nav class="sidebar" id="sidebar" aria-label="பாட பட்டியல்">
      <div class="progress-wrap">
        <div class="progress-label"><span>முன்னேற்றம் / Progress</span><span id="progPct">0%</span></div>
        <div class="progress-bar"><div class="progress-fill" id="progFill" style="width:0%"></div></div>
      </div>
      <div class="sidebar-section-label">தலைப்புகள் (Topics)</div>
      <div id="topicList"></div>
    </nav>

    <main class="content">
      <div class="content-inner" id="mainContent"></div>
    </main>
  </div>

  <div class="bottom-bar">
    <button class="btn btn-ghost" id="prevTopicBtn">⬅ முந்தையது</button>
    <button class="btn mark-btn" id="markCompleteBtn">✔ Mark Complete</button>
    <button class="btn btn-primary" id="nextTopicBtn">அடுத்தது ➡</button>
  </div>
  <footer class="note">Vagai Sudar · Class 12 Computer Applications · Chapter 13: Network Cabling · தமிழக அரசு பாடநூல் அடிப்படையில் · ஆஃப்லைன் கற்றல் கூடம்</footer>
</div>

<script>
/* =========================================================================
   STORAGE (safe wrapper)
   ========================================================================= */
const STORE_KEY = 'ca12_netcabling_lab_v1';
function loadState(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){ /* storage unavailable - continue with defaults */ }
  return { completed:[], lang:'ta', quiz:{} };
}
function saveState(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){ /* ignore */ }
}
let state = loadState();

/* =========================================================================
   TOPIC DATA
   ========================================================================= */
const TOPICS = [
  {id:'overview',     num:'13.1',        title:'அறிமுகம்'},
  {id:'cabletypes',   num:'13.2',        title:'வடங்களின் வகைகள்'},
  {id:'ethparts',     num:'13.3 / 13.3.1', title:'ஈத்தர்நெட் வடமிடல் பகுதிகள் & இணைப்பு வடம்'},
  {id:'rj45',         num:'13.3.2',      title:'RJ45 இணைப்பி & வயரிங்'},
  {id:'ethport',      num:'13.3.3',      title:'ஈத்தர்நெட் தொடர்பி & NIC'},
  {id:'crimping',     num:'13.3.4',      title:'கிரிம்பிங் கருவி'},
  {id:'otherjacks',   num:'13.4',        title:'மற்ற ஜாக் வகைகள்'},
  {id:'colorcoding',  num:'13.5',        title:'வண்ணக் குறிமுறை நுட்பங்கள்'},
  {id:'practice',     num:'Practice',    title:'பயிற்சி & Debugging Lab'},
  {id:'examprep',     num:'Exam',        title:'தேர்வு தயாரிப்பு'},
];
let currentIdx = 0;

/* =========================================================================
   SIDEBAR / NAV RENDERING
   ========================================================================= */
function renderSidebar(){
  const wrap = document.getElementById('topicList');
  wrap.innerHTML = '';
  TOPICS.forEach((t, i) => {
    const btn = document.createElement('button');
    btn.className = 'topic-btn' + (i === currentIdx ? ' active' : '');
    const done = state.completed.includes(t.id);
    btn.innerHTML = '<span class="num">'+t.num+'</span><span>'+t.title+'</span>' + (done ? '<span class="chk">✔</span>' : '');
    btn.addEventListener('click', () => { goTo(i); closeSidebarMobile(); });
    wrap.appendChild(btn);
  });
  const pct = Math.round((state.completed.length / TOPICS.length) * 100);
  document.getElementById('progPct').textContent = pct + '%';
  document.getElementById('progFill').style.width = pct + '%';
}

function goTo(i){
  currentIdx = Math.max(0, Math.min(TOPICS.length - 1, i));
  renderMain();
  renderSidebar();
  updateBottomBar();
  window.scrollTo({top:0, behavior:'smooth'});
  document.querySelector('main.content').scrollTo({top:0, behavior:'smooth'});
}

function updateBottomBar(){
  document.getElementById('prevTopicBtn').disabled = currentIdx === 0;
  document.getElementById('nextTopicBtn').disabled = currentIdx === TOPICS.length - 1;
  const markBtn = document.getElementById('markCompleteBtn');
  const done = state.completed.includes(TOPICS[currentIdx].id);
  markBtn.classList.toggle('done', done);
  markBtn.textContent = done ? '✔ முடிந்தது (Completed)' : '✔ Mark Complete';
}

document.getElementById('prevTopicBtn').addEventListener('click', () => goTo(currentIdx - 1));
document.getElementById('nextTopicBtn').addEventListener('click', () => goTo(currentIdx + 1));
document.getElementById('markCompleteBtn').addEventListener('click', () => {
  const id = TOPICS[currentIdx].id;
  const idx = state.completed.indexOf(id);
  if(idx === -1) state.completed.push(id); else state.completed.splice(idx,1);
  saveState();
  renderSidebar();
  updateBottomBar();
});

/* mobile sidebar */
const sidebar = document.getElementById('sidebar');
const backdrop = document.getElementById('backdrop');
document.getElementById('burgerBtn').addEventListener('click', () => {
  sidebar.classList.toggle('open');
  backdrop.classList.toggle('show');
});
backdrop.addEventListener('click', closeSidebarMobile);
function closeSidebarMobile(){ sidebar.classList.remove('open'); backdrop.classList.remove('show'); }

/* language toggle (UI chrome only; lesson text follows textbook Tamil with English terms inline) */
document.getElementById('langTa').addEventListener('click', () => setLang('ta'));
document.getElementById('langEn').addEventListener('click', () => setLang('en'));
function setLang(l){
  state.lang = l; saveState();
  document.getElementById('langTa').classList.toggle('active', l==='ta');
  document.getElementById('langEn').classList.toggle('active', l==='en');
  document.body.setAttribute('data-lang', l);
}

/* =========================================================================
   MAIN RENDER DISPATCH
   ========================================================================= */
const RENDERERS = {
  overview: renderOverview,
  cabletypes: renderCableTypes,
  ethparts: renderEthParts,
  rj45: renderRJ45,
  ethport: renderEthPort,
  crimping: renderCrimping,
  otherjacks: renderOtherJacks,
  colorcoding: renderColorCoding,
  practice: renderPractice,
  examprep: renderExamPrep,
};

function renderMain(){
  const t = TOPICS[currentIdx];
  const el = document.getElementById('mainContent');
  el.innerHTML = RENDERERS[t.id]();
  wireUpHandlers(t.id);
}

/* =========================================================================
   TOPIC 1 — 13.1 Introduction
   ========================================================================= */
function renderOverview(){
  return `
  <div class="topic-header">
    <div class="crumb">பாடம் 13 › 13.1</div>
    <h2>அறிமுகம் <span class="eng">(Introduction)</span></h2>
    <div class="goals">
      <b>கற்றலின் நோக்கங்கள் (Learning Objectives):</b>

  <div class="card">
    <h3>13.1 அறிமுகம் (Introduction)</h3>
    <div class="tb-def">
      <span class="lbl">📘 பாடநூல் வரையறை (Textbook Definition)</span>
      கணினி வலையமைப்பு என்பது தரவுகள் மற்றும் வளங்களைப் பகிர்ந்து கொள்வதற்காக ஒன்றோடொன்று இணைக்கப்பட்ட கணினிகள் அல்லது பிற சாதனங்களின் தொகுப்பாகும். கம்பி ஊடகம் அல்லது கம்பியில்லா ஊடகம் மூலம் கணினிகளை வலையமைப்பில் இணைக்க முடியும். காப்பிடாத முறுக்கு இணைக் கம்பிகள் (UTP), காப்பிடப்பட்ட முறுக்கு கம்பிகள் (STP) மற்றும் ஒளியிழை வடங்கள் போன்றவை கம்பி ஊடகங்களுக்கு உதாரணங்களாகும். அகச்சிவப்பு கதிர்கள், ப்ளூடூத் (Bluetooth) மற்றும் வை·பை (WI-FI) போன்றவை கம்பியில்லா ஊடகங்களுக்கு உதாரணங்களாகும்.
    </div>
    <div class="easy">
      <span class="lbl">💡 எளிய விளக்கம் (Easy Explanation)</span>
      பள்ளியின் Computer Lab-இல் உள்ள அனைத்து கணினிகளும் ஒரே பிரிண்டரைப் பயன்படுத்த முடிவதும், ஒரு கணினியிலிருந்து இன்னொரு கணினிக்கு கோப்புகளை அனுப்ப முடிவதும் — இதுவே Network (வலையமைப்பு) செய்யும் வேலை. இந்த இணைப்பை ஏற்படுத்த கம்பிகள் (wired) அல்லது கம்பியில்லா சமிக்ஞைகள் (wireless) பயன்படுகின்றன.
    </div>
    <div class="analogy">
      <span class="lbl">🔗 நிஜ வாழ்க்கை உதாரணம் (Analogy)</span>
      பள்ளி பேருந்து சேவையை நினைத்துப் பாருங்கள் — ஒவ்வொரு மாணவனும் (கணினி) பேருந்து பாதையில் (Cable) இணைக்கப்பட்டு பள்ளிக்கு (மற்ற கணினிகள்/சேவையகம்) வந்து சேர்கிறான். பாதை நல்லதாக இருந்தால் (நல்ல தரமான கேபிள்) பயணம் வேகமாகவும் பாதுகாப்பாகவும் இருக்கும்.
    </div>

  </div>

  <div class="card">
    <h3>இணையம் மற்றும் WWW</h3>
    <div class="tb-def">
      <span class="lbl">📘 பாடநூல் வரையறை</span>
      இணையம் என்பது உலகெங்கிலும் உள்ள பில்லியன் கணக்கான கணினிகளை ஒன்றோடொன்று இணைக்கும் உலகளாவிய வலையமைப்பு ஆகும். World Wide Web (WWW) என்பது இணையத்தின் ஒரு சேவையாகும். இது கோடிக்கணக்கான இணையப் பக்கங்கள் அடங்கிய ஒரு தொகுப்பாகும். இது டிம் பெர்னர்ஸ் லீ என்பவரால் உருவாக்கப்பட்டது. வலையமைப்பின் மூலம் மக்கள் இணையத்தை எங்கிருந்தும் அணுக முடியும். ஆனால் வலையமைப்பைக் கட்டமைப்பது கடினமான ஒன்றாக இருக்கிறது.
    </div>
    <div class="exam-point">
      <span class="lbl">⭐ தேர்வுக் குறிப்பு (Exam Point)</span>
      உலகம் முழுவதும் இன்றளவும் மக்களுக்கு வேகமான இணைய தளத்தை வழங்க வலையமைப்பு வடங்கள் பயன்படுத்தப்படுகின்றன. சரியான வடம் (cable) தேர்வு செய்வது வலையமைப்பு வேகம் மற்றும் பாதுகாப்பில் முக்கியப் பங்கு வகிக்கிறது.
    </div>
    <div class="activity-box">
      <span class="lbl">🧪 கூடுதல் தகவல் (Did You Know)</span>
      அதிக எண்ணிக்கையிலான சாதனங்கள் (கைப்பேசி உட்பட) தொலைவிலுள்ள வளங்களைப் பகிர்வதை கம்பியில்லா வலையமைப்புகள் சாத்தியமாக்குகின்றன. கம்பிவலை அமைப்புகள், கம்பியில்லா வலையமைப்புகளுடன் ஒப்பிடும் பொழுது அதிக இணைய வேகம் மற்றும் பாதுகாப்பைக் கொடுக்கின்றன. ஆனால் பெரிய பரப்பளவில் கம்பி வலையமைப்பை நிறுவுதல் மிகுந்த செலவை ஏற்படுத்தும் — அதனால் அதிக வேகம் மற்றும் பாதுகாப்பான இணைப்புகள் தேவைப்படும் இடங்களில் கம்பிவலை அமைப்புகள் இன்றும் பரவலாகப் பயன்படுத்தப்படுகின்றன.
    </div>
  </div>

    <div class="activity-box"><span class="lbl">ஈத்தர்நெட் வரலாறு</span>1973 இல் பாப் மெட்கால்ப் ஈத்தர்நெட் கண்டுபிடித்தார். அதே நேரத்தில் Xerox PARC (கலிபோர்னியாவில் உள்ள பாலோ ஆல்டோ ஆராய்ச்சி மையம்) நிறுவனம் 1975 ஆம் ஆண்டில் காப்புரிமை பெற்றது. இது மேம்பட்ட கணினி பணிநிலையங்களை ஒன்றிணைக்கவும், அவற்றுக்கிடையே தகவலைப் பரிமாறிக் கொள்ளவும், வேக லேசர் அச்சுப்பொறிக்கு அனுப்பவும் பயன்படுத்தப்பட்டது. மெட்காஃப் மற்றும் பிறர் 1980 ஆம் ஆண்டில் திறந்த ஈத்தர்நெட் தரத்தை முடித்தார்கள். மேலும் 1985 ஆம் ஆண்டில் அது IEEE தரநிலையாக மாறியது. இதன் மூலம் புதிய தொழில்நுட்பம் உருவாகி மாபெரும் எழுச்சிக்குத் தயாராக இருந்தது.<br><br>802.3 (ஈத்தர்நெட்) மற்றும் 802.5 (டோக்கன் ரிங்) உள்ளிட்டு IEEE இன் 802 பரிவுகளில் பல வலையமைப்பு தரநிலைகள் வெளியிடப்பட்டன. IEEE தரநிலை முதன் முதலில் 1985 ஆம் ஆண்டில் IEEE 802.3 (CSMA/CD) என்ற தலைப்பில் வெளியிடப்பட்டது. ஜெராக்ஸ் நிறுவனம் ஈத்தர்நெட் என்ற பெயரை வர்த்தக முத்திரைகளிலிருந்து விலக்கிக் கொண்ட போதிலும், IEEE தரநிலையானது "ஈத்தர்நெட்" என்ற பெயரைப் பயன்படுத்தவில்லை. ஏனெனில் திறந்த தரநிலைக் குழுக்கள் (Open Standard Committee) ஒரு குறிப்பிட்ட நிறுவனத்தின் வர்த்தகப் பெயர்களைப் பயன்படுத்துவதை ஆதரிப்பதில்லை. இதன் விளைவாக, IEEE இந்தத் தொழில்நுட்பத்தை 802.3 CSMA/CD அல்லது வெறும் 802.3 என அழைக்கிறது. இருப்பினும், 802.3 தரநிலையில் உருவாக்கப்பட்ட நெட்வொர்க் அமைப்பைக் குறிப்பிடும் போது பெரும்பாலான மக்கள் "ஈத்தர்நெட்" என்னும் பெயரைப் பயன்படுத்துகின்றனர்.<br><br>குறிப்பு: www.wikipedia.org</div>

    <ul>
      <li>கணினி வலையமைப்பு என்பது தரவுகள் மற்றும் வளங்களைப் பகிர்ந்து கொள்வதற்காக ஒன்றோடொன்று இணைக்கப்பட்ட கணினிகளின் தொகுப்பாகும். கம்பி ஊடகம் (UTP, STP, ஒளியிழை) அல்லது கம்பியில்லா ஊடகம் (Infrared, Bluetooth, Wi-Fi) மூலம் இணைக்கலாம்.</li>
      <li>இணையச்சு வடம் (Coaxial Cable) — Cable TV/Antenna இணைப்பிற்குப் பயன்படும்; Thinnet &amp; Thicknet என இரு வகைகள்.</li>

      <li>ஒளியிழை வடம் (Fiber Optic) — கண்ணாடி இழை, ஒளி துடிப்புகள் மூலம் தகவல் அனுப்பும்; Single mode (தொலைதூரம், விலை அதிகம்) &amp; Multimode (குறுகிய தூரம், மலிவு) என இரு வகைகள்.</li>
      <li>USB கேபிள் — Keyboard, Mouse, Smartphone போன்றவற்றை இணைக்கும்; சமீபத்திய பதிப்பு USB 3.0 (4.85 Gbps). Dongle = SIM Slot கொண்ட சிறிய USB புற சாதனம்.</li>
      <li>தொடர் &amp; இணை வடங்கள் — இணை வடம் 8 பிட்/நேரம் அனுப்பும்; தொடர் வடம் 1 பிட்/நேரம் அனுப்பும். RS-232 = Null Modem Cable.</li>
      <li>ஈத்தர்நெட் வடமிடலில் (Ethernet Cabling) 4 முக்கிய பகுதிகள்: இணைப்பு வடம் (Patch Cable), RJ45 இணைப்பி, ஈத்தர்நெட் தொடர்பி, கிரிம்பிங் கருவி.</li>
      <li>RJ45 = 8P8C இணைப்பி, 8 ஊசிகள் கொண்டது. இரு வயரிங் திட்டங்கள்: T-568A &amp; T-568B. Pin1=TX+, Pin2=TX−, Pin3=RX+, Pin6=RX−; Pin 4,5,7,8 Reserved.</li>
      <li>ஈத்தர்நெட் தொடர்பி (Ethernet Port) RJ45 இணைப்பியை ஏற்கும் திறப்பு; NIC = Network Interface Card (Expansion card அல்லது Built-in).</li>
      <li>கிரிம்பிங் கருவி RJ45 இணைப்பியை வடத்துடன் இணைக்கும் 7-படி செயல்முறையைப் பயன்படுத்துகிறது.</li>
      <li>Registered Jack (RJ) வகைகள்: RJ-11 (6 ஊசி, தொலைபேசி), RJ-14 (6 ஊசி, 4 பயன்பாட்டில்), RJ-45 (8 ஊசி, Ethernet), RJ-61 (8 ஊசி, Network), RJ-21 (50 ஊசி, Champ/Amphenol, Trunking).</li>
      <li>வண்ணக் குறிமுறை தொழில்நுட்பம் (Color Coding) — மூன்று வயரிங் நுட்பங்கள்: Straight-Through (PC↔Hub), Cross-over (PC↔PC நேரடி), Roll-over (Console Cable).</li>
    </ul>
  </div>

/* =========================================================================
   QUICK-CHECK MCQ HELPER (generic renderer + event wiring)
   ========================================================================= */
function mcqHTML(qid, qObj, tierClass, tierLabel){
  const letters = ['அ','ஆ','இ','ஈ','உ'];
  let optsHtml = qObj.o.map((opt,i) =>
    `<div class="opt" data-qid="${qid}" data-idx="${i}"><span class="letter">${letters[i]}</span><span>${opt}</span></div>`
  ).join('');
  return `
  <div class="q-block" id="block-${qid}">
    ${tierLabel ? `<span class="q-meta ${tierClass}">${tierLabel}</span>` : ''}
    <div class="q-text">${qObj.q}</div>
    <div class="opts-wrap">${optsHtml}</div>
    <div class="feedback-line" id="fb-${qid}"></div>
    ${qObj.exp ? `<div class="explain-box" id="exp-${qid}">💡 ${qObj.exp}</div>` : ''}
  </div>`;
}
function wireMCQ(containerSel, dataMap){
  document.querySelectorAll(containerSel + ' .opt').forEach(opt => {
    opt.addEventListener('click', function(){
      const qid = this.dataset.qid;
      const idx = parseInt(this.dataset.idx,10);
      const block = document.getElementById('block-'+qid);
      if(block.dataset.answered) return;
      block.dataset.answered = '1';
      const qObj = dataMap[qid];
      const opts = block.querySelectorAll('.opt');
      opts.forEach((o,i) => {
        if(i === qObj.c) o.classList.add('correct');
        if(i === idx && idx !== qObj.c) o.classList.add('incorrect');
      });
      const fb = document.getElementById('fb-'+qid);
      if(idx === qObj.c){ fb.textContent = '✅ சரியான விடை!'; fb.className='feedback-line ok'; }
      else { fb.textContent = '❌ தவறான விடை. சரியான விடை: ' + qObj.o[qObj.c]; fb.className='feedback-line bad'; }
      const exp = document.getElementById('exp-'+qid);
      if(exp) exp.classList.add('show');
    });
  });
}

   QUICK-CHECK QUESTION BANKS (one per topic, small, 1-2 Qs each)
   ========================================================================= */
const QC_BANKS = {
  overview: {

  },
  cabletypes: {
    'qc2': {q:'எந்த வடம் Cable TV இணைப்பிற்குப் பயன்படுகிறது?', o:['UTP','Fiber Optic','இணையச்சு வடம் (Coaxial)','USB'], c:2, exp:'இணையச்சு வடம் (Coaxial Cable) தொலைக்காட்சியை அலைவாங்கியுடன் இணைக்கப் பயன்படுகிறது.'}
  },
  ethparts: {
    'qc3': {q:'ஈத்தர்நெட் வடமிடலில் எத்தனை முக்கிய பகுதிகள் உள்ளன?', o:['2','3','4','5'], c:2, exp:'4 பகுதிகள்: இணைப்பு வடம், RJ45 இணைப்பி, ஈத்தர்நெட் தொடர்பி, கிரிம்பிங் கருவி.'}
  },
  rj45: {
    'qc4': {q:'T-568B வயரிங் திட்டத்தில் Pin 1 இன் வண்ணம் எது?', o:['white/green stripe','white/orange stripe','நீலம் (blue)','பழுப்பு (brown)'], c:1, exp:'T-568B இல் Pin1 = white/orange stripe (Tx+).'}
  },
  ethport: {
    'qc5': {q:'இணைய இணைப்பு கிடைத்தவுடன் எந்த LED தொடர்ந்து ஒளிரும்?', o:['பச்சை','ஆரஞ்சு','சிவப்பு','நீலம்'], c:1, exp:'இணைய இணைப்பு கிடைத்தவுடன் ஆரஞ்சு LED ஒளிவிட்டு (Blink) ஒளிரத் தொடங்கும்.'}
  },
  crimping: {
    'qc6': {q:'Crimping கருவியின் முக்கியச் செயல் என்ன?', o:['வடத்தை வெட்டுதல்','RJ45 இணைப்பியை வடத்துடன் பொருத்துதல்','வடத்தை சோதித்தல்','வண்ணம் தீட்டுதல்'], c:1, exp:'Crimping கருவியின் முக்கிய செயல் RJ45 இணைப்பியை முறுக்கு இணைக் கம்பியின் முனையில் பொருத்துவதாகும்.'}
  },
  otherjacks: {
    'qc7': {q:'RJ-21 இல் எத்தனை ஊசிகள் (Pins) உள்ளன?', o:['6','8','25','50'], c:3, exp:'RJ-21 இல் ஒரு முனையில் 25 + அடுத்த முனையில் 25 = மொத்தம் 50 ஊசிகள் உள்ளன.'}
  },
  colorcoding: {
    'qc8': {q:'இரண்டு கணினிகளை நேரடியாக இணைக்க எந்த வயரிங் தரம் பயன்படுகிறது?', o:['Straight-through','Cross-over','Roll-over','RJ21'], c:1, exp:'Cross-over வயரிங் இரண்டு கணினிகளை நேரடியாக (Hub இல்லாமல்) இணைக்கப் பயன்படுகிறது.'}
  },
};
function renderQC(topicId){
  const bank = QC_BANKS[topicId];
  if(!bank) return '';
  let html = '';
  Object.keys(bank).forEach(qid => { html += mcqHTML(qid, bank[qid], '', ''); });
  return html;
}

/* =========================================================================
   WIRE-UP: called after each renderMain() to attach interactive JS per page
   ========================================================================= */
function wireUpHandlers(topicId){
  const qcMap = { overview:'qc-overview', cabletypes:'qc-cabletypes', ethparts:'qc-ethparts', rj45:'qc-rj45',
                  ethport:'qc-ethport', crimping:'qc-crimping', otherjacks:'qc-otherjacks', colorcoding:'qc-colorcoding' };
  if(qcMap[topicId]){
    const el = document.getElementById(qcMap[topicId]);
    if(el){ el.innerHTML = renderQC(topicId); wireMCQ('#'+qcMap[topicId], QC_BANKS[topicId]); }
  }

  if(topicId === 'cabletypes') wireCableTypes();
  if(topicId === 'rj45') wireRJ45();
  if(topicId === 'crimping') wireCrimping();
  if(topicId === 'colorcoding') wireColorCoding();
  if(topicId === 'practice') wirePractice();
  if(topicId === 'examprep') wireExamPrep();
}

/* ---- Cable type explorer wiring ---- */

  let active = 'coax';
  function render(){
    document.getElementById('cableTabs').innerHTML = CABLE_TABS.map(([k,l]) =>
      `<button class="tab-btn ${k===active?'active':''}" data-k="${k}">${l}</button>`).join('');
    document.querySelectorAll('#cableTabs .tab-btn').forEach(b => b.addEventListener('click', () => { active = b.dataset.k; render(); }));
    const d = CABLE_DATA[active];
    document.getElementById('cableVisual').innerHTML = cableVisualHTML(active) + '<div class="diagram-cap">'+d.title+'</div>';
    document.getElementById('cableDetail').innerHTML = `
      <h4>${d.title}</h4>
      <div class="tb-def"><span class="lbl">📘 பாடநூல் வரையறை (Textbook Definition)</span>${d.def}</div>
      <div class="easy"><span class="lbl">💡 வகைகள் (Types)</span>${d.types}</div>
      <table class="tbl"><tr><th colspan="2">முக்கிய தகவல்கள்</th></tr>${d.facts.map(f=>'<tr><td style="width:24px;">•</td><td>'+f+'</td></tr>').join('')}</table>
      <div class="analogy"><span class="lbl">🔗 உதாரணம் (Analogy)</span>${d.analogy}</div>
      <div class="exam-point"><span class="lbl">⭐ தேர்வுக் குறிப்பு</span>${d.exam}</div>
    `;
  }
  render();
}

/* ---- RJ45 pinout simulator wiring ---- */
function wireRJ45(){
  let std = 'b';
  function render(){
    document.getElementById('rj45Tabs').innerHTML = ['a','b'].map(k =>
      `<button class="tab-btn ${k===std?'active':''}" data-std="${k}">${RJ45_STANDARDS[k].label}</button>`).join('');
    document.querySelectorAll('#rj45Tabs .tab-btn').forEach(b => b.addEventListener('click', () => { std=b.dataset.std; render(); }));
    document.getElementById('rj45StdLabel').textContent = RJ45_STANDARDS[std].label;
    document.getElementById('rj45PinStrip').innerHTML = RJ45_STANDARDS[std].pins.map(p =>
      `<div class="pin-unit"><div class="pin-swatch" style="${pinSwatchStyle(p)}"></div><div class="pin-num">Pin ${p.num}</div><div class="pin-fn">${p.fn}</div></div>`).join('');
  }
  render();
}

/* ---- Crimping tool step simulator wiring ---- */
let crimpStep = -1;
function wireCrimping(){
  crimpStep = -1;
  renderCrimpStep();
  document.getElementById('crimpNextBtn').addEventListener('click', () => { if(crimpStep < CRIMP_STEPS.length-1){ crimpStep++; renderCrimpStep(); } });
  document.getElementById('crimpPrevBtn').addEventListener('click', () => { if(crimpStep > 0){ crimpStep--; renderCrimpStep(); } });
  document.getElementById('crimpResetBtn').addEventListener('click', () => { crimpStep = -1; renderCrimpStep(); });
}
function renderCrimpStep(){
  const dotsWrap = document.getElementById('crimpDots');
  let dotsHtml = '';
  CRIMP_STEPS.forEach((s,i) => {
    dotsHtml += '<div class="flow-node '+(i===crimpStep?'active':'')+' '+(i>crimpStep?'muted':'')+'" style="min-width:36px;padding:8px 10px;">'+(i+1)+'</div>';
    if(i < CRIMP_STEPS.length - 1) dotsHtml += '<div class="flow-arrow">→</div>';
  });
  dotsWrap.innerHTML = dotsHtml;
  const panel = document.getElementById('crimpPanel');
  if(crimpStep === -1){
    panel.innerHTML = '<p>▶ "அடுத்த படி" பொத்தானை அழுத்தி படிப்படியாகத் தொடங்குங்கள்…</p>';
  } else {
    const s = CRIMP_STEPS[crimpStep];
    panel.innerHTML = `<h4>${s.title}</h4><p>${s.text}</p><div class="exam-point"><span class="lbl">ஏன்? (Why?)</span>${s.why}</div>`;
  }
  document.getElementById('crimpPrevBtn').disabled = crimpStep <= 0;
  document.getElementById('crimpNextBtn').disabled = crimpStep >= CRIMP_STEPS.length - 1;
}

/* ---- Wiring pattern (color coding) simulator wiring ---- */
function wireColorCoding(){
  let wt = 'straight';
  function render(){
    document.getElementById('wireTabs').innerHTML = Object.keys(WIRING_PATTERNS).map(k =>
      `<button class="tab-btn ${k===wt?'active':''}" data-w="${k}">${WIRING_PATTERNS[k].label}</button>`).join('');
    document.querySelectorAll('#wireTabs .tab-btn').forEach(b => b.addEventListener('click', () => { wt=b.dataset.w; render(); }));
    const pat = WIRING_PATTERNS[wt];
    let lines = '';
    for(let i=0;i<8;i++){
      const y1 = 14 + i*33;
      const target = pat.map[i]-1;
      const y2 = 14 + target*33;
      lines += `<line x1="34" y1="${y1}" x2="280" y2="${y2}" stroke="${WIRE_PIN_COLORS[i]}" stroke-width="3" opacity="0.85"/>`;
      lines += `<circle cx="34" cy="${y1}" r="5" fill="${WIRE_PIN_COLORS[i]}"/><text x="8" y="${y1+4}" font-size="12" fill="#334155">${i+1}</text>`;
      lines += `<circle cx="280" cy="${y2}" r="5" fill="${WIRE_PIN_COLORS[i]}"/><text x="292" y="${y2+4}" font-size="12" fill="#334155">${target+1}</text>`;
    }
    document.getElementById('wireSvg').innerHTML = lines;
    document.getElementById('wireCap').textContent = 'படம் — ' + pat.label + ' வயரிங் (redrawn)';
    document.getElementById('wireDescBox').innerHTML = `<div class="easy"><span class="lbl">💡 விளக்கம்</span>${pat.desc}</div>`;
  }
  render();
}

/* ---- Practice page wiring ---- */
function wirePractice(){
  document.getElementById('mcqBookWrap').innerHTML = Object.keys(MCQ_BOOK).map(k => mcqHTML(k, MCQ_BOOK[k], '', '')).join('');
  wireMCQ('#mcqBookWrap', MCQ_BOOK);

  document.getElementById('mcqExtraWrap').innerHTML = Object.keys(MCQ_EXTRA).map(k => mcqHTML(k, MCQ_EXTRA[k], MCQ_EXTRA[k].tier, MCQ_EXTRA[k].tierLabel)).join('');
  wireMCQ('#mcqExtraWrap', MCQ_EXTRA);

  // True / False
  const tfWrap = document.getElementById('tfWrap');
  tfWrap.innerHTML = TF_QS.map((tf,i) => `
    <div class="q-block" id="tf-block-${i}">
      <div class="q-text">${i+1}. ${tf.q}</div>
      <div class="btn-row">
        <button class="btn btn-ghost tf-btn" data-i="${i}" data-val="true">சரி (True)</button>
        <button class="btn btn-ghost tf-btn" data-i="${i}" data-val="false">தவறு (False)</button>
      </div>
      <div class="feedback-line" id="tf-fb-${i}"></div>
    </div>`).join('');
  document.querySelectorAll('.tf-btn').forEach(btn => {
    btn.addEventListener('click', function(){
      const i = parseInt(this.dataset.i,10);
      const block = document.getElementById('tf-block-'+i);
      if(block.dataset.answered) return;
      block.dataset.answered = '1';
      const chosen = this.dataset.val === 'true';
      const fb = document.getElementById('tf-fb-'+i);
      if(chosen === TF_QS[i].a){ fb.className='feedback-line ok'; fb.textContent = '✅ சரி! ' + TF_QS[i].exp; }
      else { fb.className='feedback-line bad'; fb.textContent = '❌ தவறு. ' + TF_QS[i].exp; }
    });
  });

  // Fill in the blanks
  const fibWrap = document.getElementById('fibWrap');
  fibWrap.innerHTML = FIB_QS.map((f,i) => `<div class="fib-row">${i+1}. ${f.text.replace('______________','')} <input type="text" id="fib-${i}" placeholder="விடையை இங்கே தட்டச்சு செய்யவும்"></div>`).join('');
  document.getElementById('fibCheckBtn').addEventListener('click', () => {
    let correct = 0;
    FIB_QS.forEach((f,i) => {
      const val = (document.getElementById('fib-'+i).value || '').trim().toLowerCase();
      const ok = val === f.ans || val.replace(/\s/g,'') === f.ans.replace(/\s/g,'');
      document.getElementById('fib-'+i).style.borderColor = val === '' ? 'var(--border)' : (ok ? 'var(--correct)' : 'var(--incorrect)');
      if(ok) correct++;
    });
    document.getElementById('fibResult').innerHTML = correct + ' / ' + FIB_QS.length + ' சரியானவை. (சரியான விடைகள்: ' + FIB_QS.map(f=>f.ans).join(', ') + ')';
  });

  // Match the following
  const matchWrap = document.getElementById('matchWrap');
  let selectedLeft = null;
  const matched = {};
  function renderMatch(){
    matchWrap.innerHTML = `
      <div style="display:flex;gap:30px;flex-wrap:wrap;">
        <div><b>வடம்</b><div id="matchLeftCol" style="margin-top:8px;"></div></div>
        <div><b>பயன்பாடு</b><div id="matchRightCol" style="margin-top:8px;"></div></div>
      </div>
      <div id="matchResult" style="margin-top:10px;font-weight:700;"></div>`;
    const leftCol = document.getElementById('matchLeftCol');
    const rightCol = document.getElementById('matchRightCol');
    MATCH_LEFT.forEach(l => {
      const b = document.createElement('button');
      b.className = 'btn btn-ghost'; b.style.display='block'; b.style.marginBottom='8px'; b.style.minWidth='160px';
      b.textContent = l + (matched[l] ? ' ✅ → ' + matched[l] : '');
      if(matched[l]) b.disabled = true;
      b.addEventListener('click', () => { selectedLeft = l; renderMatch(); b.style.outline='3px solid var(--accent)'; });
      leftCol.appendChild(b);
    });
    MATCH_RIGHT.forEach(r => {
      const usedUp = Object.values(matched).includes(r);
      const b = document.createElement('button');
      b.className = 'btn btn-ghost'; b.style.display='block'; b.style.marginBottom='8px'; b.style.minWidth='260px';
      b.textContent = r + (usedUp ? ' ✅' : '');
      if(usedUp) b.disabled = true;
      b.addEventListener('click', () => {
        if(!selectedLeft) return;
        matched[selectedLeft] = r;
        selectedLeft = null;
        renderMatch();
        if(Object.keys(matched).length === MATCH_LEFT.length){
          const allCorrect = MATCH_LEFT.every(l => matched[l] === MATCH_ANSWER[l]);
          document.getElementById('matchResult').textContent = allCorrect ? '🎉 அனைத்தும் சரி!' : 'முடிந்தது — சில பொருத்தங்களை சரிபார்க்கவும் (மேலே உள்ள பட்டியலுடன் ஒப்பிடவும்).';
        }
      });
      rightCol.appendChild(b);
    });
  }
  renderMatch();

  // Debugging Lab
  const debugWrap = document.getElementById('debugWrap');
  debugWrap.innerHTML = DEBUG_CASES.map((c,i) => `
    <div class="card" style="margin-bottom:12px;">
      <div><span style="color:var(--incorrect);font-weight:800;">❌ </span><span style="font-weight:700;">${c.wrong}</span></div>
      <button class="btn btn-ghost" style="margin-top:8px;" data-dbg="${i}">என்ன தவறு? (What's wrong?)</button>
      <div class="explain-box" id="dbg-${i}">
        <b>வகை:</b> ${c.errorType}<br>
        <b>ஏன்?:</b> ${c.why}<br>
        <span style="color:var(--correct);font-weight:800;">✅ சரியான வடிவம்:</span> ${c.fix}
      </div>
    </div>`).join('');
  document.querySelectorAll('[data-dbg]').forEach(btn => {
    btn.addEventListener('click', function(){ document.getElementById('dbg-'+this.dataset.dbg).classList.toggle('show'); });
  });
}

<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>7ம் வகுப்பு தமிழ் - பருவம் 3 இயல் 3 - வினா விடைகள் Quiz</title>
<style>
  :root{
    --bg:#f4f6fb;
    --card:#ffffff;
    --primary:#3454d1;
    --primary-dark:#25379a;
    --correct:#1f9d55;
    --correct-bg:#e6f7ec;
    --incorrect:#d64545;
    --incorrect-bg:#fdecec;
    --text:#1f2430;
    --muted:#6b7280;
    --border:#e2e5ec;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Noto Sans Tamil','Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
    background:linear-gradient(160deg,#eef1fb,#f7f9fc 40%,#fdf3f0);
    color:var(--text);
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:24px 14px;
  }
  .app{
    width:100%;
    max-width:680px;
  }
  header.top{
    text-align:center;
    margin-bottom:18px;
  }
  header.top h1{
    font-size:1.3rem;
    margin:0 0 4px;
    color:var(--primary-dark);
  }
  header.top p{
    margin:0;
    color:var(--muted);
    font-size:.9rem;
  }
  .card{
    background:var(--card);
    border-radius:var(--radius);
    box-shadow:0 6px 24px rgba(30,40,80,.08);
    padding:22px 20px 26px;
    border:1px solid var(--border);
  }
  .progress-wrap{
    margin-bottom:18px;
  }
  .progress-label{
    display:flex;
    justify-content:space-between;
    font-size:.85rem;
    color:var(--muted);
    margin-bottom:6px;
  }
  .progress-bar{
    background:#e7e9f2;
    border-radius:999px;
    height:8px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background:linear-gradient(90deg,var(--primary),#7288f0);
    border-radius:999px;
    transition:width .25s ease;
  }
  .question-text{
    font-size:1.12rem;
    line-height:1.6;
    font-weight:600;
    margin:6px 0 20px;
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .option{
    display:flex;
    align-items:flex-start;
    gap:12px;
    padding:13px 14px;
    border:1.5px solid var(--border);
    border-radius:10px;
    cursor:pointer;
    background:#fbfbfe;
    transition:border-color .15s, background .15s, transform .1s;
    font-size:1rem;
    line-height:1.5;
  }
  .option:hover{
    border-color:var(--primary);
    background:#f1f3ff;
  }
  .option.selected{
    border-color:var(--primary);
    background:#eaefff;
    box-shadow:0 0 0 2px rgba(52,84,209,.15);
  }
  .option.correct{
    border-color:var(--correct);
    background:var(--correct-bg);
  }
  .option.incorrect{
    border-color:var(--incorrect);
    background:var(--incorrect-bg);
  }
  .option .letter{
    flex:0 0 auto;
    width:28px;
    height:28px;
    border-radius:50%;
    background:#e7e9f2;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:700;
    font-size:.85rem;
    color:var(--text);
  }
  .option.correct .letter{
    background:var(--correct);
    color:#fff;
  }
  .option.incorrect .letter{
    background:var(--incorrect);
    color:#fff;
  }
  .option.selected .letter{
    background:var(--primary);
    color:#fff;
  }
  .option .mark{
    margin-left:auto;
    font-weight:700;
    font-size:1rem;
    flex:0 0 auto;
  }
  .option.correct .mark{color:var(--correct);}
  .option.incorrect .mark{color:var(--incorrect);}
  .nav-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:24px;
    gap:10px;
  }
  button{
    font-family:inherit;
    font-size:.95rem;
    font-weight:600;
    border:none;
    border-radius:10px;
    padding:12px 20px;
    cursor:pointer;
    transition:background .15s, transform .1s, opacity .15s;
  }
  button:active{transform:scale(.97);}
  .btn-primary{
    background:var(--primary);
    color:#fff;
  }
  .btn-primary:hover{background:var(--primary-dark);}
  .btn-secondary{
    background:#eef0f7;
    color:var(--text);
  }
  .btn-secondary:hover{background:#e2e5f0;}
  button:disabled{
    opacity:.45;
    cursor:not-allowed;
  }
  .hint{
    text-align:center;
    font-size:.82rem;
    color:var(--muted);
    margin-top:12px;
    min-height:1.1em;
  }
  /* Results */
  .results-summary{
    text-align:center;
    padding:10px 0 20px;
  }
  .score-circle{
    width:140px;
    height:140px;
    border-radius:50%;
    margin:0 auto 16px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    background:conic-gradient(var(--primary) calc(var(--pct)*1%), #e7e9f2 0);
    position:relative;
  }
  .score-circle::before{
    content:"";
    position:absolute;
    width:110px;
    height:110px;
    border-radius:50%;
    background:var(--card);
  }
  .score-circle .pct{
    position:relative;
    font-size:1.7rem;
    font-weight:800;
    color:var(--primary-dark);
  }
  .score-circle .lbl{
    position:relative;
    font-size:.75rem;
    color:var(--muted);
  }
  .score-detail{
    font-size:1.05rem;
    margin-bottom:4px;
  }
  .score-detail b{color:var(--correct);}
  .score-detail .wrong{color:var(--incorrect);}
  .review-toggle{
    display:block;
    margin:18px auto 0;
  }
  .review-list{
    margin-top:18px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .review-item{
    border:1.5px solid var(--border);
    border-radius:12px;
    padding:14px 16px;
  }
  .review-item.wrong{border-color:var(--incorrect);}
  .review-item.right{border-color:var(--correct);}
  .review-qnum{
    font-size:.78rem;
    font-weight:700;
    color:var(--muted);
    margin-bottom:4px;
  }
  .review-qtext{
    font-weight:600;
    margin-bottom:10px;
    line-height:1.5;
  }
  .review-answer-row{
    font-size:.92rem;
    padding:4px 0;
    display:flex;
    gap:8px;
  }
  .review-answer-row .tag{
    flex:0 0 auto;
    font-weight:700;
    font-size:.78rem;
    padding:2px 8px;
    border-radius:6px;
  }
  .tag.your-wrong{background:var(--incorrect-bg);color:var(--incorrect);}
  .tag.correct-tag{background:var(--correct-bg);color:var(--correct);}
  .restart-row{
    display:flex;
    justify-content:center;
    margin-top:22px;
  }
  .hidden{display:none !important;}
  footer.note{
    text-align:center;
    font-size:.75rem;
    color:#9aa0ad;
    margin-top:16px;
  }
  @media (max-width:480px){
    .card{padding:18px 14px 20px;}
    .question-text{font-size:1.02rem;}
    .option{padding:11px 12px;font-size:.95rem;}
    .score-circle{width:120px;height:120px;}
    .score-circle::before{width:94px;height:94px;}
  }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1>7ம் வகுப்பு தமிழ் — பருவம் 3, இயல் 3</h1>
    <p>வினா விடைகள் — Interactive Quiz</p>
  </header>

  <div class="card" id="quizCard">
    <div class="progress-wrap">
      <div class="progress-label">
        <span id="progressText">Question 1 of 100</span>
        <span id="scoreSoFar"></span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:1%"></div></div>
    </div>

    <div class="question-text" id="questionText"></div>
    <div class="options" id="optionsWrap"></div>

    <div class="nav-row">
      <button class="btn-secondary" id="prevBtn">&larr; முந்தையது</button>
      <button class="btn-primary" id="nextBtn" disabled>அடுத்தது &rarr;</button>
    </div>
    <div class="hint" id="hintText">சரியான விடையைத் தேர்ந்தெடுக்கவும்</div>
  </div>

  <div class="card hidden" id="resultsCard">
    <div class="results-summary">
      <div class="score-circle" id="scoreCircle" style="--pct:0">
        <div class="pct" id="scorePct">0%</div>
        <div class="lbl">SCORE</div>
      </div>
      <div class="score-detail">
        <b id="correctCount">0</b> சரி &nbsp;|&nbsp;
        <span class="wrong" id="wrongCount">0</span> தவறு &nbsp;|&nbsp;
        மொத்தம் <span id="totalCount">100</span> வினாக்கள்
      </div>
    </div>
    <button class="btn-secondary review-toggle" id="reviewToggle">விடைகளை மதிப்பாய்வு செய்க (Review Answers)</button>
    <div class="review-list hidden" id="reviewList"></div>
    <div class="restart-row">
      <button class="btn-primary" id="restartBtn">மீண்டும் தொடங்கு (Restart Quiz)</button>
    </div>
  </div>

  <footer class="note">Vagai Sudar &middot; 7th Std Tamil Term 3 Unit 3 &middot; ஆஃப்லைன் வினாடி வினா</footer>
</div>

<script>
// ---- Question data (extracted verbatim from source .docx, original order preserved) ----

let current = 0;
let answers = new Array(QUESTIONS.length).fill(null); // stores selected index or null

const questionText = document.getElementById('questionText');
const optionsWrap = document.getElementById('optionsWrap');
const progressText = document.getElementById('progressText');
const progressFill = document.getElementById('progressFill');
const scoreSoFar = document.getElementById('scoreSoFar');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const hintText = document.getElementById('hintText');
const quizCard = document.getElementById('quizCard');
const resultsCard = document.getElementById('resultsCard');

function renderQuestion(){
  const q = QUESTIONS[current];
  questionText.textContent = (current+1) + ". " + q.q;
  optionsWrap.innerHTML = "";
  const letters = ['A','B','C','D'];
  q.o.forEach((optText, idx) => {
    const div = document.createElement('div');
    div.className = 'option';
    div.innerHTML = '<span class="letter">'+letters[idx]+'</span><span class="opt-text">'+optText+'</span><span class="mark"></span>';
    div.addEventListener('click', () => selectOption(idx));
    optionsWrap.appendChild(div);
  });

  const selected = answers[current];
  if(selected !== null){
    revealAnswer(selected, false);
  }

  progressText.textContent = "Question " + (current+1) + " of " + QUESTIONS.length;
  progressFill.style.width = (((current+1)/QUESTIONS.length)*100) + "%";
  const answeredCount = answers.filter(a => a !== null).length;
  scoreSoFar.textContent = "பதிலளிக்கப்பட்டவை: " + answeredCount + "/" + QUESTIONS.length;

  prevBtn.disabled = (current === 0);
  nextBtn.disabled = (selected === null);
  nextBtn.textContent = (current === QUESTIONS.length - 1) ? "முடிவுகளைக் காண்க →" : "அடுத்தது →";
  hintText.textContent = selected === null ? "சரியான விடையைத் தேர்ந்தெடுக்கவும்" : "";
}

function selectOption(idx){
  if(answers[current] !== null) return; // already answered, lock it
  answers[current] = idx;
  revealAnswer(idx, true);
  nextBtn.disabled = false;
  hintText.textContent = "";
  const answeredCount = answers.filter(a => a !== null).length;
  scoreSoFar.textContent = "பதிலளிக்கப்பட்டவை: " + answeredCount + "/" + QUESTIONS.length;
}

function revealAnswer(selectedIdx, animate){
  const q = QUESTIONS[current];
  const opts = optionsWrap.querySelectorAll('.option');
  opts.forEach((opt, idx) => {
    opt.classList.remove('selected');
    const markEl = opt.querySelector('.mark');
    markEl.textContent = '';
    if(idx === q.c){
      opt.classList.add('correct');
      markEl.textContent = '✓';
    }
    if(idx === selectedIdx && selectedIdx !== q.c){
      opt.classList.add('incorrect');
      markEl.textContent = '✗';
    }
    if(idx === selectedIdx){
      opt.classList.add('selected');
    }
  });
}

prevBtn.addEventListener('click', () => {
  if(current > 0){
    current--;
    renderQuestion();
  }
});

nextBtn.addEventListener('click', () => {
  if(current < QUESTIONS.length - 1){
    current++;
    renderQuestion();
  } else {
    showResults();
  }
});

function showResults(){
  quizCard.classList.add('hidden');
  resultsCard.classList.remove('hidden');

  let correct = 0;
  answers.forEach((a, i) => { if(a === QUESTIONS[i].c) correct++; });
  const total = QUESTIONS.length;
  const wrong = total - correct;
  const pct = Math.round((correct/total)*100);

  document.getElementById('scoreCircle').style.setProperty('--pct', pct);
  document.getElementById('scorePct').textContent = pct + '%';
  document.getElementById('correctCount').textContent = correct;
  document.getElementById('wrongCount').textContent = wrong;
  document.getElementById('totalCount').textContent = total;

  const reviewList = document.getElementById('reviewList');
  reviewList.innerHTML = '';
  const letters = ['A','B','C','D'];
  QUESTIONS.forEach((q, i) => {
    const userAns = answers[i];
    const isCorrect = userAns === q.c;
    const div = document.createElement('div');
    div.className = 'review-item ' + (isCorrect ? 'right' : 'wrong');
    let html = '<div class="review-qnum">கேள்வி ' + (i+1) + '</div>';
    html += '<div class="review-qtext">' + q.q + '</div>';
    if(!isCorrect){
      html += '<div class="review-answer-row"><span class="tag your-wrong">உங்கள் விடை</span> ' +
        (userAns !== null ? letters[userAns] + ') ' + q.o[userAns] : 'பதிலளிக்கவில்லை') + '</div>';
    }
    html += '<div class="review-answer-row"><span class="tag correct-tag">சரியான விடை</span> ' +
      letters[q.c] + ') ' + q.o[q.c] + '</div>';
    div.innerHTML = html;
    reviewList.appendChild(div);
  });
}

document.getElementById('reviewToggle').addEventListener('click', function(){
  const rl = document.getElementById('reviewList');
  rl.classList.toggle('hidden');
  this.textContent = rl.classList.contains('hidden')
    ? 'விடைகளை மதிப்பாய்வு செய்க (Review Answers)'
    : 'மதிப்பாய்வை மறை (Hide Review)';
});

document.getElementById('restartBtn').addEventListener('click', function(){
  current = 0;
  answers = new Array(QUESTIONS.length).fill(null);
  resultsCard.classList.add('hidden');
  quizCard.classList.remove('hidden');
  document.getElementById('reviewList').classList.add('hidden');
  document.getElementById('reviewToggle').textContent = 'விடைகளை மதிப்பாய்வு செய்க (Review Answers)';
  renderQuestion();
  window.scrollTo({top:0, behavior:'smooth'});
});

renderQuestion();
</script>
</body>
</html>
